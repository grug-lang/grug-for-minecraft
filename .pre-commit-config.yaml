# Formats and lints the tracked Python and Java sources.
#
# Install the git hooks once with `pre-commit install`. CI runs the same hooks over every file with
# `pre-commit run --all-files`, so a file that is not already formatted fails the build.
#
# The Java hook needs a JDK on PATH (CI installs JDK 21; google-java-format itself is downloaded and
# cached by .github/scripts/google-java-format.sh).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      # Fix what it can, then let the formatter clean up the result.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: google-java-format
        name: google-java-format (AOSP)
        entry: .github/scripts/google-java-format.sh
        language: script
        # AOSP style is 4-space indentation with a 100-column limit, matching this repository.
        args: [--aosp, --replace]
        files: \.java$
        require_serial: true

      # Rewrites mod_api.md from mod_api.json, so a stale catalog fails the hook like an unformatted
      # file does and is fixed by committing the result.
      - id: mod-api-catalog
        name: mod_api.md catalog
        entry: python mod_api_catalog.py
        language: python
        files: ^(mod_api\.json|mod_api\.md|mod_api_catalog\.py)$
        pass_filenames: false

      # Fails a markdown line the writing rule would have wrapped, so a rewrap is not a pull request
      # of its own (#815, #817). A table row is exempt: markdown cannot wrap one. README.md and
      # CONTRIBUTING.md are not wrapped today, so the hook starts with the file agents edit.
      - id: markdown-columns
        name: markdown columns
        entry: python .github/scripts/markdown-columns.py
        language: python
        files: ^AGENTS\.md$
