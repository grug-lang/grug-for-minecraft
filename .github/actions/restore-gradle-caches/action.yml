name: Restore a loader's Gradle caches
description: >-
  The Gradle distribution, the rest of Gradle's user home and its downloaded dependencies, restored
  from the entries the loader jobs write, for a job that runs the repository's root Gradle build and
  nothing the loader jobs already cache. None of the three is written here.
inputs:
  loader:
    description: >-
      The loaders/* directory name the job's Gradle invocation is scoped to with
      -Dgrug.activeLoader. Its entries hold exactly that build's caches, so a job that passes another
      loader here restores a cache it resolves nothing from.
    required: true
runs:
  using: composite
  steps:
    # The same three entries .github/actions/setup-loader-build saves, which is why every expression
    # here has to stay identical to that action's DISTS_HASH, gradle and home keys rather than being
    # retyped from memory: a difference reads an entry nothing writes, which is a second copy of the
    # very distribution and caches #825 removed. They have to be edited together.
    #
    # Restore-only, and it has to stay that way. A job that runs only the root build unpacks only the
    # 8.14 root wrapper, and a cache key is written once, so saving from here would store an entry
    # without the 9.8 that every standalone loader's own build needs, which no later job could add.
    # 1.20.6-forge restores the first entry for the same reason and never writes it.
    #
    # The first replaces setup-java's `cache: gradle` wrapper entry, which held the same
    # ~/.gradle/wrapper (424.8 MB on Linux) under a second key beside this one, so the reference job
    # downloaded both copies on every run and the store held both. The other two replace the
    # dependency half of that cache.
    - name: Restore the Gradle distributions
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.gradle/wrapper
        key: grug-gradle-dists-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'loaders/*/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: grug-gradle-dists-${{ runner.os }}-

    # Gradle's version-specific caches: the compiled Kotlin build scripts, the generated Gradle API
    # jars, the artifact transforms and the file-hash cache. Measured locally on 2026-11-01 with
    # `GRADLE_USER_HOME=<empty> ./gradlew help -Dgrug.activeLoader=a1.1.2_01-ornithe --no-daemon`:
    # 31 s cold, 23 s with the wrapper warm and this directory empty, 4 s warm, and 199 MB of the
    # 208 MB the empty run leaves in ~/.gradle/caches is this directory.
    - name: Restore the rest of Gradle's user home
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches/[0-9]*
          ~/.gradle/caches/jars-*
          ~/.gradle/caches/journal-1
        key: grug-gradle-home-${{ runner.os }}-${{ inputs.loader }}-${{ hashFiles('.github/actions/setup-loader-build/action.yml', 'gradle.properties', 'settings.gradle.kts', 'gradle/jacoco-loader.gradle', format('loaders/{0}/gradle.properties', inputs.loader), format('loaders/{0}/gradle/wrapper/gradle-wrapper.properties', inputs.loader), format('loaders/{0}/settings.gradle', inputs.loader), format('loaders/{0}/settings.gradle.kts', inputs.loader), format('loaders/{0}/build.gradle', inputs.loader), format('loaders/{0}/build.gradle.kts', inputs.loader)) }}
        restore-keys: grug-gradle-home-${{ runner.os }}-${{ inputs.loader }}-

    # The dependencies and Gradle plugins themselves, which is the entry the loader job restores for
    # its own build. Without it, configuration resolves every plugin from the network on every run:
    # the core job's first task started 17.5 s after Gradle did with the two entries above restored
    # and 5 s with this one too (pull request #933's interleaved runs, 2026-11-01), because the
    # resolution makes a request per plugin and repository rather than downloading much.
    - name: Restore the Gradle dependencies
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.gradle/caches/modules-2
        key: grug-gradle-${{ runner.os }}-${{ inputs.loader }}-${{ hashFiles('.github/actions/setup-loader-build/action.yml', 'gradle.properties', 'settings.gradle.kts', 'gradle/jacoco-loader.gradle', format('loaders/{0}/gradle.properties', inputs.loader), format('loaders/{0}/gradle/wrapper/gradle-wrapper.properties', inputs.loader), format('loaders/{0}/settings.gradle', inputs.loader), format('loaders/{0}/settings.gradle.kts', inputs.loader), format('loaders/{0}/build.gradle', inputs.loader), format('loaders/{0}/build.gradle.kts', inputs.loader)) }}
        restore-keys: grug-gradle-${{ runner.os }}-${{ inputs.loader }}-
