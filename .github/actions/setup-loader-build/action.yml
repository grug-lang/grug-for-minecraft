name: Set up a loader build
description: >-
  The toolchain, the grug-rs static library and the caches a loader's Gradle build needs, shared by
  the layer job and the build job. The checkout stays in the workflow, because this action is
  read from it.
inputs:
  loader:
    description: The loaders/* directory name, which keys the per-loader caches.
    required: true
  save:
    description: >-
      Whether this job writes the loader's Gradle and Minecraft caches back at its end. Only a job
      that runs the game may: a cache entry is written once per key by whichever job finishes
      first, so a job that stops after the build would write one without what the game resolves.
    required: false
    default: 'true'
outputs:
  java21-path:
    description: JAVA_HOME of the JDK 21 this action installed.
    value: ${{ steps.java21.outputs.path }}
runs:
  using: composite
  steps:
    # No `cache: gradle` here (#782). It restored ~/.gradle/wrapper and ~/.gradle/caches, and the
    # entries below restore both again: the wrapper 424.8 MB on Linux and 273.9 MB on Windows, the
    # dependencies a second time. It also stored a second copy of the 425 MB distribution, which is
    # the family #699 audited. setup-java's entry is shared by every job in the workflow, so it held
    # what whichever job saved it first resolved, and that job is grug-rs.
    #
    # Nothing waits for it: "Cache the Gradle distributions" below restores the wrapper, and this
    # action is a step before the job's first Gradle invocation in both of its callers, so dropping
    # setup-java's copy never turns a warm distribution into a download.
    - name: Set up JDK 21
      id: java21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: 21

    - name: Download the grug-rs static library
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: grug-rs-library
        path: .grug-ci

    # A hit here means this push changed neither mod_api.json nor the generator, so the three
    # generated files are already the right ones and Gradle's own up-to-date check on
    # generateGrugAdapter skips the run.
    - name: Restore the generated adapter
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          core/build/generated/grug
          core/build/generated/sources/grug
        key: grug-adapter-${{ runner.os }}-${{ hashFiles('mod_api.json', 'core/generate.py') }}

    # The dependency cache each loader's build resolves against. setup-java's Gradle cache covered
    # this path and went in #782, because what it restored was whatever the job that saved it
    # happened to resolve, and the job that saves it is the one that ran first and resolved the
    # least: grug-rs, which only ever builds core on Gradle 8.14.
    #
    # One entry per loader. It used to be one entry for all five, and whichever loader finished first
    # wrote it and nobody wrote it again, so what it held was that loader's resolved subset. A
    # diagnostic on a throwaway branch (#433) listed the restored cache in all five jobs: 70 MB, 41
    # groups, no net.java.jinput:jinput:2.0.10 and no com.google.guava:guava:33.2.1-jre, so
    # 1.2.5-forge fetched them from Maven Central on every run and a 403 there failed its Build
    # step although the cache had restored successfully.
    #
    # Only a job that runs the game writes the entry (the save input). The layer job, which stops
    # after the build, used to write it first, because it is the quicker of the two, and the build
    # job's own write was then refused ("Unable to reserve cache"). What the layer job resolves does
    # not include the game's classpath: Loom resolves the natives, among them lwjgl-platform from
    # repo.legacyfabric.net, only for runClient. Every later run restored an entry without them and
    # asked that server for them in its Run tests step, so the server being down failed every
    # Alpha and Beta loader job although every cache had hit (#643). `gradle --offline
    # :extractNatives` after the layer job's build reproduces it: "No cached version of
    # org.lwjgl.lwjgl:lwjgl-platform:2.9.4+legacyfabric.15 available for offline mode".
    #
    # Keyed on every file that decides what is resolvable, so a version, repository or plugin bump
    # misses rather than restoring a graph that no longer matches the build, and on this file, which
    # decides the paths (the key has to describe the cache). The standalone loaders' own root.gradle
    # is not in the key because it resolves nothing: it registers the task that execs their own
    # wrapper.
    #
    # Only this loader's files, plus the shared ones. Every key here used to name every loader's
    # build files as well (loaders/*/), so an edit confined to one loader invalidated all five
    # loaders' three entries and rewrote about 3 GB of them, although a loader's job includes only
    # itself (-Dgrug.activeLoader) and so resolves nothing of the other four (#699).
    #
    # A miss still restores the loader's previous entry (restore-keys), because Gradle checks what it
    # restores and fetches only what changed. The Minecraft toolchain has no such fallback: its entry
    # names its versions.
    #
    # None of the three keys names the workflow (#777). A workflow names the jobs and the loader
    # matrix; what the entries hold is decided by the files above and by the paths the steps below
    # name, and a workflow edit changes neither. Hashing build.yml rekeyed every loader's three
    # entries on every edit of it, which is most days, and the toolchain, which has no fallback,
    # was fetched again on the first run after each one.
    - name: Work out the loader caches' keys
      id: keys
      shell: bash
      env:
        LOADER: ${{ inputs.loader }}
        GRADLE_HASH: ${{ hashFiles('.github/actions/setup-loader-build/action.yml', 'gradle.properties', 'settings.gradle.kts', 'gradle/jacoco-loader.gradle', format('loaders/{0}/gradle.properties', inputs.loader), format('loaders/{0}/gradle/wrapper/gradle-wrapper.properties', inputs.loader), format('loaders/{0}/settings.gradle', inputs.loader), format('loaders/{0}/settings.gradle.kts', inputs.loader), format('loaders/{0}/build.gradle', inputs.loader), format('loaders/{0}/build.gradle.kts', inputs.loader)) }}
        MINECRAFT_HASH: ${{ hashFiles('.github/actions/setup-loader-build/action.yml', 'gradle.properties', format('loaders/{0}/gradle.properties', inputs.loader), format('loaders/{0}/build.gradle', inputs.loader), format('loaders/{0}/build.gradle.kts', inputs.loader)) }}
        DISTS_HASH: ${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'loaders/*/gradle/wrapper/gradle-wrapper.properties') }}
      run: |
        {
          echo "dists=grug-gradle-dists-${RUNNER_OS}-${DISTS_HASH}"
          echo "dists-prefix=grug-gradle-dists-${RUNNER_OS}-"
          echo "gradle-prefix=grug-gradle-${RUNNER_OS}-${LOADER}-"
          echo "gradle=grug-gradle-${RUNNER_OS}-${LOADER}-${GRADLE_HASH}"
          echo "home-prefix=grug-gradle-home-${RUNNER_OS}-${LOADER}-"
          echo "home=grug-gradle-home-${RUNNER_OS}-${LOADER}-${GRADLE_HASH}"
          echo "build-state=grug-build-state-${RUNNER_OS}-${LOADER}-${GRADLE_HASH}"
          echo "build-state-prefix=grug-build-state-${RUNNER_OS}-${LOADER}-"
          echo "own-state=grug-own-state-${RUNNER_OS}-${LOADER}-${GRADLE_HASH}"
          echo "own-state-prefix=grug-own-state-${RUNNER_OS}-${LOADER}-"
          echo "minecraft=grug-minecraft-${RUNNER_OS}-${LOADER}-${MINECRAFT_HASH}"
        } >> "$GITHUB_OUTPUT"

    # The Gradle distributions themselves, in one entry per OS rather than in every loader's
    # dependency entry. ~/.gradle/wrapper holds the two every loader job unpacks: 8.14 for the root
    # build, which also publishes core for the four standalone loaders, and 9.8 for each loader's own
    # wrapper. On 1.20.6-forge they are 442 of the 577 MB its dependency entry unpacks, so keeping
    # them there stored the same 442 MB in all five Linux entries, 2.2 GB of every generation, and
    # every dependency change rewrote it (#699).
    #
    # Keyed on the wrapper properties that name the distributions and nothing else, because they are
    # all that decide what it holds: a dependency bump leaves it alone, and a version bump misses and
    # falls back to the previous entry, whose other distribution Gradle still finds, so only the new
    # version is downloaded.
    #
    # This is now the only entry that holds this directory in a job that uses this action:
    # setup-java's own gradle-wrapper entry held the same files and went with `cache: gradle`
    # (#782), which is why the step below has to stay ahead of the job's first Gradle invocation.
    #
    # 1.20.6-forge restores this entry but never writes it. It is not a standalone loader, so its job
    # runs only the root build and unpacks only 8.14; a key is written once, so a first write from
    # that job would leave an entry without 9.8, which the other four loaders' own wrappers need and
    # no later job could add. The four standalone jobs always hold both, because they publish core
    # with the root wrapper before building with their own.
    - name: Cache the Gradle distributions
      if: inputs.save == 'true' && inputs.loader != '1.20.6-forge'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.gradle/wrapper
        key: ${{ steps.keys.outputs.dists }}
        restore-keys: ${{ steps.keys.outputs.dists-prefix }}

    - name: Restore the Gradle distributions
      if: inputs.save != 'true' || inputs.loader == '1.20.6-forge'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.gradle/wrapper
        key: ${{ steps.keys.outputs.dists }}
        restore-keys: ${{ steps.keys.outputs.dists-prefix }}

    - name: Cache the Gradle dependencies
      if: inputs.save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.gradle/caches/modules-2
        key: ${{ steps.keys.outputs.gradle }}
        restore-keys: ${{ steps.keys.outputs.gradle-prefix }}

    - name: Restore the Gradle dependencies
      if: inputs.save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.gradle/caches/modules-2
        key: ${{ steps.keys.outputs.gradle }}
        restore-keys: ${{ steps.keys.outputs.gradle-prefix }}

    # The rest of Gradle's user home, which the entry above leaves out: the artifact-transform outputs
    # (the ASM instrumentation of the ForgeGradle plugin jars), the file-hash cache (the Minecraft and
    # Forge jars), the Java compile classpath snapshots, the compiled build scripts and the generated
    # Gradle API jars, in one directory per Gradle version (8.14 for the root build, 9.8 for the
    # standalone loaders, which run both), plus jars-9 and journal-1. A fresh runner rebuilt all of it
    # on every run, and restoring it took 9 to 23 s off the Gradle phase in 10 interleaved pairs per
    # loader: 10.1 s on 1.20.6-forge, 9.2 s on a1.1.2_01-ornithe, 10.1 s on b1.7.3-ornithe and 22.9 s
    # on b1.7.3-stationapi, each with a 95% interval well clear of 0 (#701).
    #
    # It is written by the same jobs as the entries around it, those that run the game, for the same
    # reason: the layer job stops after the build and would write an entry the game's tasks never
    # touched. Gradle does not trust what it finds here: everything is keyed by content hash or checked
    # against the file on disk, so a stale entry costs the saving and never changes a result. Keyed and
    # falling back like the dependency entry above, for the same reason.
    #
    # 1.2.5-forge is left out: it does not provision a Minecraft through ForgeGradle (see the snapshot
    # below), so there is little here for it to reuse, and over 10 pairs it saved a CPU-adjusted 2.5 s
    # of its Gradle phase with an interval that includes 0 (p 0.079) and its whole job did not move.
    - name: Cache the rest of Gradle's user home
      if: inputs.loader != '1.2.5-forge' && inputs.save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches/[0-9]*
          ~/.gradle/caches/jars-*
          ~/.gradle/caches/journal-1
        key: ${{ steps.keys.outputs.home }}
        restore-keys: ${{ steps.keys.outputs.home-prefix }}

    - name: Restore the rest of Gradle's user home
      if: inputs.loader != '1.2.5-forge' && inputs.save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches/[0-9]*
          ~/.gradle/caches/jars-*
          ~/.gradle/caches/journal-1
        key: ${{ steps.keys.outputs.home }}
        restore-keys: ${{ steps.keys.outputs.home-prefix }}

    # The project's own Gradle state, which every job rebuilt from nothing: the task history Gradle
    # keeps in the project's .gradle directory, and the outputs it compares against, in core/build
    # and the loader's build directory. A fresh checkout has neither, so every task runs again; with
    # both restored, Gradle skips the ones whose declared inputs this commit did not touch, which is
    # all of the Minecraft/Forge/Loom toolchain work and, on a commit that changes no Java, the
    # compiles too.
    #
    # The key is not the guard, which is what makes this sound where a hand-written key was not
    # (#629): it says only where the state lives. Gradle hashes the inputs its build declares and
    # compares them with what the entry holds, so a stale entry costs the saving and never a stale
    # class. What that leaves is the one risk a fresh checkout did not carry: a task with an
    # undeclared input would be up to date against a state it never produced, which is exactly the
    # trust a developer's incremental build already places.
    #
    # It is written by the same jobs as the entries around it, those that run the game, and keyed and
    # falling back like them, so a commit that changes a build file misses and saves a new one.
    #
    # Measured on 2026-10-30 in the throwaway harness of #713: one job per loader, the arms
    # alternating pass by pass on one runner, a discarded warm-up first, seconds from the launch to
    # the runClient task, four pairs against a control with no restore and a core method body changed
    # (the shape of a normal pull request): -8.0 s on 1.20.6-forge, -16.1 s on b1.7.3-stationapi,
    # -5.7 s on b1.7.3-ornithe and -4.1 s on a1.1.2_01-ornithe, every interval clear of 0 at p 0.002
    # or below. With only one bundled mod changed instead, 1.20.6-forge saves 8.9 s, b1.7.3-ornithe
    # 10.1 s, a1.1.2_01-ornithe 6.5 s and b1.7.3-stationapi about 18 s by median, its median being
    # what two hiccup passes in that job leave usable.
    # The entry packs to 27 to 141 MB per loader and took 1 to 7 s to download and unpack here, which
    # the numbers above already have taken off.
    #
    # What is left to the up-to-date check is a task whose declared inputs are incomplete. A fresh
    # checkout could never skip such a task; this change can, which is the one risk it adds.
    #
    # 1.2.5-forge has the same entry. It was left out at first because its 170MB MCP snapshot lived
    # inside its build directory, which would have stored the snapshot a second time beside its own
    # entry; the snapshot now lives in loaders/1.2.5-forge/mcp125, so the two entries do not overlap.
    # Almost all of its task part is MCP toolchain work a restored history leaves up to date (#706).
    # Over five interleaved pairs the Gradle phase fell from 21.2 s to 8.4 s with a core method body
    # changed and from 18.8 s to 8.4 s with only a bundled mod changed, every variant sample an exact
    # hit on the key the action computed (#736). It packs to 36.6MB, its own .gradle to 0.4MB.
    - name: Cache the build state
      if: inputs.save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .gradle
          core/build
          loaders/${{ inputs.loader }}/build
        key: ${{ steps.keys.outputs.build-state }}
        restore-keys: ${{ steps.keys.outputs.build-state-prefix }}

    - name: Restore the build state
      if: inputs.save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .gradle
          core/build
          loaders/${{ inputs.loader }}/build
        key: ${{ steps.keys.outputs.build-state }}
        restore-keys: ${{ steps.keys.outputs.build-state-prefix }}

    # A standalone loader is its own Gradle build, with a .gradle of its own that holds the history
    # of its tasks: Loom's remapping, the jar, the layer, and on 1.2.5 the MCP toolchain's. 1.20.6-forge
    # is built by the root build and has no such directory.
    - name: Cache the loader's own build state
      if: inputs.loader != '1.20.6-forge' && inputs.save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: loaders/${{ inputs.loader }}/.gradle
        key: ${{ steps.keys.outputs.own-state }}
        restore-keys: ${{ steps.keys.outputs.own-state-prefix }}

    - name: Restore the loader's own build state
      if: inputs.loader != '1.20.6-forge' && inputs.save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: loaders/${{ inputs.loader }}/.gradle
        key: ${{ steps.keys.outputs.own-state }}
        restore-keys: ${{ steps.keys.outputs.own-state-prefix }}

    # The Minecraft itself, which is what Loom and ForgeGradle spend the Build step on. It was never
    # in setup-java's Gradle cache, which this action no longer uses anyway (#782): that key belongs
    # to whichever job saves it first, and the lightest job in this workflow is grug-rs, which never
    # resolves a Minecraft, so it won and the Forge and Loom content never got in. Keyed per loader,
    # because ForgeGradle and Loom both write to the same directory and no loader may restore
    # another's, and on the files that name the Minecraft and mapping versions, so a version bump
    # misses instead of serving the old one.
    #
    # Which means loaders/*/gradle.properties and not just the build files: that is where every
    # loader's minecraft_version and mappings actually live, a subproject's properties file overriding
    # the root one, so a bump there with the key unchanged restores the old Minecraft.
    #
    # Not the workflow, as it used to be: an edit of build.yml rekeyed this entry on every loader and
    # the entry has no restore-keys, so the first run after every workflow edit fetched the toolchain
    # again. The versions above and the action's own paths are what this entry holds.
    #
    # Not the assets: downloadAssets takes 1.9s from resources.download.minecraft.net, which is not
    # worth the 500MB the asset index and objects take in the entry. 1.2.5-forge is excluded
    # entirely, because it does not provision a Minecraft at all (see the snapshot below), so none of
    # these paths would exist there and the action would report that no cache was saved.
    - name: Cache the Minecraft toolchain
      if: inputs.loader != '1.2.5-forge' && inputs.save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches/forge_gradle/mcp_repo
          ~/.gradle/caches/forge_gradle/minecraft_repo
          ~/.gradle/caches/forge_gradle/minecraft_user_repo
          ~/.gradle/caches/forge_gradle/maven_downloader
          ~/.gradle/caches/fabric-loom
          ~/.gradle/caches/ornithe-keratin
        key: ${{ steps.keys.outputs.minecraft }}

    - name: Restore the Minecraft toolchain
      if: inputs.loader != '1.2.5-forge' && inputs.save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches/forge_gradle/mcp_repo
          ~/.gradle/caches/forge_gradle/minecraft_repo
          ~/.gradle/caches/forge_gradle/minecraft_user_repo
          ~/.gradle/caches/forge_gradle/maven_downloader
          ~/.gradle/caches/fabric-loom
          ~/.gradle/caches/ornithe-keratin
        key: ${{ steps.keys.outputs.minecraft }}

    # 1.2.5-forge's Minecraft is the pinned MCP snapshot its build clones, 170MB into a directory of
    # its own beside the build directory, which is 13s of its Build step. Keyed on the build file that
    # holds the pin, so a different snapshot misses rather than restoring the previous one. The key
    # carries a version because the path it restores into changed (#736): an entry from the old key
    # would unpack the snapshot into build/, where the build-state entry would store it as well.
    #
    # Not the workflow (#783), for the same reason as the entries above: build.yml names the job, and
    # the pin is the build file's. Hashing it rekeyed this entry on every edit of the workflow, and
    # the entry has no restore-keys, so the first run after each edit cloned the snapshot again.
    - name: Cache the 1.2.5 MCP snapshot
      if: inputs.loader == '1.2.5-forge'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: loaders/1.2.5-forge/mcp125
        key: grug-mcp125-v2-${{ runner.os }}-${{ hashFiles('loaders/1.2.5-forge/build.gradle') }}
