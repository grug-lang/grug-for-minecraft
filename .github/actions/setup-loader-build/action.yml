name: Set up a loader build
description: >-
  The toolchain, the grug-rs static library and the caches a loader's Gradle build needs, shared by
  the layer job and the build job. The checkout stays in the workflow, because this action is
  read from it.
inputs:
  loader:
    description: The loaders/* directory name, which keys the per-loader caches.
    required: true
  save:
    description: >-
      Whether this job writes the loader's Gradle and Minecraft caches back at its end. Only a job
      that runs the game may: a cache entry is written once per key by whichever job finishes
      first, so a job that stops after the build would write one without what the game resolves.
    required: false
    default: 'true'
outputs:
  java21-path:
    description: JAVA_HOME of the JDK 21 this action installed.
    value: ${{ steps.java21.outputs.path }}
runs:
  using: composite
  steps:
    - name: Set up JDK 21
      id: java21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: 21
        cache: gradle

    - name: Download the grug-rs static library
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: grug-rs-library
        path: .grug-ci

    # A hit here means this push changed neither mod_api.json nor the generator, so the three
    # generated files are already the right ones and Gradle's own up-to-date check on
    # generateGrugAdapter skips the run.
    - name: Restore the generated adapter
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          core/build/generated/grug
          core/build/generated/sources/grug
        key: grug-adapter-${{ runner.os }}-${{ hashFiles('mod_api.json', 'core/generate.py', '.github/workflows/build.yml') }}

    # Gradle's own state on the loader side: the distribution each loader's wrapper pins and the
    # dependency cache its build resolves against. cache: gradle above covers both paths, but what it
    # restores is whatever the job that saved it happened to resolve, and the job that saves it is the
    # one that ran first and resolved the least: grug-rs, which only ever builds core on Gradle 8.14.
    # So every loader was downloading its own Gradle distribution again on every run. Removing the
    # "Fetching distribution" line from every loader's log is what this bought, and it is the whole
    # of what it bought.
    #
    # One entry per loader. It used to be one entry for all five, and whichever loader finished first
    # wrote it and nobody wrote it again, so what it held was that loader's resolved subset. A
    # diagnostic on a throwaway branch (#433) listed the restored cache in all five jobs: 70 MB, 41
    # groups, no net.java.jinput:jinput:2.0.10 and no com.google.guava:guava:33.2.1-jre, so
    # 1.2.5-forge fetched them from Maven Central on every run and a 403 there failed its Build
    # step although the cache had restored successfully.
    #
    # Only a job that runs the game writes the entry (the save input). The layer job, which stops
    # after the build, used to write it first, because it is the quicker of the two, and the build
    # job's own write was then refused ("Unable to reserve cache"). What the layer job resolves does
    # not include the game's classpath: Loom resolves the natives, among them lwjgl-platform from
    # repo.legacyfabric.net, only for runClient. Every later run restored an entry without them and
    # asked that server for them in its Run tests step, so the server being down failed every
    # Alpha and Beta loader job although every cache had hit (#643). `gradle --offline
    # :extractNatives` after the layer job's build reproduces it: "No cached version of
    # org.lwjgl.lwjgl:lwjgl-platform:2.9.4+legacyfabric.15 available for offline mode".
    #
    # Keyed on every file that decides what is resolvable, so a version, repository or plugin bump
    # misses rather than restoring a graph that no longer matches the build, and on this file, which
    # decides the paths (the key has to describe the cache). The standalone loaders' own root.gradle
    # is not in the key because it resolves nothing: it registers the task that execs their own
    # wrapper.
    #
    # A miss still restores the loader's previous entry (restore-keys), because Gradle checks what it
    # restores and fetches only what changed. Without it every edit of build.yml, which is most days,
    # sent the next run of every ref to the network for everything, repo.legacyfabric.net included.
    # The Minecraft toolchain has no such fallback: its entry names its versions.
    - name: Work out the loader caches' keys
      id: keys
      shell: bash
      env:
        LOADER: ${{ inputs.loader }}
        GRADLE_HASH: ${{ hashFiles('.github/workflows/build.yml', '.github/actions/setup-loader-build/action.yml', 'gradle.properties', 'settings.gradle.kts', 'gradle/jacoco-loader.gradle', 'loaders/*/gradle.properties', 'loaders/*/gradle/wrapper/gradle-wrapper.properties', 'loaders/*/settings.gradle', 'loaders/*/settings.gradle.kts', 'loaders/*/build.gradle', 'loaders/*/build.gradle.kts') }}
        MINECRAFT_HASH: ${{ hashFiles('.github/workflows/build.yml', '.github/actions/setup-loader-build/action.yml', 'gradle.properties', 'loaders/*/gradle.properties', 'loaders/*/build.gradle', 'loaders/*/build.gradle.kts') }}
      run: |
        {
          echo "gradle-prefix=grug-gradle-${RUNNER_OS}-${LOADER}-"
          echo "gradle=grug-gradle-${RUNNER_OS}-${LOADER}-${GRADLE_HASH}"
          echo "home-prefix=grug-gradle-home-${RUNNER_OS}-${LOADER}-"
          echo "home=grug-gradle-home-${RUNNER_OS}-${LOADER}-${GRADLE_HASH}"
          echo "minecraft=grug-minecraft-${RUNNER_OS}-${LOADER}-${MINECRAFT_HASH}"
        } >> "$GITHUB_OUTPUT"

    - name: Cache the Gradle distributions and dependencies
      if: inputs.save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/wrapper
          ~/.gradle/caches/modules-2
        key: ${{ steps.keys.outputs.gradle }}
        restore-keys: ${{ steps.keys.outputs.gradle-prefix }}

    - name: Restore the Gradle distributions and dependencies
      if: inputs.save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/wrapper
          ~/.gradle/caches/modules-2
        key: ${{ steps.keys.outputs.gradle }}
        restore-keys: ${{ steps.keys.outputs.gradle-prefix }}

    # The rest of Gradle's user home, which the entry above leaves out: the artifact-transform outputs
    # (the ASM instrumentation of the ForgeGradle plugin jars), the file-hash cache (the Minecraft and
    # Forge jars), the Java compile classpath snapshots, the compiled build scripts and the generated
    # Gradle API jars, in one directory per Gradle version (8.14 for the root build, 9.8 for the
    # standalone loaders, which run both), plus jars-9 and journal-1. A fresh runner rebuilt all of it
    # on every run, and restoring it took 9 to 23 s off the Gradle phase in 10 interleaved pairs per
    # loader: 10.1 s on 1.20.6-forge, 9.2 s on a1.1.2_01-ornithe, 10.1 s on b1.7.3-ornithe and 22.9 s
    # on b1.7.3-stationapi, each with a 95% interval well clear of 0 (#701).
    #
    # It is written by the same jobs as the entries around it, those that run the game, for the same
    # reason: the layer job stops after the build and would write an entry the game's tasks never
    # touched. Gradle does not trust what it finds here: everything is keyed by content hash or checked
    # against the file on disk, so a stale entry costs the saving and never changes a result. Keyed and
    # falling back like the dependency entry above, for the same reason.
    #
    # 1.2.5-forge is left out: it does not provision a Minecraft through ForgeGradle (see the snapshot
    # below), so there is little here for it to reuse, and over 10 pairs it saved a CPU-adjusted 2.5 s
    # of its Gradle phase with an interval that includes 0 (p 0.079) and its whole job did not move.
    - name: Cache the rest of Gradle's user home
      if: inputs.loader != '1.2.5-forge' && inputs.save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches/[0-9]*
          ~/.gradle/caches/jars-*
          ~/.gradle/caches/journal-1
        key: ${{ steps.keys.outputs.home }}
        restore-keys: ${{ steps.keys.outputs.home-prefix }}

    - name: Restore the rest of Gradle's user home
      if: inputs.loader != '1.2.5-forge' && inputs.save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches/[0-9]*
          ~/.gradle/caches/jars-*
          ~/.gradle/caches/journal-1
        key: ${{ steps.keys.outputs.home }}
        restore-keys: ${{ steps.keys.outputs.home-prefix }}

    # The Minecraft itself, which is what Loom and ForgeGradle spend the Build step on. It cannot go in
    # cache: gradle above, because that key belongs to whichever job saves it first, and the lightest
    # job in this workflow is grug-rs, which never resolves a Minecraft, so it wins and the Forge
    # and Loom content never gets in. Keyed per loader, because ForgeGradle and Loom both write to
    # the same directory and no loader may restore another's, and on the files that name the
    # Minecraft and mapping versions, so a version bump misses instead of serving the old one.
    #
    # Which means loaders/*/gradle.properties and not just the build files: that is where every
    # loader's minecraft_version and mappings actually live, a subproject's properties file overriding
    # the root one, so a bump there with the key unchanged restores the old Minecraft.
    #
    # Not the assets: downloadAssets takes 1.9s from resources.download.minecraft.net, which is not
    # worth the 500MB the asset index and objects take in the entry. 1.2.5-forge is excluded
    # entirely, because it does not provision a Minecraft at all (see the snapshot below), so none of
    # these paths would exist there and the action would report that no cache was saved.
    - name: Cache the Minecraft toolchain
      if: inputs.loader != '1.2.5-forge' && inputs.save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches/forge_gradle/mcp_repo
          ~/.gradle/caches/forge_gradle/minecraft_repo
          ~/.gradle/caches/forge_gradle/minecraft_user_repo
          ~/.gradle/caches/forge_gradle/maven_downloader
          ~/.gradle/caches/fabric-loom
          ~/.gradle/caches/ornithe-keratin
        key: ${{ steps.keys.outputs.minecraft }}

    - name: Restore the Minecraft toolchain
      if: inputs.loader != '1.2.5-forge' && inputs.save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches/forge_gradle/mcp_repo
          ~/.gradle/caches/forge_gradle/minecraft_repo
          ~/.gradle/caches/forge_gradle/minecraft_user_repo
          ~/.gradle/caches/forge_gradle/maven_downloader
          ~/.gradle/caches/fabric-loom
          ~/.gradle/caches/ornithe-keratin
        key: ${{ steps.keys.outputs.minecraft }}

    # 1.2.5-forge's Minecraft is the pinned MCP snapshot its build clones, 170MB into its own build
    # directory, which is 13s of its Build step. Keyed on the build file that holds the pin, so a
    # different snapshot misses rather than restoring the previous one.
    - name: Cache the 1.2.5 MCP snapshot
      if: inputs.loader == '1.2.5-forge'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: loaders/1.2.5-forge/build/mcp125
        key: grug-mcp125-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml', 'loaders/1.2.5-forge/build.gradle') }}
