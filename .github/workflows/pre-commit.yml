name: Pre-commit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      # The Java hook shells out to `java -jar`; google-java-format itself is fetched by the hook.
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      # ~/.cache/pre-commit holds the hook environments (ruff); the other directory holds the
      # pinned google-java-format jar.
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pre-commit
            ~/.cache/grug-google-java-format
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Pinned so a run cannot change under a pull request that did not touch this file. The hook
      # environments the hooks themselves pin are in .pre-commit-config.yaml.
      - name: Install pre-commit
        run: pip install pre-commit==4.6.2

      # --show-diff-on-failure prints exactly what a formatter or autofix changed, so a failing run
      # is self-explanatory.
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always
