name: Timing

# Started by hand, for a run someone wants a breakdown of. It is not part of the Build pipeline, so
# the report costs nothing unless somebody asks for it (#618). The same report is
# `python3 .github/scripts/ci_timing.py <run-id>` on a local machine.
on:
  workflow_dispatch:
    inputs:
      run-id:
        description: 'Id of the run to report on, from `gh run list`'
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  timing:
    name: timing report
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts/ci_timing.py

      - name: Report the time
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run-id }}
        run: python3 -I .github/scripts/ci_timing.py "$RUN_ID" --repo "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
