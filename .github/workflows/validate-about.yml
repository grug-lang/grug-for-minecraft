name: Validate Mod Metadata

on:
  pull_request:
    paths:
      - 'about_schema.json'
      - 'about_schema.py'
      - 'about_schema_test.py'
      - 'recreation.py'
      - 'recreation_test.py'
      - 'dead_links.py'
      - 'dead_links_test.py'
      - 'mods/**/about.json'
      - '.github/workflows/validate-about.yml'
      - '.github/workflows/regenerate-goldens.yml'
  # Rot does not wait for a pull request. Without this, a url that dies is only noticed when somebody
  # happens to edit metadata, which could be months. `paths` does not apply to a schedule, so this
  # runs the whole workflow, which is what a periodic health check should do.
  schedule:
    - cron: '17 6 * * 1'

jobs:
  validate-about:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install jsonschema==4.26.0

      - name: Validate about.json files
        run: |
          python3 about_schema.py

      - name: Test the schema and its recreation rules
        run: |
          python3 about_schema_test.py

      - name: Test the artifact handling
        run: |
          python3 recreation_test.py

      - name: Test the dead url check
        run: |
          python3 dead_links_test.py

      # Every artifact is a network fetch, so this is its own step rather than part of a test. Scope
      # it to every mod with a recreation block for now; at scale it should be scoped to the mods
      # the pull request changes.
      - name: Fetch and hash-verify recreation artifacts
        run: |
          python3 recreation.py verify-all mods

      # Also a network fetch, and the other half of the same metadata: this checks the repository,
      # license, and derived_from urls, which nothing else ever requests. The recreation artifact
      # urls are skipped here because the step above already downloaded and hashed them.
      #
      # A dead url fails, because that is a metadata defect with a real fix. A 5xx or a 403 is
      # reported without failing, so an outage on someone else's host cannot hold a change hostage.
      # The check spaces requests per host; lower it only if a host starts rate limiting.
      - name: Check the source urls still resolve
        run: |
          python3 dead_links.py mods
