name: Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Emits one matrix entry per loaders/* directory.
  discover:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover loaders
        id: discover
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, pathlib
          loaders = sorted(p.name for p in pathlib.Path("loaders").iterdir() if p.is_dir())
          print("matrix=" + json.dumps(loaders))
          EOF

  # grug-rs builds once per run and the loader jobs link the very same libgruggers.a. It depends on
  # nothing in this repository except the revision core/build.gradle.kts pins, so before this job each
  # of the five loader jobs (and the core job) repeated a git fetch and a cargo build on identical
  # inputs. An artifact from this run cannot be a stale one: it is produced by this workflow, on the
  # same runner image, from the revision this commit pins.
  grug-rs:
    name: build grug-rs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Part of the key because it is what built the library: a .a from a different rustc carries a
      # different metadata version, which is a link error rather than a silently wrong library, but
      # naming it in the key means the cache simply misses instead.
      - name: Read the Rust version
        id: rust
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"

      # Keyed on the file holding the pinned revision, so a ref bump rebuilds and anything else hits.
      # This workflow is in its own caches' keys, everywhere below as well, because the key has to
      # describe the cache and not only its inputs: the list of paths is part of what is being
      # described, and a key that ignored it would go on restoring an entry holding something else
      # after the paths changed.
      - name: Restore the static library
        id: grugRsLibrary
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: core/build/grug-rs/target/release/libgruggers.a
          key: grug-rs-library-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('core/build.gradle.kts', '.github/workflows/build.yml') }}

      - name: Build the static library
        if: steps.grugRsLibrary.outputs.cache-hit != 'true'
        run: ./gradlew :core:cloneGrugRs :core:buildGrugRs -Dgrug.activeLoader=a1.1.2_01-ornithe

      - name: Save the static library
        if: steps.grugRsLibrary.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: core/build/grug-rs/target/release/libgruggers.a
          key: grug-rs-library-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('core/build.gradle.kts', '.github/workflows/build.yml') }}

      - name: Upload the static library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grug-rs-library
          path: core/build/grug-rs/target/release/libgruggers.a
          if-no-files-found: error
          retention-days: 7

  core:
    name: core tests
    needs: grug-rs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Waits on the grug-rs job, which is why the static library is downloaded before anything runs:
      # core's tests load libadapter.so, so they need the library this commit links against.
      - name: Download the grug-rs static library
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: grug-rs-library
          path: .grug-ci

      # A hit here means this push changed neither mod_api.json nor the generator, and the three
      # generated files are already the right ones, so generateGrugAdapter is up to date and does not
      # run again. Those two files are its whole input set, so the key is everything it depends on.
      - name: Restore the generated adapter
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            core/build/generated/grug
            core/build/generated/sources/grug
          key: grug-adapter-${{ runner.os }}-${{ hashFiles('mod_api.json', 'core/generate.py', '.github/workflows/build.yml') }}

      # The active-loader property scopes the settings to core plus one no-op loader, so this job
      # doesn't configure every loader's build plugins just to run core's JUnit tests. The prebuilt
      # property is what run-loader.sh passes for the loader jobs: core's tests load libadapter.so,
      # so they need the static library this commit links against.
      - name: Test core
        run: ./gradlew :core:test -Dgrug.activeLoader=a1.1.2_01-ornithe -Pgrug.prebuiltGrugRs="${{ github.workspace }}/.grug-ci/libgruggers.a"

      - name: Test the grug adapter generator
        run: python3 core/test_generate.py

      # The canonical vanilla block name table is what makes a block name mean one block on all five
      # loaders. Checked on its own because a bad row would otherwise only show up as a wrong block
      # in a game run.
      - name: Check the vanilla block name table
        run: |
          python3 vanilla_blocks.py
          python3 vanilla_blocks_test.py

      # A Rust panic in grug-rs aborts the JVM instead of failing a test, so run-loader.sh has to
      # recognize that shape and explain it. Nothing else in CI can catch a regression there: the
      # panic is intermittent, so the only check is the reporter against a log that holds one, and
      # a faked run for the classification around it.
      - name: Test the native-abort reporter and the run script
        run: |
          python3 .github/scripts/report_native_abort_test.py
          python3 .github/scripts/run_loader_test.py

      # The four standalone loaders resolve core from the repository the root build publishes it
      # into. Every loader job here has one checkout, so a hand-off that reached a shared directory
      # would resolve the right jar and nothing would notice. This is the check that says otherwise,
      # against a miniature repository and real Gradle.
      - name: Test the core hand-off
        run: python3 .github/scripts/grug_core_handoff_test.py
      # The coverage job used to ask Gradle for this path, which cost it a cold Gradle start (~35s)
      # for one string. This job has already resolved core's dependencies and has a Gradle home with
      # them in, so it resolves the jar instead, and the version stays the jacoco plugin's own with no
      # second place to keep it in sync. Note that gradle.properties sets org.gradle.daemon=false, so
      # this is a second daemon fork rather than a warm one: what it saves is the resolution and the
      # cold cache, not the startup. Staged under a fixed name because only the upload step reads it.
      - name: Locate the JaCoCo CLI
        run: |
          cli=$(./gradlew -q :core:printJacocoCliPath -Dgrug.activeLoader=a1.1.2_01-ornithe | grep '^JACOCO_CLI=' | cut -d= -f2)
          mkdir -p coverage/tools
          cp "$cli" coverage/tools/jacoco-cli.jar

      # The coverage job downloads these to build the combined report the coverage gate checks.
      - name: Upload the coverage exec
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-exec-core
          path: core/build/jacoco/test.exec
          if-no-files-found: error
          retention-days: 7

      - name: Upload the compiled classes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-classes-core
          path: core/build/classes/java/main
          if-no-files-found: error
          retention-days: 7

      - name: Upload the JaCoCo CLI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-cli
          path: coverage/tools/jacoco-cli.jar
          if-no-files-found: error
          retention-days: 7

  build:
    name: ${{ matrix.dir }}
    needs: [discover, grug-rs]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        id: java21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The 1.2.5 loader boots its game on Java 8. Install a JDK 8 alongside the build JDK and hand
      # its path to the loader through GRUG_JAVA8. JAVA_HOME goes back to 21 afterwards so the
      # Gradle 9 wrapper the standalone loaders use can still run.
      - name: Set up JDK 8 (1.2.5-forge only)
        if: matrix.dir == '1.2.5-forge'
        id: java8
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 8

      - name: Restore JDK 21 for Gradle (1.2.5-forge only)
        if: matrix.dir == '1.2.5-forge'
        run: echo "JAVA_HOME=${{ steps.java21.outputs.path }}" >> "$GITHUB_ENV"

      - name: Download the grug-rs static library
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: grug-rs-library
          path: .grug-ci

      # A hit here means this push changed neither mod_api.json nor the generator, so the three
      # generated files are already the right ones and Gradle's own up-to-date check on
      # generateGrugAdapter skips the run.
      - name: Restore the generated adapter
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            core/build/generated/grug
            core/build/generated/sources/grug
          key: grug-adapter-${{ runner.os }}-${{ hashFiles('mod_api.json', 'core/generate.py', '.github/workflows/build.yml') }}

      # Gradle's own state on the loader side: the distribution each loader's wrapper pins and the
      # dependency cache its build resolves against. cache: gradle above covers both paths, but what it
      # restores is whatever the job that saved it happened to resolve, and the job that saves it is the
      # one that ran first and resolved the least: grug-rs, which only ever builds core on Gradle 8.14.
      # So every loader was downloading its own Gradle distribution again on every run. Removing the
      # "Fetching distribution" line from every loader's log is what this bought, and it is the whole
      # of what it bought.
      #
      # One entry for all five, which is also its limit: only the first loader to finish writes it, so
      # what lands in it is that loader's resolved subset and not the union, and once the key exists
      # nobody writes it again, so a dependency added to a later loader afterwards is never cached.
      # Measured, the parts that leaves out cost nothing visible, because the loader-specific gaps are
      # not where the time goes: b1.7.3-stationapi's window between starting Gradle and "> Configure
      # project" is 27s both with and without its scripts cached, and that window has no network
      # activity in it at all, so what is in there is not resolution. Per-loader keys would close the
      # coverage gap; that they would gain nothing more is reasoned from that window, not measured.
      #
      # Keyed on every file that decides what is resolvable, so a version, repository or plugin bump
      # misses rather than restoring a graph that no longer matches the build. The standalone loaders'
      # own root.gradle is not in the key because it resolves nothing: it registers the task that execs
      # their own wrapper.
      - name: Cache the Gradle distributions and dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches/modules-2
          key: grug-gradle-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml', 'gradle.properties', 'settings.gradle.kts', 'gradle/jacoco-loader.gradle', 'loaders/*/gradle.properties', 'loaders/*/gradle/wrapper/gradle-wrapper.properties', 'loaders/*/settings.gradle', 'loaders/*/settings.gradle.kts', 'loaders/*/build.gradle', 'loaders/*/build.gradle.kts') }}

      # The Minecraft itself, which is what Loom and ForgeGradle spend the Build step on. It cannot go in
      # cache: gradle above, because that key belongs to whichever job saves it first, and the lightest
      # job in this workflow is grug-rs, which never resolves a Minecraft, so it wins and the Forge
      # and Loom content never gets in. Keyed per loader, because ForgeGradle and Loom both write to
      # the same directory and no loader may restore another's, and on the files that name the
      # Minecraft and mapping versions, so a version bump misses instead of serving the old one.
      #
      # Which means loaders/*/gradle.properties and not just the build files: that is where every
      # loader's minecraft_version and mappings actually live, a subproject's properties file overriding
      # the root one, so a bump there with the key unchanged restores the old Minecraft.
      #
      # Not the assets: downloadAssets takes 1.9s from resources.download.minecraft.net, which is not
      # worth the 500MB the asset index and objects take in the entry. 1.2.5-forge is excluded
      # entirely, because it does not provision a Minecraft at all (see the snapshot below), so none of
      # these paths would exist there and the action would report that no cache was saved.
      - name: Cache the Minecraft toolchain
        if: matrix.dir != '1.2.5-forge'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches/forge_gradle/mcp_repo
            ~/.gradle/caches/forge_gradle/minecraft_repo
            ~/.gradle/caches/forge_gradle/minecraft_user_repo
            ~/.gradle/caches/forge_gradle/maven_downloader
            ~/.gradle/caches/fabric-loom
            ~/.gradle/caches/ornithe-keratin
          key: grug-minecraft-${{ runner.os }}-${{ matrix.dir }}-${{ hashFiles('.github/workflows/build.yml', 'gradle.properties', 'loaders/*/gradle.properties', 'loaders/*/build.gradle', 'loaders/*/build.gradle.kts') }}

      # 1.2.5-forge's Minecraft is the pinned MCP snapshot its build clones, 170MB into its own build
      # directory, which is 13s of its Build step. Keyed on the build file that holds the pin, so a
      # different snapshot misses rather than restoring the previous one.
      - name: Cache the 1.2.5 MCP snapshot
        if: matrix.dir == '1.2.5-forge'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: loaders/1.2.5-forge/build/mcp125
          key: grug-mcp125-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml', 'loaders/1.2.5-forge/build.gradle') }}

      # Pinned to ubuntu-24.04 (not ubuntu-latest): a later goal compares
      # screenshots pixel-for-pixel, which needs a stable Mesa/font stack
      # across runs.
      # x11-xserver-utils provides the xrandr binary, which LWJGL 2 (the
      # Alpha/Beta loaders) shells out to. Without it those loaders fail with
      # "No display mode extension is available".
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth x11-xserver-utils \
            libgl1 libgl1-mesa-dri libglx-mesa0 \
            libxrandr2 libxxf86vm1 libxcursor1 libx11-6 libxext6 libxrender1 libxinerama1

      - name: Build (${{ matrix.dir }})
        run: .github/scripts/run-loader.sh "${{ matrix.dir }}" build
        env:
          GRUG_PREBUILT_GRUG_RS: ${{ github.workspace }}/.grug-ci/libgruggers.a

      - name: Run tests (${{ matrix.dir }})
        run: xvfb-run -a -s "-screen 0 1280x720x24 +extension RANDR +extension GLX" .github/scripts/run-loader.sh "${{ matrix.dir }}" run
        env:
          # Empty for every loader except 1.2.5-forge; its game JVM uses this Java 8.
          GRUG_JAVA8: ${{ steps.java8.outputs.path }}
          GRUG_PREBUILT_GRUG_RS: ${{ github.workspace }}/.grug-ci/libgruggers.a

      # ForgeGradle puts the Java output in build/sourcesSets/main; the Loom loaders use
      # build/classes/java/main. Stage whichever exists so the coverage job sees a single layout.
      # 1.2.5-forge has no JaCoCo agent, so it has neither exec data nor a report to contribute and
      # is skipped by the two uploads below.
      - name: Stage the compiled classes
        if: matrix.dir != '1.2.5-forge'
        run: |
          mkdir -p coverage-classes
          for dir in \
            "loaders/${{ matrix.dir }}/build/classes/java/main" \
            "loaders/${{ matrix.dir }}/build/sourcesSets/main"; do
            if [ -d "$dir" ]; then
              cp -r "$dir/." coverage-classes/
            fi
          done

      - name: Upload the coverage exec
        if: matrix.dir != '1.2.5-forge'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-exec-${{ matrix.dir }}
          path: loaders/${{ matrix.dir }}/build/jacoco/runClient.exec
          if-no-files-found: error
          retention-days: 7

      - name: Upload the compiled classes
        if: matrix.dir != '1.2.5-forge'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-classes-${{ matrix.dir }}
          path: coverage-classes
          if-no-files-found: error
          retention-days: 7

      - name: Upload logs and crash reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loader-${{ matrix.dir }}-logs
          path: |
            loaders/${{ matrix.dir }}/run/logs
            loaders/${{ matrix.dir }}/run/crash-reports
            loaders/${{ matrix.dir }}/run/ci-run-loader.log
            loaders/${{ matrix.dir }}/run/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7

      # A screenshot that matched none of a reference's accepted PNGs is written here, mirroring the
      # reference path. Download this artifact and drop the numbered PNGs into the reference
      # directory to accept this platform's rendering.
      - name: Upload unmatched screenshot captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loader-${{ matrix.dir }}-screenshots
          path: loaders/${{ matrix.dir }}/run/grug-screenshot-artifacts
          if-no-files-found: ignore
          retention-days: 7

  # Combines the exec data collected by the core and loader jobs and fails the build unless the
  # measured set is fully covered. Classes a headless CI cannot drive (mixins, loader startup,
  # render/resource glue, and the loader game-API guards that cannot be produced by a test) are
  # excluded in combine-coverage.py; everything that remains must be at 100%.
  coverage:
    name: coverage report
    needs: [core, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Download the coverage data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: coverage/artifacts

      # The jar the core job resolved, so this job never starts Gradle. It used to run a
      # ./gradlew -q :core:printJacocoCliPath of its own, which cost about 35 seconds of cold start
      # to print one path and made it the second slowest job in the workflow.
      - name: Download the JaCoCo CLI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jacoco-cli
          path: coverage/tools

      - name: Combine the coverage data and require 100%
        run: |
          python3 .github/scripts/combine-coverage.py \
            --artifacts coverage/artifacts \
            --jacoco-cli coverage/tools/jacoco-cli.jar \
            --output coverage/report \
            --require-100

      - name: Upload the coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/report
          retention-days: 7
