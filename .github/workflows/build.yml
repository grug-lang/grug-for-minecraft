name: Build

# measurement sample 3

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      repeats:
        # Empty uses the repository variable GRUG_CI_REPEATS, then 1. See #268.
        description: 'Suite passes per loader run; empty uses the repository variable or 1'
        type: string
      mods:
        # The runner loads every mod and runs only the tests of these. See #627.
        description: 'Comma separated mod directory names whose tests the development loader runs; empty runs every mod'
        type: string

permissions:
  contents: read

concurrency:
  # Every run on main is its own group. A group holds one running and one pending run, and a newer
  # run cancels the pending one even with cancel-in-progress off, so two pushes to main in quick
  # succession would have lost the first commit's run: the one the release gate needs for it.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  # A newer run on a pull request or a throwaway branch makes the older one pointless.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      smoke: ${{ steps.smoke.outputs.matrix }}
      mods: ${{ steps.mods.outputs.mods }}
      reference: ${{ steps.reference.outputs.reference }}
      # The loader directories the Windows jobs run on, a JSON list (#632).
      windows: ${{ steps.windows.outputs.dirs }}
    steps:
      # The run timeout of a repeats run is 300 s plus 200 s per extra pass (see the loader job), and
      # the job's own limit is 90 minutes, so 26 passes is the most whose deadline the script reaches
      # before GitHub cancels the job. A larger value is refused here, before anything runs.
      - name: Check the number of passes
        env:
          REPEATS: ${{ inputs.repeats || vars.GRUG_CI_REPEATS }}
        run: |
          case "$REPEATS" in
            '') ;;
            *[!0-9]*) echo "::error::repeats must be a whole number, got '$REPEATS'"; exit 1 ;;
            *) [ "$REPEATS" -ge 1 ] && [ "$REPEATS" -le 26 ] || { echo "::error::repeats must be from 1 to 26, got '$REPEATS'"; exit 1; } ;;
          esac

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover loaders
        id: discover
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, pathlib
          loaders = sorted(p.name for p in pathlib.Path("loaders").iterdir() if p.is_dir())
          print("matrix=" + json.dumps(loaders))
          EOF

      # One unsupported game per mechanism a mod loader reads the jar by, from universal_jar.py's
      # GAMES, which requires every mechanism to keep one (#493).
      - name: Discover smoke games
        id: smoke
        run: echo "matrix=$(python3 .github/scripts/universal_jar.py smoke-matrix)" >> "$GITHUB_OUTPUT"

      # The mods whose tests a pull request has to run, for the loader jobs' GRUG_CI_MODS (#628). Only
      # a pull request narrows it, by its diff against the base it was opened on: a push to main, a
      # dispatch and any event this step does not know run every mod, and so does a base that cannot
      # be fetched or a diff that cannot be read. affected-mods.py explains its choice in this log.
      # The checkout is the pull request merged into its base, a single commit, so only the base's
      # commit is fetched, and a diff of two trees needs no more.
      - name: Choose the mods whose tests run
        id: mods
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mods=
          if [ "$EVENT" != pull_request ]; then
            echo "Selecting every mod: this is a $EVENT run, not a pull request."
          elif [ -z "$BASE_SHA" ] || ! git fetch --quiet --no-tags --depth=1 origin "$BASE_SHA"; then
            echo "Selecting every mod: the pull request's base commit '$BASE_SHA' could not be fetched."
          else
            mods=$(python3 .github/scripts/affected-mods.py "$BASE_SHA" HEAD) || mods=
          fi
          echo "mods=$mods" >> "$GITHUB_OUTPUT"

      # Whether the reference job runs (#631). Only a pull request can skip it, and only when its diff
      # touches nothing the reference run observes: reference-needed.py explains its answer in this
      # log. A push to main, a dispatch, an unreachable base and any error in the script answer true,
      # and the job's own condition skips only on an explicit false, so a step that failed to write
      # an output runs the job too.
      - name: Choose whether the reference job runs
        id: reference
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          reference=true
          if [ "$EVENT" != pull_request ]; then
            echo "Running the reference job: this is a $EVENT run, not a pull request."
          elif [ -z "$BASE_SHA" ] || ! git fetch --quiet --no-tags --depth=1 origin "$BASE_SHA"; then
            echo "Running the reference job: the pull request's base commit '$BASE_SHA' could not be fetched."
          else
            reference=$(python3 .github/scripts/reference-needed.py "$BASE_SHA" HEAD) || reference=true
          fi
          echo "reference=$reference" >> "$GITHUB_OUTPUT"

      # The loader directories the Windows boot jobs run on (#632). A change that boots on Linux
      # cannot fail to boot on Windows without failing on Linux first, and the two Windows jobs are
      # 219 s of a loader's 484 s on main while running no tests (#707), so a push runs them only for
      # a loader it adds, and a dispatch, the full run a release requires, runs them for all of them
      # (added-loaders.py explains its answer in this log). A pull request runs neither: no entry
      # leaves the jobs a matrix GitHub refuses, so their condition skips them. The checkout is one
      # commit deep, so the commit the push started from is fetched first. A push with no commit
      # before it and a fetch or a read that fails run every loader, the direction that runs more.
      - name: Choose the loaders the Windows jobs run
        id: windows
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          LOADERS: ${{ steps.discover.outputs.matrix }}
        run: |
          dirs='[]'
          if [ "$EVENT" = workflow_dispatch ]; then
            dirs="$LOADERS"
            echo "Running the Windows jobs on every loader: a dispatch is the whole run."
          elif [ "$EVENT" = push ]; then
            git fetch --quiet --no-tags --depth=1 origin "$BEFORE" || true
            dirs=$(python3 .github/scripts/added-loaders.py "$BEFORE" HEAD) || dirs="$LOADERS"
          else
            echo "Running the Windows jobs nowhere: a $EVENT run is not a full run."
          fi
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

  # grug-rs builds once per run and the loader jobs link the very same libgruggers.a. It depends on
  # nothing in this repository except the revision core/build.gradle.kts pins, so before this job each
  # of the five loader jobs (and the core job) repeated a git fetch and a cargo build on identical
  # inputs. An artifact from this run cannot be a stale one: it is produced by this workflow, on the
  # same runner image, from the revision this commit pins.
  grug-rs:
    name: build grug-rs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Part of the key because it is what built the library: a .a from a different rustc carries a
      # different metadata version, which is a link error rather than a silently wrong library, but
      # naming it in the key means the cache simply misses instead.
      - name: Read the Rust version
        id: rust
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"

      # Keyed on what built the library and on nothing else: the file holding the pinned revision,
      # the rustc, and the version that describes the one path and one command this job holds. This
      # workflow is deliberately not in this key, unlike the entries below: a workflow edit changes
      # neither input, and naming it here made the first run of every pull request that edits this
      # file build the library again, about 45 s of the path to its first loader job (#691). Bump the
      # version when the path or the build command changes, since a key that stayed would skip the
      # build and the upload would then fail on the moved path, or the link would take a library the
      # changed command no longer builds.
      - name: Restore the static library
        id: grugRsLibrary
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/build/grug-rs/target/release/libgruggers.a
          key: grug-rs-library-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('core/build.gradle.kts') }}-v1

      - name: Build the static library
        if: steps.grugRsLibrary.outputs.cache-hit != 'true'
        run: ./gradlew :core:cloneGrugRs :core:buildGrugRs -Dgrug.activeLoader=a1.1.2_01-ornithe

      - name: Save the static library
        if: steps.grugRsLibrary.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/build/grug-rs/target/release/libgruggers.a
          key: grug-rs-library-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('core/build.gradle.kts') }}-v1

      - name: Upload the static library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grug-rs-library
          path: core/build/grug-rs/target/release/libgruggers.a
          if-no-files-found: error
          retention-days: 7

  # The adapter as a Windows DLL (#528). Built on its own runner, with grug-rs compiled there for the
  # MSVC target (Rust's default on Windows, and the one grug-rs's own CI uses), because a static
  # library is built for one OS and the Linux jobs hand theirs around as an artifact.
  # It takes the same gate as the boot jobs (#784): a dispatch and a push that adds a loader are the
  # runs whose jar gets a Windows native, so a normal push builds none and ships a Linux jar.
  build:
    name: ${{ matrix.dir }}
    needs: [discover, grug-rs]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (inputs.repeats || vars.GRUG_CI_REPEATS || '1') == '1' && 15 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        dir: ['1.2.5-forge']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record the runner's CPU model
        run: lscpu | grep -E '^Model name|^CPU\(s\)'

      - name: Set up the loader build
        id: setup
        uses: ./.github/actions/setup-loader-build
        with:
          loader: ${{ matrix.dir }}

      # The 1.2.5 loader boots its game on Java 8. Install a JDK 8 alongside the build JDK and hand
      # its path to the loader through GRUG_JAVA8. JAVA_HOME goes back to 21 afterwards so the
      # Gradle 9 wrapper the standalone loaders use can still run.
      - name: Set up JDK 8 (1.2.5-forge only)
        if: matrix.dir == '1.2.5-forge'
        id: java8
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 8

      - name: Restore JDK 21 for Gradle (1.2.5-forge only)
        if: matrix.dir == '1.2.5-forge'
        run: echo "JAVA_HOME=${{ steps.setup.outputs.java21-path }}" >> "$GITHUB_ENV"

      # Pinned to ubuntu-24.04 (not ubuntu-latest): a later goal compares
      # screenshots pixel-for-pixel, which needs a stable Mesa/font stack
      # across runs.
      # x11-xserver-utils provides the xrandr binary, which LWJGL 2 (the
      # Alpha/Beta loaders) shells out to. Without it those loaders fail with
      # "No display mode extension is available".
      # The runner image ships an apt index and already carries most of these, so only what it lacks
      # is installed: `apt-get update` is about a third of this step's 8.9 s and runs only if that
      # index can no longer resolve a package (#697).
      - name: Install dependencies
        run: |
          packages=(
            xvfb xauth x11-xserver-utils
            libgl1 libgl1-mesa-dri libglx-mesa0
            libxrandr2 libxxf86vm1 libxcursor1 libx11-6 libxext6 libxrender1 libxinerama1
          )
          missing=()
          for package in "${packages[@]}"; do
            status=$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)
            [ "$status" = 'install ok installed' ] || missing+=("$package")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            # The image's index can have gone stale since it was built; updating is the slow path.
            if ! sudo apt-get install -y --no-install-recommends "${missing[@]}"; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends "${missing[@]}"
            fi
          fi

      # One Gradle invocation builds the loader and its layer and then runs the game (#678), so the
      # job pays one Gradle start and one configuration. A build failure still fails the step before
      # any game exists: the script tells it from a game that exited, and the game's time limit
      # starts when Gradle starts the runClient task. The layer job stays a build-only job.
      - name: Build and run tests (${{ matrix.dir }})
        run: xvfb-run -a -s "-screen 0 1280x720x24 +extension RANDR +extension GLX" .github/scripts/run-loader.sh "${{ matrix.dir }}" build-run
        env:
          # Empty for every loader except 1.2.5-forge; its game JVM uses this Java 8.
          GRUG_JAVA8: ${{ steps.java8.outputs.path }}
          GRUG_PREBUILT_GRUG_RS: ${{ github.workspace }}/.grug-ci/libgruggers.a
          # How many times the suite runs in one test run. A dispatch input wins, then the
          # repository variable GRUG_CI_REPEATS, then 1, which is what pull request runs use
          # because their inputs context is empty. See #268.
          GRUG_CI_REPEATS: ${{ inputs.repeats || vars.GRUG_CI_REPEATS || '1' }}
          # Which mods' tests run: the dispatch input if it names some, else what the discover job
          # chose from the pull request's diff (#628). Empty on a push to main and on a dispatch
          # without the input, which run every mod. A name that is no mod fails the step before the
          # game starts. See #627.
          GRUG_CI_MODS: ${{ inputs.mods || needs.discover.outputs.mods }}
          # The watch covers the whole run: 300s for one pass (the slowest loader measured under 190s
          # of game time) plus 200s per extra pass. 1.2.5 is the slowest loader and took about 150s
          # per pass in the repeats runs of #583 (1068s for twenty passes when #291 measured it, before
          # the suite grew), so twenty passes get 4100s. See #291.
          GRUG_CI_RUN_TIMEOUT: '300'
          GRUG_CI_RUN_TIMEOUT_PER_EXTRA_REPEAT: '200'

      # ForgeGradle puts the Java output in build/sourcesSets/main; the Loom loaders use
      # build/classes/java/main. Stage whichever exists so the coverage job sees a single layout.
      # 1.2.5-forge has no JaCoCo agent, so it has neither exec data nor a report to contribute and
      # is skipped by the two uploads below.
      - name: Stage the compiled classes
        if: matrix.dir != '1.2.5-forge'
        run: |
          mkdir -p coverage-classes
          for dir in \
            "loaders/${{ matrix.dir }}/build/classes/java/main" \
            "loaders/${{ matrix.dir }}/build/sourcesSets/main"; do
            if [ -d "$dir" ]; then
              cp -r "$dir/." coverage-classes/
            fi
          done

      - name: Upload the coverage exec
        if: matrix.dir != '1.2.5-forge'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-exec-${{ matrix.dir }}
          path: |
            loaders/${{ matrix.dir }}/build/jacoco/*.exec
            loaders/${{ matrix.dir }}/build/jacoco/*.dropped
          if-no-files-found: error
          retention-days: 7

      - name: Upload the compiled classes
        if: matrix.dir != '1.2.5-forge'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-classes-${{ matrix.dir }}
          path: coverage-classes
          if-no-files-found: error
          retention-days: 7

      # The first failure with its context, on the run's summary page, so nobody opens a log of
      # thousands of lines to find it. run-loader.sh tees the game log to ci-run-loader.log; a
      # failure before the game starts (a compile error) is not in it, so fall back to its tail.
      - name: Summarize the failure
        if: failure()
        run: |
          log="loaders/${{ matrix.dir }}/run/ci-run-loader.log"
          {
            echo "### ${{ matrix.dir }}"
            echo '```'
            if [ -f "$log" ] && grep -q '\[GRUG CI\] FAIL' "$log"; then
              grep -m1 -B 20 -A 20 '\[GRUG CI\] FAIL' "$log"
            elif [ -f "$log" ]; then
              tail -n 40 "$log"
            else
              echo "No game log; see the failed step (a build or compile error)."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and crash reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loader-${{ matrix.dir }}-logs
          path: |
            loaders/${{ matrix.dir }}/run/logs
            loaders/${{ matrix.dir }}/run/crash-reports
            loaders/${{ matrix.dir }}/run/ci-run-loader.log
            loaders/${{ matrix.dir }}/run/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7

      # A screenshot that matched none of a reference's accepted PNGs is written here, mirroring the
      # reference path. Download this artifact and drop the loader-named PNGs into the reference
      # directory to accept this platform's rendering.
      - name: Upload unmatched screenshot captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loader-${{ matrix.dir }}-screenshots
          path: loaders/${{ matrix.dir }}/run/grug-screenshot-artifacts
          if-no-files-found: ignore
          retention-days: 7

  # The reference run (#574): BuildCraft 2.2.14 itself on its runtime, 1.2.5 Forge, driven by the
  # mod's screenshot tests and compared with the committed 1.2.5-forge.png goldens. Only the
  # reference's runtime is a strict graphical reference, so a mismatch here means the port's 1.2.5
  # golden is not what BuildCraft draws, and it fails like any loader job. GrugScreenshots compares a
  # reference run only with the PNG named after its own loader, so it cannot pass on another
  # loader's golden.