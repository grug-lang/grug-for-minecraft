name: Build

# Mirrors validate-about.yml's triggers, minus path filters: core/, mods/,
# mod_api.json, shared/**, and each loader's own sources all affect whether
# every loader still boots, so this always runs on the whole repo.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Emits one matrix entry per loaders/* directory. See
  # scripts/ci/discover-loaders.sh.
  discover:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Discover loaders
        id: discover
        run: scripts/ci/discover-loaders.sh

  build:
    name: ${{ matrix.dir }}
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Pinned to ubuntu-24.04 (not ubuntu-latest): a later goal compares
      # screenshots pixel-for-pixel, which needs a stable Mesa/font stack
      # across runs.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential xdotool \
            xserver-xorg-core xserver-xorg-video-dummy \
            mesa-utils libgl1-mesa-dri libglx-mesa0 \
            libxrandr2 libxxf86vm1 libxcursor1

      - name: Start Xdummy Server
        run: |
          cat << 'EOF' > dummy.xorg.conf
          Section "Monitor"
              Identifier "DummyMonitor"
              HorizSync 28.0-80.0
              VertRefresh 48.0-75.0
          EndSection

          Section "Device"
              Identifier "DummyDevice"
              Driver "dummy"
              VideoRam 256000
          EndSection

          Section "Screen"
              Identifier "DummyScreen"
              Device "DummyDevice"
              Monitor "DummyMonitor"
              DefaultDepth 24
              SubSection "Display"
                  Depth 24
                  Modes "1280x720"
              EndSubSection
          EndSection
          EOF
          sudo Xorg -noreset -ac +extension GLX +extension RANDR +extension RENDER -logfile /tmp/xorg.log -config ./dummy.xorg.conf :99 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          sleep 2 # TODO: Can this be removed?

      - name: Make gradlew scripts executable
        run: |
          chmod +x gradlew
          for f in loaders/*/gradlew; do
            [ -f "$f" ] && chmod +x "$f"
          done
          exit 0

      - name: Resolve dependencies (${{ matrix.dir }})
        run: scripts/ci/run-loader.sh "${{ matrix.dir }}" resolve

      - name: Build (${{ matrix.dir }})
        run: scripts/ci/run-loader.sh "${{ matrix.dir }}" build

      - name: Boot to title screen (${{ matrix.dir }})
        run: scripts/ci/run-loader.sh "${{ matrix.dir }}" run

      - name: Upload logs and crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loader-${{ matrix.dir }}-logs
          path: |
            loaders/${{ matrix.dir }}/run/logs
            loaders/${{ matrix.dir }}/run/crash-reports
            loaders/${{ matrix.dir }}/run/ci-run-loader.log
            loaders/${{ matrix.dir }}/run/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7

  # TODO: Remove this debug job
  lwjgl2-mre:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-xserver-utils xauth \
            xserver-xorg-core xserver-xorg-video-dummy \
            mesa-utils libgl1-mesa-dri libglx-mesa0 \
            libxrandr2 libxxf86vm1 libxcursor1 libx11-6 libxext6 libxrender1 libxinerama1

      - name: Download Patched LegacyFabric LWJGL 2.9.4
        run: |
          mkdir -p lwjgl/natives
          cd lwjgl
          wget -q "https://repo.legacyfabric.net/repository/legacyfabric/org/lwjgl/lwjgl/lwjgl/2.9.4%2Blegacyfabric.15/lwjgl-2.9.4%2Blegacyfabric.15.jar" -O lwjgl.jar
          wget -q "https://repo.legacyfabric.net/repository/legacyfabric/org/lwjgl/lwjgl/lwjgl-platform/2.9.4%2Blegacyfabric.15/lwjgl-platform-2.9.4%2Blegacyfabric.15-natives-linux.jar" -O lwjgl-natives.jar
          unzip -q lwjgl-natives.jar -d natives/

      - name: Write LwjglTest.java
        run: |
          cat << 'EOF' > LwjglTest.java
          import java.awt.Canvas;
          import java.awt.Frame;
          import org.lwjgl.opengl.Display;

          public class LwjglTest {
              public static void main(String[] args) {
                  try {
                      Frame frame = new Frame("LWJGL AWT Test");
                      Canvas canvas = new Canvas();
                      canvas.setSize(1280, 720);
                      frame.add(canvas);
                      
                      System.out.println("Realizing AWT native peer...");
                      frame.addNotify();
                      frame.pack();
                      frame.setVisible(true);
                      Thread.sleep(200);

                      Display.setParent(canvas);

                      System.out.println("Fetching available display modes...");
                      Display.getAvailableDisplayModes();
                      
                      System.out.println("Creating display...");
                      Display.create();
                      System.out.println("Display created successfully!");

                      Display.destroy();
                      frame.dispose();
                  } catch (Exception e) {
                      e.printStackTrace();
                      System.exit(1);
                  }
              }
          }
          EOF

      - name: Compile LwjglTest
        run: javac -cp "lwjgl/lwjgl.jar" LwjglTest.java

      - name: "Test 1: Reproduce Failure with Xdummy"
        continue-on-error: true
        run: |
          cat << 'EOF' > dummy.xorg.conf
          Section "Monitor"
              Identifier "DummyMonitor"
              HorizSync 28.0-80.0
              VertRefresh 48.0-75.0
          EndSection

          Section "Device"
              Identifier "DummyDevice"
              Driver "dummy"
              VideoRam 256000
          EndSection

          Section "Screen"
              Identifier "DummyScreen"
              Device "DummyDevice"
              Monitor "DummyMonitor"
              DefaultDepth 24
              SubSection "Display"
                  Depth 24
                  Modes "1280x720"
              EndSubSection
          EndSection
          EOF
          sudo Xorg -noreset -ac +extension GLX +extension RANDR +extension RENDER -logfile /tmp/xorg.log -config ./dummy.xorg.conf :99 &
          sleep 2
          DISPLAY=:99 java -cp ".:lwjgl/lwjgl.jar" -Djava.library.path="lwjgl/natives" LwjglTest

      - name: "Test 2: Verify Fix with xvfb-run"
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24 +extension RANDR +extension GLX" \
            java -cp ".:lwjgl/lwjgl.jar" -Djava.library.path="lwjgl/natives" LwjglTest
