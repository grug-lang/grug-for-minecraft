name: Build

# Mirrors validate-about.yml's triggers, minus path filters: core/, mods/,
# mod_api.json, shared/**, and each loader's own sources all affect whether
# every loader still boots, so this always runs on the whole repo.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Emits one matrix entry per loaders/* directory. See
  # scripts/ci/discover-loaders.sh.
  discover:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Discover loaders
        id: discover
        run: scripts/ci/discover-loaders.sh

  build:
    name: ${{ matrix.dir }}
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Pinned to ubuntu-24.04 (not ubuntu-latest): a later goal compares
      # screenshots pixel-for-pixel, which needs a stable Mesa/font stack
      # across runs.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            tigervnc-standalone-server xdotool \
            mesa-utils libgl1-mesa-dri libglx-mesa0 \
            libxrandr2 libxxf86vm1 libxcursor1

      - name: Start X server
        run: |
          Xvnc :99 -geometry 1280x720 -depth 24 -SecurityTypes None &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"

      - name: Make gradlew scripts executable
        run: |
          chmod +x gradlew
          for f in loaders/*/gradlew; do
            [ -f "$f" ] && chmod +x "$f"
          done
          exit 0

      - name: Resolve dependencies (${{ matrix.dir }})
        run: scripts/ci/run-loader.sh "${{ matrix.dir }}" resolve

      - name: Build (${{ matrix.dir }})
        run: scripts/ci/run-loader.sh "${{ matrix.dir }}" build

      - name: Boot to title screen (${{ matrix.dir }})
        run: scripts/ci/run-loader.sh "${{ matrix.dir }}" run

      - name: Upload logs and crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loader-${{ matrix.dir }}-logs
          path: |
            loaders/${{ matrix.dir }}/run/logs
            loaders/${{ matrix.dir }}/run/crash-reports
            loaders/${{ matrix.dir }}/run/ci-run-loader.log
            loaders/${{ matrix.dir }}/run/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7

  # TODO: Remove this debug job
  lwjgl2-x11-test:
    name: "MRE: LWJGL 2 Headless Display Test"
    runs-on: ubuntu-24.04
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install X11 Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb tigervnc-standalone-server xdotool \
            mesa-utils libgl1-mesa-dri libglx-mesa0 \
            libxrandr2 libxxf86vm1 libxcursor1

      - name: Download Raw LWJGL 2
        run: |
          wget -q https://repo1.maven.org/maven2/org/lwjgl/lwjgl/lwjgl/2.9.3/lwjgl-2.9.3.jar
          wget -q https://repo1.maven.org/maven2/org/lwjgl/lwjgl/lwjgl-platform/2.9.3/lwjgl-platform-2.9.3-natives-linux.jar
          unzip -q lwjgl-platform-2.9.3-natives-linux.jar -d natives

      - name: Compile LWJGL 2 Test Program
        run: |
          cat << 'EOF' > LwjglTest.java
          import org.lwjgl.opengl.Display;
          import org.lwjgl.opengl.DisplayMode;

          public class LwjglTest {
              public static void main(String[] args) {
                  try {
                      System.out.println("--> Querying available display modes...");
                      DisplayMode[] modes = Display.getAvailableDisplayModes();
                      System.out.println("--> Found " + modes.length + " modes.");
                      for (DisplayMode mode : modes) {
                          System.out.println("    - " + mode.getWidth() + "x" + mode.getHeight());
                      }
                      
                      System.out.println("--> Attempting to create Display...");
                      Display.setDisplayMode(new DisplayMode(800, 600));
                      Display.create();
                      System.out.println("--> SUCCESS: Display created!");
                      Display.destroy();
                  } catch (Exception e) {
                      e.printStackTrace();
                      System.exit(1);
                  }
              }
          }
          EOF
          javac -cp lwjgl-2.9.3.jar LwjglTest.java

      - name: Test Configuration A (Xvfb Default)
        continue-on-error: true
        run: |
          echo "=== Starting Xvfb (Default) ==="
          Xvfb :99 -screen 0 1280x720x24 &
          XVFB_PID=$!
          sleep 2
          DISPLAY=:99 java -cp .:lwjgl-2.9.3.jar -Djava.library.path=natives LwjglTest
          kill $XVFB_PID || true

      - name: Test Configuration B (Xvfb + RANDR + GLX)
        continue-on-error: true
        run: |
          echo "=== Starting Xvfb (+Extensions) ==="
          Xvfb :98 -screen 0 1280x720x24 +extension RANDR +extension GLX &
          XVFB_PID=$!
          sleep 2
          DISPLAY=:98 java -cp .:lwjgl-2.9.3.jar -Djava.library.path=natives LwjglTest
          kill $XVFB_PID || true

      - name: Test Configuration C (Xvnc)
        continue-on-error: true
        run: |
          echo "=== Starting Xvnc ==="
          Xvnc :97 -geometry 1280x720 -depth 24 -SecurityTypes None &
          XVNC_PID=$!
          sleep 2
          DISPLAY=:97 java -cp .:lwjgl-2.9.3.jar -Djava.library.path=natives LwjglTest
          kill $XVNC_PID || true
