name: Build

# Mirrors validate-about.yml's triggers, minus path filters: core/, mods/,
# mod_api.json, shared/**, and each loader's own sources all affect whether
# every loader still boots, so this always runs on the whole repo.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Emits one matrix entry per loaders/* directory. See
  # scripts/ci/discover-loaders.sh.
  discover:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Discover loaders
        id: discover
        run: scripts/ci/discover-loaders.sh

  build:
    name: ${{ matrix.dir }}
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Pinned to ubuntu-24.04 (not ubuntu-latest): a later goal compares
      # screenshots pixel-for-pixel, which needs a stable Mesa/font stack
      # across runs.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential xdotool \
            xserver-xorg-core xserver-xorg-video-dummy \
            mesa-utils libgl1-mesa-dri libglx-mesa0 \
            libxrandr2 libxxf86vm1 libxcursor1

      - name: Start Xdummy Server
        run: |
          cat << 'EOF' > dummy.xorg.conf
          Section "Monitor"
              Identifier "DummyMonitor"
              HorizSync 28.0-80.0
              VertRefresh 48.0-75.0
          EndSection

          Section "Device"
              Identifier "DummyDevice"
              Driver "dummy"
              VideoRam 256000
          EndSection

          Section "Screen"
              Identifier "DummyScreen"
              Device "DummyDevice"
              Monitor "DummyMonitor"
              DefaultDepth 24
              SubSection "Display"
                  Depth 24
                  Modes "1280x720"
              EndSubSection
          EndSection
          EOF
          sudo Xorg -noreset -ac +extension GLX +extension RANDR +extension RENDER -logfile /tmp/xorg.log -config ./dummy.xorg.conf :99 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          sleep 2 # TODO: Can this be removed?

      - name: Make gradlew scripts executable
        run: |
          chmod +x gradlew
          for f in loaders/*/gradlew; do
            [ -f "$f" ] && chmod +x "$f"
          done
          exit 0

      - name: Resolve dependencies (${{ matrix.dir }})
        run: scripts/ci/run-loader.sh "${{ matrix.dir }}" resolve

      - name: Build (${{ matrix.dir }})
        run: scripts/ci/run-loader.sh "${{ matrix.dir }}" build

      - name: Boot to title screen (${{ matrix.dir }})
        run: scripts/ci/run-loader.sh "${{ matrix.dir }}" run

      - name: Upload logs and crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loader-${{ matrix.dir }}-logs
          path: |
            loaders/${{ matrix.dir }}/run/logs
            loaders/${{ matrix.dir }}/run/crash-reports
            loaders/${{ matrix.dir }}/run/ci-run-loader.log
            loaders/${{ matrix.dir }}/run/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7
