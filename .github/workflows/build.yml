name: Build

on:
  push:
    branches: [main]
  pull_request:
  # The weekly full pass (#909, #310): every loader with every mod, which no selection can shrink. A
  # break a narrower run's selection missed is found here, at most a week after it landed, or on the
  # next full run that carries it. Monday 03:00 UTC, after the Sunday release's dispatch, so the two
  # full runs do not queue behind each other on the 20 job slots, and the scheduled path itself is the
  # one thing only a cron exercises: a dispatch runs the same pipeline, but not this trigger.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      repeats:
        # Empty uses the repository variable GRUG_CI_REPEATS, then 1. See #268.
        description: 'Suite passes per loader run; empty uses the repository variable or 1'
        type: string
      mods:
        # The runner loads every mod and runs only the tests of these. See #627.
        description: 'Comma separated mod directory names whose tests the development loader runs; empty runs every mod'
        type: string
      coverage-only:
        # A dispatch that checks this measures the coverage gate instead of paying the whole suite for
        # it (#831): the development loader jobs run only the tests of mods/coverage, one game run per
        # loader, and the coverage job still requires 100% of the same data, which the shape reports
        # at 100% with 0 dropped files per loader. Every other job of the dispatch runs as in a full
        # one. The shape costs 95 to 149 s per loader, measured in an interleaved dispatch pair on
        # #831: the coverage mod's tests take 9.9 to 41.9 s of game clock per loader, with 1.20.6-forge
        # the heavy one. Since #909 this is also the shape of a push to main's loader job for a loader
        # the selection leaves out of the suite, so a dispatch with this set proves the gate at 100%
        # in a run that does not hold the whole mod set, which is what a narrower merge now does. The
        # gate's own inputs are all in the shape: the game boot of each loader, which the gate counts,
        # is in it, since each loader's game boots and then runs only coverage's tests.
        description: 'Run only the tests of mods/coverage in the development loader jobs, to measure the coverage gate in 95 to 149 s per loader; every other job of the dispatch runs as usual'
        type: boolean
      refresh-test-times:
        # Every game run writes its loader's test order record back to the repository it read it
        # from (#778), so set this and the loader jobs hand the records back as artifacts: the
        # refresh is one dispatch and a commit, never a hand-edit.
        description: 'Upload each loader test order record the run wrote, so the refresh can be committed'
        type: boolean
      reference-mod:
        # The mod the reference job runs (#832), read from that mod's about.json: its first
        # derived_from entry names the runtime the job stages the reference into and runs on.
        # Empty runs the default, buildcraft, so a pull request's reference is unchanged.
        description: 'The mod the reference job runs, read from its first derived_from entry; empty runs the default, buildcraft'
        type: string
      base:
        # The commit a dispatch compares its branch with (#826), a SHA or a branch name. The Windows
        # boot jobs are the only run of the native path and of the installed jar on Windows, and a
        # verification dispatch whose diff cannot reach them does not need them: windows-needed.py
        # answers from the diff and explains its answer in this log. Empty is the full run, which is
        # what the four-hourly check and the weekly release send, so a release always gets the native
        # and the boots, and a dispatch on main is full whatever this names.
        description: 'A commit or branch this dispatch compares with to decide whether the Windows boot jobs can be affected; empty runs them, which a release requires'
        type: string

permissions:
  contents: read
  # The pull request's coverage job reads the base commit's coverage-map artifact off the run of
  # the base commit's push to main, which is an artifact of another run (#786).
  actions: read

concurrency:
  # Every run on main is its own group. A group holds one running and one pending run, and a newer
  # run cancels the pending one even with cancel-in-progress off, so two pushes to main in quick
  # succession would have lost the first commit's run: the one the release gate needs for it.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  # A newer run on a pull request or a throwaway branch makes the older one pointless.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Emits one matrix entry per loaders/* directory, and what this run selects from it (#637, #909).
  discover:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      # The matrix of the development loader jobs (#909): every loader on a push, each with the mods
      # its job runs, and only the selected loaders on a pull request (#637). A loader the selection
      # leaves out still runs, on mods/coverage's tests alone, because the coverage gate counts every
      # loader's own classes from that loader's own report.
      build: ${{ steps.selection.outputs.build }}
      # The matrix of the jobs that run the suite again in a player's install: the selected loaders,
      # with the same mods, since it is the same suite (#909).
      installed: ${{ steps.selection.outputs.installed }}
      # The mods the selected loaders run, empty for every mod, for the jobs that run the suite once.
      mods: ${{ steps.selection.outputs.mods }}
      smoke: ${{ steps.smoke.outputs.matrix }}
      # Whether the smoke games and the reference job can see anything the diff changed (#909).
      smoke-needed: ${{ steps.selection.outputs.smoke }}
      reference: ${{ steps.selection.outputs.reference }}
      # Whether the diff is prose alone, which no test can read (#785).
      no-tests: ${{ steps.no-tests.outputs.no-tests }}
      # The coverage tests a pull request carries over instead of rerunning, and the run of the
      # base commit that uploaded the map they are carried from (#786).
      carry-over: ${{ steps.carry-over.outputs.carry-over }}
      base-run: ${{ steps.carry-over.outputs.base-run }}
      # The loader directories the Windows jobs run on, a JSON list (#632).
      windows: ${{ steps.windows.outputs.dirs }}
    steps:
      # The run timeout of a repeats run is 300 s plus 200 s per extra pass (see the loader job), and
      # the job's own limit is 90 minutes, so 26 passes is the most whose deadline the script reaches
      # before GitHub cancels the job. A larger value is refused here, before anything runs.
      - name: Check the number of passes
        env:
          REPEATS: ${{ inputs.repeats || vars.GRUG_CI_REPEATS }}
        run: |
          case "$REPEATS" in
            '') ;;
            *[!0-9]*) echo "::error::repeats must be a whole number, got '$REPEATS'"; exit 1 ;;
            *) [ "$REPEATS" -ge 1 ] && [ "$REPEATS" -le 26 ] || { echo "::error::repeats must be from 1 to 26, got '$REPEATS'"; exit 1; } ;;
          esac

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover loaders
        id: discover
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, pathlib
          loaders = sorted(p.name for p in pathlib.Path("loaders").iterdir() if p.is_dir())
          print("matrix=" + json.dumps(loaders))
          EOF

      # One unsupported game per mechanism a mod loader reads the jar by, from universal_jar.py's
      # GAMES, which requires every mechanism to keep one (#493).
      - name: Discover smoke games
        id: smoke
        run: echo "matrix=$(python3 .github/scripts/universal_jar.py smoke-matrix)" >> "$GITHUB_OUTPUT"

      # What this run selects (#909): the mods a push to main runs and the loaders that run them, as
      # the build and installed matrices; whether the smoke games and the reference job can see the
      # diff; and the mods the jobs that run the suite once run. One script answers for every event,
      # so a pull request, a push, a dispatch and the weekly schedule cannot disagree about the rules;
      # main-selection.py explains the answer in this log, and affected-mods.py and affected-loaders.py
      # explain the two axes it composes. Every doubt runs more, never fewer: an empty or unfetchable
      # base, a diff that cannot be read and any error in the script answer with every loader, every
      # mod and every job. The narrowing is these outputs and the jobs' conditions, never a
      # workflow-level paths filter, which would leave a required check pending on a run that never
      # starts. The checkout is one commit, so only the base commit is fetched, and a diff of two
      # trees needs no more.
      - name: Choose what this run selects
        id: selection
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COVERAGE_ONLY: ${{ inputs.coverage-only == true }}
        run: |
          base="$BASE"
          # A push to main compares against the commit it started from, which the one commit deep
          # checkout does not hold; a pull request's base is its own commit, the same one the
          # carry-over and no-tests steps below read.
          if [ -n "$base" ] && [ "$EVENT" != workflow_dispatch ] && [ "$EVENT" != schedule ] \
            && ! git fetch --quiet --no-tags --depth=1 origin "$base"; then
            echo "::warning::the $EVENT base '$base' could not be fetched, so this run selects everything."
            base=
          fi
          args=("$EVENT" "$base")
          if [ "$COVERAGE_ONLY" = 'true' ]; then
            args+=(--coverage-only)
          fi
          python3 .github/scripts/main-selection.py "${args[@]}" > "$RUNNER_TEMP/selection.out" || true
          # A selection that was not written cannot narrow anything, and the fallback is the shape of
          # a full run rather than a run with no loader in it. An empty build matrix is the same
          # failure in a well-formed line, so it takes the same fallback; a tree that still names no
          # loader then fails this step, since a green run with no test is the one outcome neither
          # this step nor main-selection.py may produce (#920 review).
          if ! grep -q '^build=' "$RUNNER_TEMP/selection.out" \
            || grep -q '^build=\[\]$' "$RUNNER_TEMP/selection.out"; then
            echo "::warning::the selection wrote no loader to run, so this run selects everything."
            python3 .github/scripts/main-selection.py --everything > "$RUNNER_TEMP/selection.out"
          fi
          if ! grep -q '^build=' "$RUNNER_TEMP/selection.out" \
            || grep -q '^build=\[\]$' "$RUNNER_TEMP/selection.out"; then
            echo "::error::no loader can be selected from this tree, so there is nothing to run."
            exit 1
          fi
          cat "$RUNNER_TEMP/selection.out" >> "$GITHUB_OUTPUT"

      # The coverage tests the gate may carry over instead of rerunning (#786). A pull request
      # carries over only the tests select-coverage-tests.py proves its diff cannot affect, from
      # the base commit's recorded coverage: a successful run of the base commit on main built the
      # map from its own per-test exec data and uploaded it as the coverage-map artifact that
      # base_coverage_map_run.py looks up here. Every way to not have both runs every coverage
      # test, before any game starts: a push to main and a dispatch, an unfetchable or unreadable
      # base, a base without a successful run on main that uploaded a map, and any error, which
      # the scripts answer with the same fallback themselves. The list goes to the development
      # loader jobs as GRUG_CI_COVERAGE_CARRY_OVER, whose assertions the run does not rerun, and
      # to the coverage job, which counts the base commit's recorded coverage of exactly these
      # tests in their place.
      - name: Choose the coverage tests to carry over
        id: carry-over
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # A step only sees the workflow's token when it passes it in: the lookup reads the
          # runs of the base commit with it.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          carry=
          base_run=
          if [ "$EVENT" = pull_request ]; then
            if [ -z "$BASE_SHA" ] || ! git fetch --quiet --no-tags --depth=1 origin "$BASE_SHA"; then
              echo "Carrying over no coverage test: the pull request's base commit '$BASE_SHA' could not be fetched."
            else
              base_run=$(python3 .github/scripts/base_coverage_map_run.py "$BASE_SHA") || base_run=
              if [ -z "$base_run" ]; then
                echo "Carrying over no coverage test: no successful run of the base commit on main uploaded a coverage map."
              else
                carry=$(python3 .github/scripts/select-coverage-tests.py "$BASE_SHA" HEAD) || carry=
              fi
            fi
          else
            echo "Carrying over no coverage test: this is a $EVENT run, which runs every coverage test."
          fi
          echo "carry-over=$carry" >> "$GITHUB_OUTPUT"
          echo "base-run=$base_run" >> "$GITHUB_OUTPUT"

      # Whether the test jobs can be skipped (#785): only when every changed path is prose no test
      # reads (no-tests.py). A pull request and a push to main narrow it, each against the commit
      # it started from; a dispatch and the weekly schedule never do, since they are the full runs a
      # release and the catalogue need, and neither does an event this step does not know, a base
      # that cannot be fetched or an error in the script. The checkout is one commit deep, so the
      # commit the push started from is fetched first. The test jobs' conditions skip only on an
      # explicit true, so a step that wrote no output runs them.
      - name: Choose whether the test jobs run
        id: no-tests
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          no_tests=false
          if [ "$EVENT" = pull_request ]; then
            if [ -z "$BASE_SHA" ] || ! git fetch --quiet --no-tags --depth=1 origin "$BASE_SHA"; then
              echo "Running every test: the pull request's base commit '$BASE_SHA' could not be fetched."
            else
              no_tests=$(python3 .github/scripts/no-tests.py "$BASE_SHA" HEAD) || no_tests=false
            fi
          elif [ "$EVENT" = push ]; then
            if [ -z "$BEFORE" ] || ! git fetch --quiet --no-tags --depth=1 origin "$BEFORE"; then
              echo "Running every test: the commit before this push, '$BEFORE', could not be fetched."
            else
              no_tests=$(python3 .github/scripts/no-tests.py "$BEFORE" HEAD) || no_tests=false
            fi
          else
            echo "Running every test: this is a $EVENT run, which is the full run a release needs."
          fi
          echo "no-tests=$no_tests" >> "$GITHUB_OUTPUT"

      # The loader directories the Windows boot jobs run on (#632, #826). A change that boots on Linux
      # cannot fail to boot on Windows without failing on Linux first, and the two Windows jobs are
      # 219 s of a loader's 484 s on main while running no tests (#707), so a push runs them only for
      # a loader it adds. A dispatch runs them for every loader unless it names a base commit, which
      # asks windows-needed.py whether the diff against it can reach the native path or the installed
      # jar (it explains its answer in this log); its answer is true for a dispatch with no base and
      # for one on main, because those are the full runs a release and the four-hourly check send and
      # neither can tell a narrowed run from a full one afterwards. A pull request and the weekly
      # schedule run neither: #632 keeps them out of a run that no release and no added loader needs,
      # and no entry leaves the jobs a matrix GitHub refuses, so their condition skips them.
      - name: Choose the loaders the Windows jobs run
        id: windows
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ inputs.base }}
          REF: ${{ github.ref }}
          LOADERS: ${{ steps.discover.outputs.matrix }}
        run: |
          dirs='[]'
          if [ "$EVENT" = workflow_dispatch ]; then
            # The input takes a commit, and a branch or a remote-tracking name people type instead is
            # resolved to the commit it names. A fetch writes FETCH_HEAD and nothing else, so only a
            # fetch that succeeded makes what it brought in the base: a base that is no commit this
            # checkout holds is passed on empty, the script answers every loader for it, and the
            # warning says this dispatch did not narrow.
            base=''
            if [ -n "$BASE" ]; then
              base=$(git rev-parse --verify --quiet "${BASE}^{commit}") || base=''
              if [ -z "$base" ]; then
                name="${BASE#origin/}"
                if git fetch --quiet --no-tags --depth=1 origin "$name"; then
                  base=$(git rev-parse --verify --quiet 'FETCH_HEAD^{commit}') || base=''
                fi
              fi
              if [ -z "$base" ]; then
                echo "::warning::the base '$BASE' is no commit this checkout could fetch, so the Windows jobs run."
              fi
            fi
            if [ -n "$BASE" ] && [ -z "$base" ]; then
              dirs="$LOADERS"
              echo "Running the Windows jobs on every loader: the base names no commit this run can read."
            else
              needed=$(python3 .github/scripts/windows-needed.py --event "$EVENT" --ref "$REF" "$base" HEAD) || needed=true
              if [ "$needed" = 'false' ]; then
                echo "Running the Windows jobs nowhere: this dispatch's diff cannot reach what they test."
              else
                dirs="$LOADERS"
                echo "Running the Windows jobs on every loader."
              fi
            fi
          elif [ "$EVENT" = push ]; then
            git fetch --quiet --no-tags --depth=1 origin "$BEFORE" || true
            dirs=$(python3 .github/scripts/added-loaders.py "$BEFORE" HEAD) || dirs="$LOADERS"
          else
            echo "Running the Windows jobs nowhere: a $EVENT run is not a full run."
          fi
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

  # grug-rs builds once per run and the loader jobs link the very same libgruggers.a. It depends on
  # nothing in this repository except the revision core/build.gradle.kts pins, so before this job each
  # of the five loader jobs (and the core job) repeated a git fetch and a cargo build on identical
  # inputs. An artifact from this run cannot be a stale one: it is produced by this workflow, on the
  # same runner image, from the revision this commit pins.
  grug-rs:
    name: build grug-rs
    if: needs.discover.outputs.no-tests != 'true'
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # Part of the key because it is what built the library: a .a from a different rustc carries a
      # different metadata version, which is a link error rather than a silently wrong library, but
      # naming it in the key means the cache simply misses instead.
      - name: Read the Rust version
        id: rust
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"

      # Keyed on what built the library and on nothing else: the file holding the pinned revision,
      # the rustc, and the version that describes the one path and one command this job holds. This
      # workflow is deliberately not in this key, unlike the entries below: a workflow edit changes
      # neither input, and naming it here made the first run of every pull request that edits this
      # file build the library again, about 45 s of the path to its first loader job (#691). Bump the
      # version when the path or the build command changes, since a key that stayed would skip the
      # build and the upload would then fail on the moved path, or the link would take a library the
      # changed command no longer builds.
      - name: Restore the static library
        id: grugRsLibrary
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/build/grug-rs/target/release/libgruggers.a
          key: grug-rs-library-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('core/build.gradle.kts') }}-v1

      # The one Gradle invocation in this job is the build below, so the caches are restored only when
      # it runs: the common run restores the static library from its own entry and downloads none of
      # the 625 MB the three Gradle entries hold.
      #
      # The root build's caches, from the a1.1.2_01-ornithe entries the -Dgrug.activeLoader below
      # scopes the build to, instead of setup-java's `cache: gradle`: its wrapper entry held the same
      # ~/.gradle/wrapper as the dists entry under a second key (#825). See
      # .github/actions/restore-gradle-caches for what each entry holds.
      - name: Restore the Gradle caches
        if: steps.grugRsLibrary.outputs.cache-hit != 'true'
        uses: ./.github/actions/restore-gradle-caches
        with:
          loader: a1.1.2_01-ornithe

      - name: Build the static library
        if: steps.grugRsLibrary.outputs.cache-hit != 'true'
        run: ./gradlew :core:cloneGrugRs :core:buildGrugRs -Dgrug.activeLoader=a1.1.2_01-ornithe

      - name: Save the static library
        if: steps.grugRsLibrary.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: core/build/grug-rs/target/release/libgruggers.a
          key: grug-rs-library-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('core/build.gradle.kts') }}-v1

      - name: Upload the static library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grug-rs-library
          path: core/build/grug-rs/target/release/libgruggers.a
          if-no-files-found: error
          retention-days: 7

  # The adapter as a Windows DLL (#528). Built on its own runner, with grug-rs compiled there for the
  # MSVC target (Rust's default on Windows, and the one grug-rs's own CI uses), because a static
  # library is built for one OS and the Linux jobs hand theirs around as an artifact.
  # It takes the same gate as the boot jobs (#784, #826): a dispatch and a push that adds a loader are
  # the runs whose jar gets a Windows native, so a normal push builds none and ships a Linux jar. A
  # verification dispatch that names a base skips it when that diff cannot reach the native path, and
  # a dispatch with no base, which the four-hourly check and the weekly release send, builds it.
  native-windows:
    name: adapter.dll (Windows)
    if: needs.discover.outputs.windows != '[]'
    needs: [discover]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Puts cl and link on the PATH, as a Developer Command Prompt does.
      - name: Set up the MSVC toolchain
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0

      # PowerShell rather than bash: Git for Windows puts its own link.exe, a coreutils command, ahead
      # of MSVC's linker in a bash step's PATH, and rustc then runs the wrong one.
      - name: Build the adapter
        shell: pwsh
        run: ./gradlew.bat :core:buildGrugAdapter "-Dgrug.activeLoader=a1.1.2_01-ornithe"

      # A DLL that links is not one the JVM can bind: the JNI entry points have to be exported by name.
      - name: Check the DLL exports the JNI entry points
        shell: pwsh
        run: |
          $exports = dumpbin /exports core/build/generated/resources/natives/adapter.dll
          $exports
          if (-not ($exports | Select-String "Java_net_grug_minecraft_grug_GrugNative_nativeInit")) { exit 1 }

      # The universal job adds it to the jar beside the Linux native core's own build made, and only
      # in a run that gets this far (#784).
      - name: Upload the adapter
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-windows
          path: core/build/generated/resources/natives/adapter.dll
          if-no-files-found: error
          retention-days: 7

  core:
    name: core tests
    # A diff of prose alone cannot change a test's result, so the job skips (#785). Only an
    # explicit true skips it (see the discover job), and a dispatch never sets one.
    if: needs.discover.outputs.no-tests != 'true'
    needs: [discover, grug-rs]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # The root build's Gradle caches, from the a1.1.2_01-ornithe entries this job's
      # -Dgrug.activeLoader scopes its build to, instead of setup-java's `cache: gradle`, whose
      # wrapper entry held the same ~/.gradle/wrapper as the dists entry under a second key (#825).
      - name: Restore the Gradle caches
        uses: ./.github/actions/restore-gradle-caches
        with:
          loader: a1.1.2_01-ornithe

      # Waits on the grug-rs job, which is why the static library is downloaded before anything runs:
      # core's tests load libadapter.so, so they need the library this commit links against.
      - name: Download the grug-rs static library
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grug-rs-library
          path: .grug-ci

      # A hit here means this push changed neither mod_api.json nor the generator, and the three
      # generated files are already the right ones, so generateGrugAdapter is up to date and does not
      # run again. Those two files are its whole input set, so the key is everything it depends on.
      - name: Restore the generated adapter
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            core/build/generated/grug
            core/build/generated/sources/grug
          key: grug-adapter-${{ runner.os }}-${{ hashFiles('mod_api.json', 'core/generate.py') }}

      # The active-loader property scopes the settings to core plus one no-op loader, so this job
      # doesn't configure every loader's build plugins just to run core's JUnit tests. The prebuilt
      # property is what run-loader.sh passes for the loader jobs: core's tests load libadapter.so,
      # so they need the static library this commit links against.
      - name: Test core
        run: ./gradlew :core:test :core:coverageMapToolJar -Dgrug.activeLoader=a1.1.2_01-ornithe -Pgrug.prebuiltGrugRs="${{ github.workspace }}/.grug-ci/libgruggers.a"

      - name: Test the grug adapter generator
        run: python3 core/test_generate.py

      # The canonical vanilla block name table is what makes a block name mean one block on all five
      # loaders. Checked on its own because a bad row would otherwise only show up as a wrong block
      # in a game run.
      - name: Check the vanilla block name table
        run: |
          python3 vanilla_blocks.py
          python3 vanilla_blocks_test.py

      # The order is also enforced by the mod-api-order pre-commit hook; this runs its test, which
      # covers a dict out of order at each level.
      - name: Test the mod_api.json order check
        run: python3 mod_api_order_test.py

      # A Rust panic in grug-rs aborts the JVM instead of failing a test, so run-loader.sh has to
      # recognize that shape and explain it. Nothing else in CI can catch a regression there: the
      # panic is intermittent, so the only check is the reporter against a log that holds one, and
      # a faked run for the classification around it.
      #
      # The suites are waits rather than work, so they run side by side (#744): run_loader_test.py's
      # fake Gradle sleeps two seconds in every case, which adds up to minutes of this job one case
      # after another. parallel_test_runner.py puts each file in a process of its own and stops at
      # the first failure, and run_loader_test.py runs its 53 cases the same way, so the step costs
      # about a quarter of what the waits add up to.
      - name: Test the native-abort reporter and the run script
        run: |
          python3 .github/scripts/parallel_test_runner.py \
            .github/scripts/run_loader_test.py \
            .github/scripts/report_native_abort_test.py \
            .github/scripts/parallel_test_runner_test.py \
            .github/scripts/ci_timing_test.py \
            .github/scripts/combine_coverage_test.py \
            .github/scripts/base_coverage_map_run_test.py \
            .github/scripts/watch_run_test.py \
            .github/scripts/affected_mods_test.py \
            .github/scripts/affected_loaders_test.py \
            .github/scripts/mod_loaders_test.py \
            .github/scripts/main_selection_test.py \
            .github/scripts/select_coverage_tests_test.py \
            .github/scripts/added_loaders_test.py \
            .github/scripts/reference_needed_test.py \
            .github/scripts/reference_selection_test.py \
            .github/scripts/no_tests_test.py \
            .github/scripts/drain_caches_test.py \
            .github/scripts/sweep_caches_test.py \
            .github/scripts/markdown_columns_test.py \
            .github/scripts/windows_needed_test.py

      # The four standalone loaders resolve core from the repository the root build publishes it
      # into. Every loader job here has one checkout, so a hand-off that reached a shared directory
      # would resolve the right jar and nothing would notice. This is the check that says otherwise,
      # against a miniature repository and real Gradle.
      - name: Test the core hand-off
        if: github.event_name != 'pull_request'
        run: python3 .github/scripts/grug_core_handoff_test.py

      # Every invariant check the universal job runs on the real jar, each shown to catch the defect
      # it is for on a miniature jar, so a check that stopped looking fails here.
      - name: Test the universal jar's assembly and checks
        if: github.event_name != 'pull_request'
        run: python3 .github/scripts/universal_jar_test.py

      # The coverage job used to ask Gradle for this path, which cost it a cold Gradle start (~35s)
      # for one string. This job has already resolved core's dependencies and has a Gradle home with
      # them in, so it resolves the jar instead, and the version stays the jacoco plugin's own with no
      # second place to keep it in sync. Note that gradle.properties sets org.gradle.daemon=false, so
      # this is a second daemon fork rather than a warm one: what it saves is the resolution and the
      # cold cache, not the startup. Staged under a fixed name because only the upload step reads it.
      - name: Locate the JaCoCo CLI
        run: |
          cli=$(./gradlew -q :core:printJacocoCliPath -Dgrug.activeLoader=a1.1.2_01-ornithe | grep '^JACOCO_CLI=' | cut -d= -f2)
          mkdir -p coverage/tools
          cp "$cli" coverage/tools/jacoco-cli.jar

      # The coverage job downloads these to build the combined report the coverage gate checks.
      - name: Upload the coverage exec
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-exec-core
          path: core/build/jacoco/test.exec
          if-no-files-found: error
          retention-days: 7

      - name: Upload the compiled classes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-classes-core
          path: core/build/classes/java/main
          if-no-files-found: error
          retention-days: 7

      # The tool that records what each coverage test covered, for the carry-over of the tests a
      # diff cannot affect (#786): the coverage job runs it against this run's per-test exec data
      # to build the map, and a pull request's coverage job reconstructs the carried-over
      # coverage from the base commit's map with it. The jar bundles the JaCoCo core library's
      # classes, so the coverage job adds nothing to its classpath.
      - name: Upload the coverage map tool
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-map-tool
          path: core/build/libs/coverage-map-tool.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload the JaCoCo CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-cli
          path: coverage/tools/jacoco-cli.jar
          if-no-files-found: error
          retention-days: 7

  # Core's release jar, with gson relocated, which the universal job puts at the root of the
  # universal jar once for every loader. A job of its own, not a step of the core job after its tests:
  # the jar needs only the grug-rs library, so the universal jar (and the 20 jobs that consume it)
  # does not wait for core's tests (#570).
  core-release:
    name: core release jar
    if: github.event_name != 'pull_request' && needs.discover.outputs.no-tests != 'true'
    needs: [discover, grug-rs]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # The root build's Gradle caches, from the a1.1.2_01-ornithe entries this job's shadowJar
      # invocation scopes its build to, instead of setup-java's `cache: gradle`, whose wrapper entry
      # held the same ~/.gradle/wrapper as the dists entry under a second key (#825).
      - name: Restore the Gradle caches
        uses: ./.github/actions/restore-gradle-caches
        with:
          loader: a1.1.2_01-ornithe

      - name: Download the grug-rs static library
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grug-rs-library
          path: .grug-ci

      - name: Restore the generated adapter
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            core/build/generated/grug
            core/build/generated/sources/grug
          key: grug-adapter-${{ runner.os }}-${{ hashFiles('mod_api.json', 'core/generate.py') }}

      - name: Build core's release jar
        run: ./gradlew :core:shadowJar -Dgrug.activeLoader=a1.1.2_01-ornithe -Pgrug.prebuiltGrugRs="${{ github.workspace }}/.grug-ci/libgruggers.a"

      - name: Upload core's release jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-release
          path: core/build/libs/*-release.jar
          if-no-files-found: error
          retention-days: 7

  # This loader's layer of the universal jar: it compiles the loader and uploads the layer, and
  # nothing waits for a game to run. The universal job needs this matrix and not the build matrix
  # below, which compiles the loader again and then runs its suite, so the installed and smoke jobs
  # start while the suites are still running (#570). Compiling twice costs a runner, not wall time:
  # the two jobs start together.
  layer:
    name: layer ${{ matrix.dir }}
    if: github.event_name != 'pull_request' && needs.discover.outputs.no-tests != 'true'
    needs: [discover, grug-rs]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Restores the loader's caches and never writes them: this job stops after the build, so what
      # it would write lacks what the game resolves, and as the quicker job it would write first (#643).
      - name: Set up the loader build
        id: setup
        uses: ./.github/actions/setup-loader-build
        with:
          loader: ${{ matrix.dir }}
          save: 'false'

      - name: Build (${{ matrix.dir }}) and its layer
        run: .github/scripts/run-loader.sh "${{ matrix.dir }}" build
        env:
          GRUG_PREBUILT_GRUG_RS: ${{ github.workspace }}/.grug-ci/libgruggers.a

      - name: Upload the layer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: layer-${{ matrix.dir }}
          path: loaders/${{ matrix.dir }}/build/layer/grug-${{ matrix.dir }}.jar
          if-no-files-found: error
          retention-days: 7

  build:
    name: ${{ matrix.dir }}
    # A diff of prose alone cannot change a test's result, so the loader jobs skip (#785), and the
    # matrix is the run's selection (#909): a pull request runs the loaders its diff reaches plus one
    # representative per mechanism, a push runs every loader with the mods its job was given, a
    # dispatch and the schedule run every loader with every mod. An empty matrix is one GitHub
    # refuses, so the output is a condition here too, and only an explicit true skips on no-tests
    # (see the discover job).
    if: needs.discover.outputs.no-tests != 'true' && needs.discover.outputs.build != '[]'
    needs: [discover, grug-rs]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (inputs.repeats || vars.GRUG_CI_REPEATS || '1') == '1' && 15 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.build) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the loader build
        id: setup
        uses: ./.github/actions/setup-loader-build
        with:
          loader: ${{ matrix.dir }}

      # The 1.2.5 loader boots its game on Java 8. Install a JDK 8 alongside the build JDK and hand
      # its path to the loader through GRUG_JAVA8. JAVA_HOME goes back to 21 afterwards so the
      # Gradle 9 wrapper the standalone loaders use can still run.
      - name: Set up JDK 8 (1.2.5-forge only)
        if: matrix.dir == '1.2.5-forge'
        id: java8
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 8

      - name: Restore JDK 21 for Gradle (1.2.5-forge only)
        if: matrix.dir == '1.2.5-forge'
        run: echo "JAVA_HOME=${{ steps.setup.outputs.java21-path }}" >> "$GITHUB_ENV"

      # Pinned to ubuntu-24.04 (not ubuntu-latest): a later goal compares
      # screenshots pixel-for-pixel, which needs a stable Mesa/font stack
      # across runs.
      # x11-xserver-utils provides the xrandr binary, which LWJGL 2 (the
      # Alpha/Beta loaders) shells out to. Without it those loaders fail with
      # "No display mode extension is available".
      # The runner image ships an apt index and already carries most of these, so only what it lacks
      # is installed: `apt-get update` is about a third of this step's 8.9 s and runs only if that
      # index can no longer resolve a package (#697).
      - name: Install dependencies
        run: |
          packages=(
            xvfb xauth x11-xserver-utils
            libgl1 libgl1-mesa-dri libglx-mesa0
            libxrandr2 libxxf86vm1 libxcursor1 libx11-6 libxext6 libxrender1 libxinerama1
          )
          missing=()
          for package in "${packages[@]}"; do
            status=$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)
            [ "$status" = 'install ok installed' ] || missing+=("$package")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            # The image's index can have gone stale since it was built; updating is the slow path.
            if ! sudo apt-get install -y --no-install-recommends "${missing[@]}"; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends "${missing[@]}"
            fi
          fi

      # One Gradle invocation builds the loader and its layer and then runs the game (#678), so the
      # job pays one Gradle start and one configuration. A build failure still fails the step before
      # any game exists: the script tells it from a game that exited, and the game's time limit
      # starts when Gradle starts the runClient task. The layer job stays a build-only job.
      - name: Build and run tests (${{ matrix.dir }})
        run: xvfb-run -a -s "-screen 0 1280x720x24 +extension RANDR +extension GLX" .github/scripts/run-loader.sh "${{ matrix.dir }}" build-run
        env:
          # Empty for every loader except 1.2.5-forge; its game JVM uses this Java 8.
          GRUG_JAVA8: ${{ steps.java8.outputs.path }}
          GRUG_PREBUILT_GRUG_RS: ${{ github.workspace }}/.grug-ci/libgruggers.a
          # How many times the suite runs in one test run. A dispatch input wins, then the
          # repository variable GRUG_CI_REPEATS, then 1, which is what pull request runs use
          # because their inputs context is empty. See #268.
          GRUG_CI_REPEATS: ${{ inputs.repeats || vars.GRUG_CI_REPEATS || '1' }}
          # Which mods' tests run: the matrix entry's own selection (#909), which is every mod where
          # it is empty. A dispatch's input wins where the entry is empty, since a dispatch selects
          # nothing away; a name that is no mod fails the step before the game starts.
          GRUG_CI_MODS: ${{ matrix.mods || inputs.mods }}
          # The coverage tests the gate carries over instead of rerunning (#786), the discover
          # job's proof: a pull request's, empty otherwise. run-loader.sh checks each name
          # against the tree before the game starts and subtracts it from the expected count,
          # so a name the proof cannot back is a failure before the game, not a run that quietly
          # skipped more than it was asked to.
          GRUG_CI_COVERAGE_CARRY_OVER: ${{ needs.discover.outputs.carry-over }}
          # The watch covers the whole run: 300s for one pass (the slowest loader measured under 190s
          # of game time) plus 200s per extra pass. 1.2.5 is the slowest loader and took about 150s
          # per pass in the repeats runs of #583 (1068s for twenty passes when #291 measured it, before
          # the suite grew), so twenty passes get 4100s. See #291.
          GRUG_CI_RUN_TIMEOUT: '300'
          GRUG_CI_RUN_TIMEOUT_PER_EXTRA_REPEAT: '200'

      # The run wrote the loader's test order record back to the repository file it read it from
      # (#778), so a dispatch that asks for the refresh hands the file back rather than losing it
      # with the throwaway tree. The installed-game runs write their own copies and never upload
      # them, so the committed record is always what the development run last measured.
      - name: Upload the test order record the run wrote
        # always() so a refresh dispatch still gets the record a failed run wrote, which is the run
        # whose test times are most worth having; the job keeps its failed status regardless.
        if: ${{ always() && inputs.refresh-test-times == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-times-${{ matrix.dir }}
          path: loaders/${{ matrix.dir }}/test-times.json
          if-no-files-found: error
          retention-days: 7

      # The coverage gate matches a class by its bytes, so it has to read the classes the agent
      # instrumented. ForgeGradle puts the Java output in build/sourcesSets/main and the Loom
      # loaders use build/classes/java/main; 1.2.5-forge runs reobfuscated, so its dev classes are
      # not what ran (they still hold MCP names) and its coverageClasses task stages the jar's
      # entries at build/coverage-classes. A loader announces that stage by having the directory,
      # not by its name, so copying 1.2.5's pattern to another reobfuscated loader cannot silently
      # fall back to the dev classes and report every class as missed.
      - name: Stage the compiled classes
        run: |
          mkdir -p coverage-classes
          if [ -d "loaders/${{ matrix.dir }}/build/coverage-classes" ]; then
            cp -r "loaders/${{ matrix.dir }}/build/coverage-classes/." coverage-classes/
          else
            for dir in \
              "loaders/${{ matrix.dir }}/build/classes/java/main" \
              "loaders/${{ matrix.dir }}/build/sourcesSets/main"; do
              if [ -d "$dir" ]; then
                cp -r "$dir/." coverage-classes/
              fi
            done
          fi

      - name: Upload the coverage exec
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-exec-${{ matrix.dir }}
          path: |
            loaders/${{ matrix.dir }}/build/jacoco/*.exec
            loaders/${{ matrix.dir }}/build/jacoco/*.dropped
          if-no-files-found: error
          retention-days: 7

      - name: Upload the compiled classes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-classes-${{ matrix.dir }}
          path: coverage-classes
          if-no-files-found: error
          retention-days: 7

      # The first failure with its context, on the run's summary page, so nobody opens a log of
      # thousands of lines to find it. run-loader.sh tees the game log to ci-run-loader.log; a
      # failure before the game starts (a compile error) is not in it, so fall back to its tail.
      - name: Summarize the failure
        if: failure()
        run: |
          log="loaders/${{ matrix.dir }}/run/ci-run-loader.log"
          {
            echo "### ${{ matrix.dir }}"
            echo '```'
            if [ -f "$log" ] && grep -q '\[GRUG CI\] FAIL' "$log"; then
              grep -m1 -B 20 -A 20 '\[GRUG CI\] FAIL' "$log"
            elif [ -f "$log" ]; then
              tail -n 40 "$log"
            else
              echo "No game log; see the failed step (a build or compile error)."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and crash reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loader-${{ matrix.dir }}-logs
          path: |
            loaders/${{ matrix.dir }}/run/logs
            loaders/${{ matrix.dir }}/run/crash-reports
            loaders/${{ matrix.dir }}/run/ci-run-loader.log
            loaders/${{ matrix.dir }}/run/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7

      # A screenshot that matched none of a reference's accepted PNGs is written here, mirroring the
      # reference path. Download this artifact and drop the loader-named PNGs into the reference
      # directory to accept this platform's rendering.
      - name: Upload unmatched screenshot captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loader-${{ matrix.dir }}-screenshots
          path: loaders/${{ matrix.dir }}/run/grug-screenshot-artifacts
          if-no-files-found: ignore
          retention-days: 7

  # The reference run (#574, #832): the reference named by the mod under test's first derived_from
  # entry, on that entry's runtime, driven by the mod's screenshot tests and compared with the
  # committed goldens. A dispatch names the mod; every other event runs the default, buildcraft, so a
  # pull request's reference is unchanged. Only the reference's runtime is a strict graphical
  # reference, so a mismatch here means the port's golden is not what the reference draws, and it
  # fails like any loader job. GrugScreenshots compares a reference run only with the PNG named
  # after its own loader, so it cannot pass on another loader's golden.
  reference:
    name: reference
    # A diff that touches neither the harness of the mod this job runs nor its loader cannot change
    # what it draws, whether the run is a pull request or a push to main (#631, #909): discover asks
    # reference-needed.py, which explains its answer in this log, and a dispatch and the weekly
    # schedule run it as the full runs they are. Only an explicit false skips it, so a step that
    # wrote no output runs it, and a diff of prose alone skips it like the game jobs (#785).
    if: |
      needs.discover.outputs.no-tests != 'true'
      && needs.discover.outputs.reference != 'false'
    needs: [discover, grug-rs]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Read the mod under test's first derived_from entry to learn what to run (#832). A dispatch
      # names the mod; every other event runs the default, buildcraft. The script prints to this log
      # which derived_from entry was chosen, and it fails this job clearly when the mod names no
      # entry to run, rather than silently running nothing. It is the single source of the mod,
      # loader and Java every step below drives from.
      - name: Select the reference mod and its runtime
        id: select
        env:
          REFERENCE_MOD: ${{ inputs.reference-mod || 'buildcraft' }}
        run: |
          python3 .github/scripts/reference-selection.py "$REFERENCE_MOD" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        id: java21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # The game boots on the runtime's Java, as in the loader job. buildcraft's is 8, so this sets
      # up JDK 8; a runtime on Java 21 needs none, since 21 is already the build JDK.
      - name: Set up the reference's game JDK
        id: gamejava
        if: steps.select.outputs.java != '21'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ steps.select.outputs.java }}

      - name: Restore JDK 21 for Gradle
        run: echo "JAVA_HOME=${{ steps.java21.outputs.path }}" >> "$GITHUB_ENV"

      - name: Download the grug-rs static library
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grug-rs-library
          path: .grug-ci

      # The same three entries the loader job for the loader the runtime names restores, so neither
      # job resolves its Gradle dependencies or unpacks a Gradle distribution again. See the loader
      # job for why each is keyed so. The action's expressions have to stay the same as the loader
      # action's key for the selected loader, or this job reads an entry of its own that the loader
      # job never writes.
      #
      # The action restores the distribution, the rest of Gradle's user home and the dependencies,
      # and writes none of them. It replaces setup-java's `cache: gradle`, whose wrapper entry was a
      # second copy of the same distribution (#825), the inline distribution and dependency steps
      # that were here, which were the same two entries, and the dependency half of setup-java's
      # cache.
      - name: Restore the Gradle caches
        uses: ./.github/actions/restore-gradle-caches
        with:
          loader: ${{ steps.select.outputs.loader }}

      - name: Cache the 1.2.5 MCP snapshot
        if: steps.select.outputs.loader == '1.2.5-forge'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: loaders/1.2.5-forge/mcp125
          key: grug-mcp125-v2-${{ runner.os }}-${{ hashFiles('loaders/1.2.5-forge/build.gradle') }}

      # The reference's jars are pinned by sha256 in the mod's about.json, so the entry is keyed on
      # it: a changed pin misses and downloads again, and verify checks every hash either way.
      - name: Cache the reference artifacts
        id: reference-artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reference-artifacts
          key: grug-reference-${{ hashFiles(format('mods/{0}/about.json', steps.select.outputs.mod)) }}

      - name: Download and verify the reference artifacts
        if: steps.reference-artifacts.outputs.cache-hit != 'true'
        run: python3 recreation.py verify mods/${{ steps.select.outputs.mod }}/about.json --output reference-artifacts

      # stage hashes every artifact again before it copies it, so a restored cache is checked too.
      - name: Stage the reference install
        run: |
          python3 recreation.py stage mods/${{ steps.select.outputs.mod }}/about.json \
            --artifacts reference-artifacts \
            --destination loaders/${{ steps.select.outputs.loader }}/run/reference-mods
          echo "The reference run loads:"
          (cd loaders/${{ steps.select.outputs.loader }}/run/reference-mods && sha256sum -- *)

      # The harness is the mod's tests that have a reference side, the ones that capture a screenshot
      # or branch on Test.is_reference(), plus about.json, LICENSE and goldens without its code, so the
      # real reference provides every block and the harness only drives the tests. The game dies
      # before the tests without the LICENSE.
      - name: Assemble the reference harness
        run: |
          mod="${{ steps.select.outputs.mod }}"
          harness="$GITHUB_WORKSPACE/reference-harness"
          mkdir -p "$harness/$mod/tests"
          cp "mods/$mod/about.json" "$harness/$mod/"
          if [ -f "mods/$mod/LICENSE" ]; then
            cp "mods/$mod/LICENSE" "$harness/$mod/"
          fi
          if [ -d "mods/$mod/screenshots" ]; then
            cp -r "mods/$mod/screenshots" "$harness/$mod/"
          fi
          for test in $(grep -l -e "Test.screenshot" -e "Test.is_reference" "mods/$mod/tests/"*-Test.grug 2>/dev/null); do
            cp "$test" "$harness/$mod/tests/"
          done
          echo "The reference harness is $harness:"
          (cd "$harness" && find . -type f -not -name '*.png' | sort)

      # The runner image ships an apt index and already carries most of these, so only what it lacks
      # is installed: `apt-get update` is about a third of this step's 8.9 s and runs only if that
      # index can no longer resolve a package (#697).
      - name: Install dependencies
        run: |
          packages=(
            xvfb xauth x11-xserver-utils
            libgl1 libgl1-mesa-dri libglx-mesa0
            libxrandr2 libxxf86vm1 libxcursor1 libx11-6 libxext6 libxrender1 libxinerama1
          )
          missing=()
          for package in "${packages[@]}"; do
            status=$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)
            [ "$status" = 'install ok installed' ] || missing+=("$package")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            # The image's index can have gone stale since it was built; updating is the slow path.
            if ! sudo apt-get install -y --no-install-recommends "${missing[@]}"; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends "${missing[@]}"
            fi
          fi

      - name: Run the reference (${{ steps.select.outputs.loader }})
        run: xvfb-run -a -s "-screen 0 1280x720x24 +extension RANDR +extension GLX" .github/scripts/run-loader.sh ${{ steps.select.outputs.loader }} run
        env:
          GRUG_REFERENCE: '1'
          GRUG_MODS_DIR: ${{ github.workspace }}/reference-harness
          GRUG_REFERENCE_MODS_DIR: ${{ github.workspace }}/loaders/${{ steps.select.outputs.loader }}/run/reference-mods
          GRUG_JAVA8: ${{ steps.gamejava.outputs.path }}
          GRUG_PREBUILT_GRUG_RS: ${{ github.workspace }}/.grug-ci/libgruggers.a
          GRUG_CI_RUN_TIMEOUT: '360'

      - name: Upload logs and crash reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-${{ steps.select.outputs.loader }}-logs
          path: |
            loaders/${{ steps.select.outputs.loader }}/run/logs
            loaders/${{ steps.select.outputs.loader }}/run/crash-reports
            loaders/${{ steps.select.outputs.loader }}/run/ci-run-loader.log
            loaders/${{ steps.select.outputs.loader }}/run/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7

      # The reference's capture and diff for the golden it missed. The capture is the reference's own
      # rendering, so it is what that loader's golden should hold once the port draws the same.
      - name: Upload unmatched screenshot captures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-${{ steps.select.outputs.loader }}-screenshots
          path: loaders/${{ steps.select.outputs.loader }}/run/grug-screenshot-artifacts
          if-no-files-found: ignore
          retention-days: 7

  # Loaders on Windows (#530, #531): a1.1.2_01-ornithe, whose Windows setup is least like the others,
  # and the other four, so the DLL, JNI, and core's Windows paths are exercised by a game that really
  # starts, in each loader's own adapter. It runs on a dispatch, the full run a release needs, and on a
  # push only for a loader the push adds (#632): a change that boots on Linux cannot fail to boot on
  # Windows without failing on Linux first. A verification dispatch that names a base runs it only
  # when that diff reaches the native path or the installed jar (#826), and a dispatch on main or with
  # no base always runs it. So its matrix is discover's answer, not a list here that a loader could be
  # added without. A pull request never runs it, and neither does it run a change confined to a mod,
  # which reaches no native.
  windows:
    name: ${{ matrix.dir }} (Windows)
    if: needs.discover.outputs.windows != '[]'
    needs: [discover]
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.windows) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        id: java21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # 1.2.5 boots its game on Java 8 through GRUG_JAVA8, as in the Linux jobs, and JAVA_HOME goes
      # back to 21 for the Gradle 9 wrapper.
      - name: Set up JDK 8 (1.2.5-forge only)
        if: matrix.dir == '1.2.5-forge'
        id: java8
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 8

      - name: Restore JDK 21 for Gradle (1.2.5-forge only)
        if: matrix.dir == '1.2.5-forge'
        shell: bash
        run: echo "JAVA_HOME=${{ steps.java21.outputs.path }}" >> "$GITHUB_ENV"

      # The loader's dependencies, kept as the Linux jobs keep them (see
      # .github/actions/setup-loader-build): cache: gradle above is one entry for the five loaders of
      # this matrix, written by whichever leg finishes first, so four of five legs restored an entry
      # without their dependencies and fetched them, repo.legacyfabric.net's LWJGL among them (#643).
      # Only this leg's files, as in the action, so an edit confined to another loader leaves this
      # leg's entry alone (#699).
      #
      # Not the workflow (#783), as in the action: build.yml names the job and the matrix, and the
      # files above decide what the entry holds. Hashing it rekeyed all five Windows legs on every
      # edit of the workflow, and each leg restores its previous entry through the prefix and then
      # writes the new one, so an edit that changed nothing cost about 350 MB of new entries (#699).
      #
      # The path below is then the one thing no file in the key names. `modules-2` is content
      # addressed and Gradle verifies what it restores, so an edit of that line costs a fetch of what
      # the entry lacks and never a wrong entry.
      - name: Cache the Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/modules-2
          key: grug-gradle-${{ runner.os }}-${{ matrix.dir }}-${{ hashFiles('gradle.properties', 'settings.gradle.kts', 'gradle/jacoco-loader.gradle', format('loaders/{0}/gradle.properties', matrix.dir), format('loaders/{0}/gradle/wrapper/gradle-wrapper.properties', matrix.dir), format('loaders/{0}/settings.gradle', matrix.dir), format('loaders/{0}/settings.gradle.kts', matrix.dir), format('loaders/{0}/build.gradle', matrix.dir), format('loaders/{0}/build.gradle.kts', matrix.dir)) }}
          restore-keys: grug-gradle-${{ runner.os }}-${{ matrix.dir }}-

      - name: Set up the MSVC toolchain
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0

      # run-loader.sh is bash, and Git for Windows puts its coreutils link.exe ahead of MSVC's linker
      # in a bash step's PATH, so rustc would run the wrong one. The runner has no use for it.
      - name: Take Git's link.exe off the PATH
        shell: pwsh
        run: Remove-Item "C:\Program Files\Git\usr\bin\link.exe"

      # 1.20.6 and 1.2.5 open their window before grug loads, so unlike the other loaders they need
      # an OpenGL. The runner has no GPU, and the OpenGL Windows itself provides cannot give LWJGL
      # an accelerated pixel format (1.2.5 without it dies with "Pixel format not accelerated", 1.20.6
      # hangs opening its window). Mesa's llvmpipe renders in software; it is registered as the
      # OpenGL driver with its own system-wide deploy script (unattended mode, choice 1), because
      # LWJGL asks GDI, which goes to the registered driver. Pinned like every other version here.
      - name: Install software OpenGL (loaders that open a window first)
        if: matrix.dir == '1.20.6-forge' || matrix.dir == '1.2.5-forge'
        shell: pwsh
        env:
          MESA_VERSION: 26.2.4
          MESA_SHA256: 351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695
        run: |
          $archive = "$env:RUNNER_TEMP\mesa.7z"
          Invoke-WebRequest "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $env:MESA_SHA256.ToUpper()) { throw "mesa3d archive does not match its pinned checksum" }
          7z x $archive "-o$env:RUNNER_TEMP\mesa" -y | Out-Null
          Push-Location "$env:RUNNER_TEMP\mesa"
          cmd /c "systemwidedeploy.cmd 1"
          Pop-Location
          Get-ChildItem "$env:windir\System32\mesadrv.dll"
          reg query "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\OpenGLDrivers\MSOGL"

      # Where no window opens before grug loads, none is ever opened: with GRUG_CI_BOOT_ONLY the game stops itself, with status 0, as soon
      # as grug has compiled its mods. By then the native has loaded, the VM has started and the mods
      # directory has been read, which is everything specific to grug on Windows. What the rest of a run
      # adds, a window, OpenGL and screenshots that the goldens were made for on Linux, is vanilla's and
      # the same shared code the Linux jobs test (#530).
      - name: Load grug in ${{ matrix.dir }}
        shell: bash
        run: .github/scripts/run-loader.sh ${{ matrix.dir }} run
        env:
          GRUG_JAVA8: ${{ steps.java8.outputs.path }}
          GRUG_CI_BOOT_ONLY: '1'
          GALLIUM_DRIVER: llvmpipe
          GRUG_CI_RUN_TIMEOUT: '600'

      - name: Upload logs and crash reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.dir }}-logs
          path: |
            loaders/${{ matrix.dir }}/run/logs
            loaders/${{ matrix.dir }}/run/crash-reports
            loaders/${{ matrix.dir }}/run/ci-run-loader.log
            loaders/${{ matrix.dir }}/run/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unmatched screenshot captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.dir }}-screenshots
          path: loaders/${{ matrix.dir }}/run/grug-screenshot-artifacts
          if-no-files-found: ignore
          retention-days: 7

  # The same loaders installed the way a player's launcher does it, on Windows (#530): the jar a
  # player downloads, in the game portablemc installs, loading grug on the platform most players use.
  # Boot-only for the reason the job above gives, and it runs when that one does (#632).
  windows-installed:
    name: ${{ matrix.dir }} installed (Windows)
    # universal can run after a native-windows that skipped, and a skipped ancestor skips every job
    # below it unless the condition names a status function, so this names one and universal's own
    # result rather than leaving a job this run wants to the default (#920 review).
    if: |
      !cancelled()
      && needs.universal.result == 'success'
      && needs.discover.outputs.windows != '[]'
    needs: [discover, universal]
    runs-on: windows-2025
    # Both script limits can run in full now that the install has its own: up to 600 s of install
    # (GRUG_CI_INSTALL_TIMEOUT) and then the game's 480 s (#725), plus the job's setup.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.windows) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        id: java21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # 1.2.5 boots its game on Java 8 through GRUG_JAVA8, as in the Linux jobs, and JAVA_HOME goes
      # back to 21 for the Gradle 9 wrapper.
      - name: Set up JDK 8 (1.2.5-forge only)
        if: matrix.dir == '1.2.5-forge'
        id: java8
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 8

      - name: Restore JDK 21 for Gradle (1.2.5-forge only)
        if: matrix.dir == '1.2.5-forge'
        shell: bash
        run: echo "JAVA_HOME=${{ steps.java21.outputs.path }}" >> "$GITHUB_ENV"

      - name: Download the universal jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grug-universal
          path: universal

      # 1.20.6 and 1.2.5 open their window before grug loads, so unlike the other loaders they need
      # an OpenGL. The runner has no GPU, and the OpenGL Windows itself provides cannot give LWJGL
      # an accelerated pixel format (1.2.5 without it dies with "Pixel format not accelerated", 1.20.6
      # hangs opening its window). Mesa's llvmpipe renders in software; it is registered as the
      # OpenGL driver with its own system-wide deploy script (unattended mode, choice 1), because
      # LWJGL asks GDI, which goes to the registered driver. Pinned like every other version here.
      - name: Install software OpenGL (loaders that open a window first)
        if: matrix.dir == '1.20.6-forge' || matrix.dir == '1.2.5-forge'
        shell: pwsh
        env:
          MESA_VERSION: 26.2.4
          MESA_SHA256: 351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695
        run: |
          $archive = "$env:RUNNER_TEMP\mesa.7z"
          Invoke-WebRequest "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $env:MESA_SHA256.ToUpper()) { throw "mesa3d archive does not match its pinned checksum" }
          7z x $archive "-o$env:RUNNER_TEMP\mesa" -y | Out-Null
          Push-Location "$env:RUNNER_TEMP\mesa"
          cmd /c "systemwidedeploy.cmd 1"
          Pop-Location
          Get-ChildItem "$env:windir\System32\mesadrv.dll"
          reg query "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\OpenGLDrivers\MSOGL"

      # Kept between runs for the reason the Linux production job gives.
      - name: Cache Legacy Fabric's LWJGL (Alpha and Beta loaders only)
        if: matrix.dir == 'a1.1.2_01-ornithe' || matrix.dir == 'b1.7.3-ornithe' || matrix.dir == 'b1.7.3-stationapi'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/grug-production/lwjgl-*
            ~/.cache/grug-production/main/libraries/org/lwjgl/lwjgl
          key: grug-lwjgl-${{ runner.os }}-${{ matrix.dir }}-${{ hashFiles('.github/scripts/launcher.sh') }}

      # Relative, because the script reads it from Git Bash, where a Windows path with backslashes is
      # not one.
      - name: Load grug in an installed ${{ matrix.dir }}
        shell: bash
        run: .github/scripts/run-loader.sh ${{ matrix.dir }} production
        env:
          GRUG_JAVA8: ${{ steps.java8.outputs.path }}
          GRUG_UNIVERSAL_JAR: universal/grug.jar
          GRUG_CI_BOOT_ONLY: '1'
          GALLIUM_DRIVER: llvmpipe
          # The game's own limit. The launcher's install has its own, GRUG_CI_INSTALL_TIMEOUT (600 s
          # by default), so a slow download there cannot spend this time (#725).
          GRUG_CI_RUN_TIMEOUT: '480'

      - name: Upload logs and crash reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-windows-${{ matrix.dir }}-logs
          path: |
            loaders/${{ matrix.dir }}/build/ci-production.log
            loaders/${{ matrix.dir }}/build/production-game/logs
            loaders/${{ matrix.dir }}/build/production-game/crash-reports
            loaders/${{ matrix.dir }}/build/production-game/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7

  # Assembles the universal jar from core's release jar and every loader's layer, the jar a player
  # downloads, and fails unless it holds every invariant universal_jar.py checks: no duplicate
  # paths, every class in its loader's package, one layer per loaders/* directory, the native,
  # mod_api.json and each bundled mod exactly once, metadata whose entrypoints and mixins exist,
  # and exactly one layer activating on each supported game and none on the others. See #488.
  # Its real inputs are the compiled parts, so it needs the layer matrix, core's release jar and the
  # Windows native when the run built one, and none of the test jobs: the installed and smoke jobs
  # below start while the suites are still running (#570).
  # The native is the run's to add (#784, #826): a dispatch and a push that adds a loader build it, so
  # a normal push's jar is a Linux jar, and a verification dispatch that names a base leaves it out
  # when the diff cannot reach the native path. The Linux jobs below run the jar as it is, and the
  # Windows ones run it only on a dispatch that built the native. The job therefore names each result
  # it needs instead of relying on the default, which a skipped native-windows would otherwise fail:
  # it waits for that artifact when there is one and assembles without it when there is none.
  universal:
    name: universal jar
    if: |
      !cancelled()
      && needs.core-release.result == 'success'
      && needs.layer.result == 'success'
      && (needs.native-windows.result == 'success' || needs.native-windows.result == 'skipped')
      && github.event_name != 'pull_request'
      && needs.discover.outputs.no-tests != 'true'
    needs: [discover, core-release, layer, native-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the layers and core's release jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '{layer-*,core-release}'
          path: universal/parts
          merge-multiple: true

      # A pattern that matches no artifact fails the download, so the native is a step of its own with
      # a condition (#784). It lands at universal/parts/adapter.dll, where the two steps below look.
      - name: Download the Windows native when this run built one
        # native-windows' own result decides, not discover's output: this job does not list discover
        # in needs, so that output is null here and the step would run on a push that built nothing
        # (the bug that reddened main after #784).
        if: needs.native-windows.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-windows
          path: universal/parts

      # The outer mod reports core's version, which carries the commit, so a jar names the commit it
      # was built from. Without the native the jar is a Linux jar, and the check below is told so.
      - name: Assemble the universal jar
        run: |
          core=$(ls universal/parts/core-*-release.jar)
          version=$(basename "$core" | sed -E 's/^core-(.+)-release\.jar$/\1/')
          native=()
          if [ -f universal/parts/adapter.dll ]; then
            native=(--native universal/parts/adapter.dll)
          fi
          python3 .github/scripts/universal_jar.py assemble --core "$core" --version "$version" \
            --out universal/grug.jar "${native[@]}" universal/parts/grug-*.jar

      - name: Check the universal jar's invariants
        run: |
          if [ -f universal/parts/adapter.dll ]; then
            python3 .github/scripts/universal_jar.py check universal/grug.jar
          else
            python3 .github/scripts/universal_jar.py check universal/grug.jar --no-windows-native
          fi

      - name: Upload the universal jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grug-universal
          path: universal/grug.jar
          if-no-files-found: error
          # release.yml attaches this artifact to a release, so it has to outlive the week the others keep.
          retention-days: 90

  # The suite again, in a game installed the way a player installs one, with the universal jar as its
  # only grug: no repository mods, no GRUG_MODS_DIR and no development classpath. Every loader runs
  # the very same jar, which is the smoke test that the assembled jar works and not only its layers.
  # It is the same suite, so it runs the same selection (#909): the loaders the mod and loader axes
  # chose, on the mods they chose, and no other loader's job, since a loader the selection leaves out
  # runs its development job on the coverage mod alone for the gate.
  # See #487 and #488.
  production:
    name: ${{ matrix.dir }} installed
    # universal runs after a native-windows that skipped, but GitHub skips a job whose condition does
    # not name a status function when an ancestor skipped, so a plain `if:` skipped this job on every
    # push that adds no loader, and on the weekly schedule (#920 review; run 41282659606).
    # `!cancelled()` is that function, and universal's own result still skips the job when universal
    # failed or did not run.
    if: |
      !cancelled()
      && needs.universal.result == 'success'
      && github.event_name != 'pull_request'
      && needs.discover.outputs.no-tests != 'true'
      && needs.discover.outputs.installed != '[]'
    needs: [discover, universal]
    runs-on: ubuntu-24.04
    # Both script limits can run in full now that the install has its own: up to 600 s of install
    # (GRUG_CI_INSTALL_TIMEOUT) and then the game's 480 s (#725), plus the job's setup.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.installed) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        id: java21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # 1.2.5's installed game boots on Java 8 through the loader's own Gradle wrapper, as in the build
      # job; JAVA_HOME goes back to 21 for that wrapper.
      - name: Set up JDK 8 (1.2.5-forge only)
        if: matrix.dir == '1.2.5-forge'
        id: java8
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 8

      - name: Restore JDK 21 for Gradle (1.2.5-forge only)
        if: matrix.dir == '1.2.5-forge'
        run: echo "JAVA_HOME=${{ steps.java21.outputs.path }}" >> "$GITHUB_ENV"

      # Only 1.2.5's launch runs Gradle, to obfuscate its runtime out of the MCP snapshot; the other
      # four are installed by a launcher. Restored from the build job's caches, never saved here, and
      # split as the build job splits them (see .github/actions/setup-loader-build).
      - name: Restore the Gradle distributions (1.2.5-forge only)
        if: matrix.dir == '1.2.5-forge'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/wrapper
          key: grug-gradle-dists-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'loaders/*/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: grug-gradle-dists-${{ runner.os }}-

      - name: Restore the Gradle dependencies (1.2.5-forge only)
        if: matrix.dir == '1.2.5-forge'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/modules-2
          key: grug-gradle-${{ runner.os }}-${{ matrix.dir }}-${{ hashFiles('.github/actions/setup-loader-build/action.yml', 'gradle.properties', 'settings.gradle.kts', 'gradle/jacoco-loader.gradle', 'loaders/1.2.5-forge/gradle.properties', 'loaders/1.2.5-forge/gradle/wrapper/gradle-wrapper.properties', 'loaders/1.2.5-forge/settings.gradle', 'loaders/1.2.5-forge/settings.gradle.kts', 'loaders/1.2.5-forge/build.gradle', 'loaders/1.2.5-forge/build.gradle.kts') }}
          restore-keys: grug-gradle-${{ runner.os }}-${{ matrix.dir }}-

      - name: Restore the 1.2.5 MCP snapshot (1.2.5-forge only)
        if: matrix.dir == '1.2.5-forge'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: loaders/1.2.5-forge/mcp125
          key: grug-mcp125-v2-${{ runner.os }}-${{ hashFiles('loaders/1.2.5-forge/build.gradle') }}

      # The same display stack as the build job, for the same reasons.
      # The runner image ships an apt index and already carries most of these, so only what it lacks
      # is installed: `apt-get update` is about a third of this step's 8.9 s and runs only if that
      # index can no longer resolve a package (#697).
      - name: Install dependencies
        run: |
          packages=(
            xvfb xauth x11-xserver-utils
            libgl1 libgl1-mesa-dri libglx-mesa0
            libxrandr2 libxxf86vm1 libxcursor1 libx11-6 libxext6 libxrender1 libxinerama1
          )
          missing=()
          for package in "${packages[@]}"; do
            status=$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)
            [ "$status" = 'install ok installed' ] || missing+=("$package")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            # The image's index can have gone stale since it was built; updating is the slow path.
            if ! sudo apt-get install -y --no-install-recommends "${missing[@]}"; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends "${missing[@]}"
            fi
          fi

      - name: Download the universal jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grug-universal
          path: universal

      # Legacy Fabric's LWJGL, which the Alpha and Beta games need from maven.legacyfabric.net: Babric's
      # launch has launcher.sh download it (lwjgl-*), and Ornithe's profile names it for the launcher
      # itself (main/libraries). Both lived only as long as the job. Kept between runs, an outage of
      # that host (#643) does not reach these jobs. One entry per loader, because an entry is written
      # once by whichever job finishes first.
      - name: Cache Legacy Fabric's LWJGL (Alpha and Beta loaders only)
        if: matrix.dir == 'a1.1.2_01-ornithe' || matrix.dir == 'b1.7.3-ornithe' || matrix.dir == 'b1.7.3-stationapi'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/grug-production/lwjgl-*
            ~/.cache/grug-production/main/libraries/org/lwjgl/lwjgl
          key: grug-lwjgl-${{ runner.os }}-${{ matrix.dir }}-${{ hashFiles('.github/scripts/launcher.sh') }}

      - name: Run tests in an installed game (${{ matrix.dir }})
        run: xvfb-run -a -s "-screen 0 1280x720x24 +extension RANDR +extension GLX" .github/scripts/run-loader.sh "${{ matrix.dir }}" production
        env:
          GRUG_JAVA8: ${{ steps.java8.outputs.path }}
          GRUG_UNIVERSAL_JAR: ${{ github.workspace }}/universal/grug.jar
          # The mods this run's suite is (#909): the matrix entry's selection, empty for every mod.
          GRUG_CI_MODS: ${{ matrix.mods }}
          # The game's own limit. The launcher's install has its own, GRUG_CI_INSTALL_TIMEOUT (600 s
          # by default), so a slow download there cannot spend this time (#725).
          GRUG_CI_RUN_TIMEOUT: '480'

      - name: Upload logs and crash reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-${{ matrix.dir }}-logs
          path: |
            loaders/${{ matrix.dir }}/build/ci-production.log
            loaders/${{ matrix.dir }}/build/production-game/logs
            loaders/${{ matrix.dir }}/build/production-game/crash-reports
            loaders/${{ matrix.dir }}/build/production-game/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unmatched screenshot captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-${{ matrix.dir }}-screenshots
          path: loaders/${{ matrix.dir }}/build/production-game/grug-screenshot-artifacts
          if-no-files-found: ignore
          retention-days: 7

  # The suite again in an installed 1.20.6 Forge, with JEI beside the universal jar: grug next to a
  # non-grug mod that reads and renders every registered item, grug's included, and draws over the
  # screens grug's tests open. Both have to work: the suite passes, JEI starts and logs no error.
  # The production jobs keep grug as the game's only mod. It runs the run's selection (#909) and every
  # mod is still loaded, so JEI still lists every registered item; only the tests are narrowed.
  # See #501.
  coexistence:
    name: 1.20.6-forge installed beside JEI
    # The same status function as production: it needs universal, which can run after a skipped
    # native-windows, so without `!cancelled()` this job skipped every push that added no loader
    # (#920 review).
    if: |
      !cancelled()
      && needs.universal.result == 'success'
      && github.event_name != 'pull_request'
      && needs.discover.outputs.no-tests != 'true'
    needs: [discover, universal]
    runs-on: ubuntu-24.04
    # Both script limits can run in full now that the install has its own: up to 600 s of install
    # (GRUG_CI_INSTALL_TIMEOUT) and then the game's 480 s (#725), plus the job's setup.
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # The same display stack as the build job, for the same reasons.
      # The runner image ships an apt index and already carries most of these, so only what it lacks
      # is installed: `apt-get update` is about a third of this step's 8.9 s and runs only if that
      # index can no longer resolve a package (#697).
      - name: Install dependencies
        run: |
          packages=(
            xvfb xauth x11-xserver-utils
            libgl1 libgl1-mesa-dri libglx-mesa0
            libxrandr2 libxxf86vm1 libxcursor1 libx11-6 libxext6 libxrender1 libxinerama1
          )
          missing=()
          for package in "${packages[@]}"; do
            status=$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)
            [ "$status" = 'install ok installed' ] || missing+=("$package")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            # The image's index can have gone stale since it was built; updating is the slow path.
            if ! sudo apt-get install -y --no-install-recommends "${missing[@]}"; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends "${missing[@]}"
            fi
          fi

      - name: Download the universal jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grug-universal
          path: universal

      - name: Run tests in an installed game beside JEI
        run: xvfb-run -a -s "-screen 0 1280x720x24 +extension RANDR +extension GLX" .github/scripts/run-loader.sh 1.20.6-forge production
        env:
          GRUG_BESIDE: jei
          GRUG_UNIVERSAL_JAR: ${{ github.workspace }}/universal/grug.jar
          # Only coverage's tests. Every mod is still loaded, so JEI still lists every registered
          # item, which is what this job checks, but real JEI draws its own item list on the same
          # screens and in the same rectangle as the port's JEI overlay, so a screenshot test of
          # that overlay cannot compare here. The other mods' tests still run in the development,
          # installed and production jobs, which install no JEI beside them.
          GRUG_CI_MODS: coverage
          # The game's own limit; the install has its own, GRUG_CI_INSTALL_TIMEOUT (600 s default),
          # so a slow download of the installer or the game cannot spend this time (#725).
          GRUG_CI_RUN_TIMEOUT: '480'

      # JEI builds its ingredient list from every registered item before it logs this line, so an item
      # of grug's that JEI cannot read shows up here as an error or as JEI never starting.
      - name: Require JEI to have started without an error
        run: |
          log=loaders/1.20.6-forge/build/production-game/logs/latest.log
          if ! grep -q 'Starting JEI GUI' "$log"; then
            echo "==> ERROR: JEI never logged 'Starting JEI GUI' in $log"
            exit 1
          fi
          if grep -E '/(ERROR|FATAL)\] \[mezz\.jei' "$log"; then
            echo "==> ERROR: JEI logged the errors above"
            exit 1
          fi

      - name: Upload logs and crash reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coexistence-1.20.6-forge-logs
          path: |
            loaders/1.20.6-forge/build/ci-production.log
            loaders/1.20.6-forge/build/production-game/logs
            loaders/1.20.6-forge/build/production-game/crash-reports
            loaders/1.20.6-forge/build/production-game/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unmatched screenshot captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coexistence-1.20.6-forge-screenshots
          path: loaders/1.20.6-forge/build/production-game/grug-screenshot-artifacts
          if-no-files-found: ignore
          retention-days: 7

  # Boots one game per mechanism a mod loader reads the jar by, among the games grug has no layer for,
  # with the universal jar as its only mod. Where grug's code runs, the game has to stop with grug's
  # own error through its loader's error path; elsewhere it has to reach its first screen with grug
  # inactive. A game that gains a loader leaves this job for production, and universal_jar.py then
  # asks for another game of its mechanism. See #493.
  smoke:
    name: ${{ matrix.game }} without a layer
    # A mod's own files cannot reach a game grug never activates on, so a push that touched only mods
    # skips these games (#909); everything else runs them. Only an explicit false skips, so a step
    # that wrote no output runs them. The same status function as production goes first, so a skipped
    # native-windows cannot take the games with it (#920 review).
    if: |
      !cancelled()
      && needs.universal.result == 'success'
      && github.event_name != 'pull_request'
      && needs.discover.outputs.no-tests != 'true'
      && needs.discover.outputs.smoke-needed != 'false'
    needs: [discover, universal]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.smoke) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Babric runs on the Java the runner has, as a player of it picks; every other game takes the
      # runtime Mojang's profile names, as the vanilla launcher does.
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # The display stack of the production job, and ImageMagick for the screen capture.
      # The runner image ships an apt index and already carries most of these, so only what it lacks
      # is installed: `apt-get update` is about a third of this step's 8.9 s and runs only if that
      # index can no longer resolve a package (#697).
      - name: Install dependencies
        run: |
          packages=(
            xvfb xauth x11-xserver-utils imagemagick
            libgl1 libgl1-mesa-dri libglx-mesa0
            libxrandr2 libxxf86vm1 libxcursor1 libx11-6 libxext6 libxrender1 libxinerama1
          )
          missing=()
          for package in "${packages[@]}"; do
            status=$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)
            [ "$status" = 'install ok installed' ] || missing+=("$package")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            # The image's index can have gone stale since it was built; updating is the slow path.
            if ! sudo apt-get install -y --no-install-recommends "${missing[@]}"; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends "${missing[@]}"
            fi
          fi

      - name: Download the universal jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grug-universal
          path: universal

      # Babric's launch downloads Legacy Fabric's LWJGL, so this game keeps it between runs.
      - name: Cache the LWJGL launcher.sh downloads (Babric only)
        if: matrix.recipe == 'babric-b1.7.3'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/grug-production/lwjgl-*
          key: grug-lwjgl-${{ runner.os }}-${{ hashFiles('.github/scripts/launcher.sh') }}

      - name: Boot ${{ matrix.game }} with the universal jar as its only mod
        run: xvfb-run -a -s "-screen 0 1280x720x24 +extension RANDR +extension GLX" .github/scripts/smoke-launch.sh "${{ matrix.recipe }}" universal/grug.jar smoke

      - name: Upload the logs and the screen
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ matrix.recipe }}
          path: |
            smoke/launch.log
            smoke/title.png
            smoke/game/logs/
            smoke/game/crash-reports/
            smoke/game/ModLoader.txt
          if-no-files-found: warn
          retention-days: 7

  # Combines the exec data collected by the core and loader jobs and fails the build unless the
  # measured set is fully covered. Classes a headless CI cannot drive (mixins, loader startup,
  # render/resource glue, and the loader game-API guards that cannot be produced by a test) are
  # excluded in combine-coverage.py; everything that remains must be at 100%.
  coverage:
    name: coverage report
    # The test jobs produce what it reads, so it skips with them (#785): a diff of prose alone
    # cannot change coverage, and main's next full run restores the global guarantee.
    if: needs.discover.outputs.no-tests != 'true'
    # discover is a need because this job reads its carry-over: the two outputs are what names
    # the base run and the tests the loader jobs skipped (#786).
    needs: [discover, core, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Download the coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: coverage/artifacts

      # The jar the core job resolved, so this job never starts Gradle. It used to run a
      # ./gradlew -q :core:printJacocoCliPath of its own, which cost about 35 seconds of cold start
      # to print one path and made it the second slowest job in the workflow.
      - name: Download the JaCoCo CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jacoco-cli
          path: coverage/tools

      # The tool the core job built, which this job runs against the per-test exec data the
      # development loader jobs uploaded: it builds the map of what each coverage test of this
      # run covered, and on a pull request it reconstructs the carried-over coverage from the
      # base commit's map (#786).
      - name: Download the coverage map tool
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-map-tool
          path: coverage/tools

      # A pull request's carry-over is the base commit's recorded coverage, and a successful run
      # of the base commit on main is the run that built it: the discover job found that run
      # before any game started, or the carry-over is empty and this step does nothing. The map
      # is data from the base commit, which is why it is an artifact of that commit's run and
      # never a file of the pull request (#786).
      - name: Retrieve the base commit's coverage map
        if: ${{ needs.discover.outputs.carry-over != '' }}
        env:
          REPO: ${{ github.repository }}
          BASE_RUN: ${{ needs.discover.outputs.base-run }}
          # A step only sees the workflow's token when it passes it in: both curls below need it
          # to read another run's artifacts.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p coverage/base-map
          # The discover lookup already skipped an expired map: GitHub prunes an artifact whose
          # retention ended, and a listing caught mid-prune carries expired: true. This read
          # applies the same rule, and names the minutes-wide race when the map expires between
          # the two instead of dying on a bare StopIteration traceback.
          url=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/runs/$BASE_RUN/artifacts?per_page=100" \
            | python3 -c "import json, sys; print(next((a['archive_download_url'] for a in json.load(sys.stdin)['artifacts'] if a['name'] == 'coverage-map' and not a.get('expired', False)), ''))")
          if [ -z "$url" ]; then
            echo "::error::the coverage-map artifact of base run $BASE_RUN expired between the discover lookup and this step, so the carry-over fell back to nothing: the loader jobs already skipped the tests it names, and this step cannot rerun them, so the run fails instead of counting less coverage."
            exit 1
          fi
          curl -sfL -H "Authorization: Bearer $GITHUB_TOKEN" "$url" -o coverage/base-map.zip
          unzip -o -q coverage/base-map.zip -d coverage/base-map

      # The recorded coverage of the carried-over tests, one exec per test and loader, rebuilt
      # against this run's own core classes and each loader's own from the base commit's map. The
      # tool fails the run when a class the map names changed under it, or a test the selection
      # carried over is not in the map for a loader that ran, and both are the direction that runs
      # more: the loader jobs already skipped the tests, so a map that cannot be applied is a red
      # run, never a gate that counted less (#786). Its other-mod replay is the base run's dropped
      # data, which the gate reads only for the class initializers another mod's test made run, so
      # a pull request that runs no test at all still counts those (#897).
      - name: Reconstruct the carried-over coverage
        if: ${{ needs.discover.outputs.carry-over != '' }}
        env:
          # The selection's names come from a pull request's tree, so they never go into the
          # script itself: a name with a quote or a backtick would run as code.
          CARRY_OVER: ${{ needs.discover.outputs.carry-over }}
        run: |
          set -eu
          mkdir -p coverage/carry-over
          printf '%s\n' "$CARRY_OVER" | tr ',' '\n' > coverage/carry-over/tests.txt
          loader_args=()
          for dir in coverage/artifacts/coverage-exec-*; do
            [ -d "$dir" ] || continue
            loader=${dir##*coverage-exec-}
            [ "$loader" = core ] && continue
            loader_args+=(--loader "$loader" "coverage/artifacts/coverage-classes-$loader")
          done
          java -cp coverage/tools/coverage-map-tool.jar \
            net.grug.minecraft.covmap.CoverageMapTool reconstruct \
            --map coverage/base-map/coverage-map.json \
            --classes coverage/artifacts/coverage-classes-core \
            --tests coverage/carry-over/tests.txt \
            --out-dir coverage/carry-over \
            --other-mods-dir coverage/carry-over-dropped \
            "${loader_args[@]}"

      - name: Combine the coverage data and require 100%
        run: |
          set -eu
          carry=()
          # Name every exec the reconstruction was asked to write, not the ones a glob found, so a
          # carried-over test whose exec is missing still reaches combine-coverage.py, which logs it
          # and drops it from the count instead of failing. reconstruct writes one exec per test and
          # loader to coverage/carry-over/<loader>/<test path with dots>.exec, and it fails the step
          # when a test has no recorded coverage, so a missing file here is a defect worth a line.
          if [ -f coverage/carry-over/tests.txt ]; then
            while IFS= read -r test; do
              [ -n "$test" ] || continue
              for dir in coverage/carry-over/*/; do
                [ -d "$dir" ] || continue
                runner=$(basename "$dir")
                carry+=(--carry-over "$runner:$dir${test//\//.}.exec")
              done
            done < coverage/carry-over/tests.txt
          fi
          other_mods=()
          # reconstruct replays the base run's other-mod segments to coverage/carry-over-dropped,
          # one exec per loader, named for its runner. They are the dropped data of the carried
          # tests' base run: the gate counts the class initializers they made run and nothing else,
          # exactly as it counts the run's own dropped data (#897).
          for exec in coverage/carry-over-dropped/*.exec; do
            [ -e "$exec" ] || continue
            other_mods+=(--carry-over-dropped "$(basename "$exec" .exec):$exec")
          done
          python3 .github/scripts/combine-coverage.py \
            --artifacts coverage/artifacts \
            --jacoco-cli coverage/tools/jacoco-cli.jar \
            --output coverage/report \
            --require-100 \
            "${carry[@]}" \
            "${other_mods[@]}"

      # The map of what each coverage test of this run covered, from this run's own per-test exec
      # data against this run's own core classes and each loader's own: the pull requests that
      # base on this commit carry it over. A pull request builds it too, from the tests its
      # selection ran; the push to main that merges it rebuilds the map from the full run, which
      # is the one a later pull request looks up. Also when the gate above failed, because the
      # recorded coverage is still what the tests that ran covered, and the run a pull request
      # bases on is the next one, not this one (#786).
      - name: Build the coverage map
        if: ${{ !cancelled() }}
        run: |
          set -eu
          loader_args=()
          for dir in coverage/artifacts/coverage-exec-*; do
            [ -d "$dir" ] || continue
            loader=${dir##*coverage-exec-}
            [ "$loader" = core ] && continue
            classes="coverage/artifacts/coverage-classes-$loader"
            [ -d "$classes" ] || {
              echo "error: the run holds no class files for $loader to record the map against"
              exit 1
            }
            loader_args+=(--loader "$loader" "$classes" "$dir")
          done
          [ ${#loader_args[@]} -gt 0 ] || {
            echo "error: no loader exec data to record the map from"
            exit 1
          }
          java -cp coverage/tools/coverage-map-tool.jar \
            net.grug.minecraft.covmap.CoverageMapTool build \
            --classes coverage/artifacts/coverage-classes-core \
            --commit "$(git rev-parse HEAD)" \
            --out coverage/coverage-map.json \
            "${loader_args[@]}"

      # Refreshed on every merge, which the pull requests that base on the merge read back. The
      # retention is the same as the coverage data it is built from, so a base commit older than
      # that has no map, and the pull request that bases on it runs every coverage test.
      - name: Upload the coverage map
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-map
          path: coverage/coverage-map.json
          if-no-files-found: error
          retention-days: 7

      # Also when the 100% requirement above fails, because the per-line report is what says which
      # lines were missed.
      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/report
          retention-days: 7

  # The one check the ruleset requires of a pull request's Build (#638). The loader jobs are a
  # matrix whose members `discover` picks, so a loader a diff does not reach has no job and no
  # check under its name: requiring `1.20.6-forge` would leave such a pull request waiting forever.
  # This job has a fixed name, always runs on a pull request and fails when any job it needs failed
  # or was cancelled. A needed job that was skipped counts as passing, as GitHub's own required
  # checks do. Only the jobs that run on a pull request are needed; the ones that run on main, a
  # schedule or a dispatch never block a merge.
  pr-gate:
    name: pr gate
    if: always() && github.event_name == 'pull_request'
    needs: [discover, grug-rs, core, build, reference, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail when a needed job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          bad = {name: need["result"] for name, need in needs.items()
                 if need["result"] not in ("success", "skipped")}
          for name, need in sorted(needs.items()):
              print(f"{name}: {need['result']}")
          if bad:
              sys.exit(f"pr gate: not green: {bad}")
          PY
