name: Build

# Mirrors validate-about.yml's triggers, minus path filters: core/, mods/,
# mod_api.json, shared/**, and each loader's own sources all affect whether
# every loader still boots, so this always runs on the whole repo.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Emits one matrix entry per loaders/* directory. See
  # scripts/ci/discover-loaders.sh.
  discover:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Discover loaders
        id: discover
        run: scripts/ci/discover-loaders.sh

  build:
    name: ${{ matrix.dir }}
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Pinned to ubuntu-24.04 (not ubuntu-latest): a later goal compares
      # screenshots pixel-for-pixel, which needs a stable Mesa/font stack
      # across runs.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            tigervnc-standalone-server xdotool \
            mesa-utils libgl1-mesa-dri libglx-mesa0 \
            libxrandr2 libxxf86vm1 libxcursor1

      - name: Start X server
        run: |
          Xvnc :99 -geometry 1280x720 -depth 24 -SecurityTypes None &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"

      - name: Make gradlew scripts executable
        run: |
          chmod +x gradlew
          for f in loaders/*/gradlew; do
            [ -f "$f" ] && chmod +x "$f"
          done
          exit 0

      - name: Resolve dependencies (${{ matrix.dir }})
        run: scripts/ci/run-loader.sh "${{ matrix.dir }}" resolve

      - name: Build (${{ matrix.dir }})
        run: scripts/ci/run-loader.sh "${{ matrix.dir }}" build

      - name: Boot to title screen (${{ matrix.dir }})
        run: scripts/ci/run-loader.sh "${{ matrix.dir }}" run

      - name: Upload logs and crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loader-${{ matrix.dir }}-logs
          path: |
            loaders/${{ matrix.dir }}/run/logs
            loaders/${{ matrix.dir }}/run/crash-reports
            loaders/${{ matrix.dir }}/run/ci-run-loader.log
            loaders/${{ matrix.dir }}/run/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7

  # TODO: Remove this debug job
  lwjgl2-mre:
    name: "MRE: LWJGL 2 Display Test"
    runs-on: ubuntu-24.04
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Comprehensive X11 & Server Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xserver-xorg-video-dummy xvfb tigervnc-standalone-server \
            mesa-utils libgl1-mesa-dri libglx-mesa0 \
            libx11-6 libxext6 libxcursor1 libxrandr2 libxxf86vm1 libxinerama1 libxrender1

      - name: Download Raw LWJGL 2
        run: |
          wget -q https://repo1.maven.org/maven2/org/lwjgl/lwjgl/lwjgl/2.9.3/lwjgl-2.9.3.jar
          wget -q https://repo1.maven.org/maven2/org/lwjgl/lwjgl/lwjgl-platform/2.9.3/lwjgl-platform-2.9.3-natives-linux.jar
          unzip -q lwjgl-platform-2.9.3-natives-linux.jar -d natives

      - name: Compile Test Program
        run: |
          cat << 'EOF' > LwjglTest.java
          import org.lwjgl.opengl.Display;
          import org.lwjgl.opengl.DisplayMode;
          public class LwjglTest {
              public static void main(String[] args) {
                  try {
                      System.out.println("--> Querying modes...");
                      DisplayMode[] modes = Display.getAvailableDisplayModes();
                      System.out.println("--> Found " + modes.length + " modes.");
                      Display.setDisplayMode(new DisplayMode(800, 600));
                      Display.create();
                      System.out.println("--> SUCCESS: Display created!");
                      Display.destroy();
                      System.exit(0);
                  } catch (Exception e) {
                      e.printStackTrace();
                      System.exit(1);
                  }
              }
          }
          EOF
          javac -cp lwjgl-2.9.3.jar LwjglTest.java

      - name: Test 1 - Xvfb
        continue-on-error: true
        run: |
          Xvfb :99 -screen 0 1280x720x24 +extension RANDR +extension GLX &
          sleep 2
          DISPLAY=:99 java -cp .:lwjgl-2.9.3.jar -Djava.library.path=natives LwjglTest
          pkill Xvfb

      - name: Test 2 - Xvnc
        continue-on-error: true
        run: |
          Xvnc :98 -geometry 1280x720 -depth 24 -SecurityTypes None +extension RANDR &
          sleep 2
          DISPLAY=:98 java -cp .:lwjgl-2.9.3.jar -Djava.library.path=natives LwjglTest
          pkill Xvnc

      - name: Test 3 - Xdummy
        continue-on-error: true
        run: |
          cat << 'EOF' > dummy.xorg.conf
          Section "Device"
              Identifier "DummyDevice"
              Driver "dummy"
              VideoRam 256000
          EndSection
          Section "Monitor"
              Identifier "DummyMonitor"
              HorizSync 31.5-48.5
              VertRefresh 50-70
          EndSection
          Section "Screen"
              Identifier "DummyScreen"
              Device "DummyDevice"
              Monitor "DummyMonitor"
              DefaultDepth 24
              SubSection "Display"
                  Depth 24
                  Modes "1280x720"
              EndSubSection
          EndSection
          EOF
          sudo Xorg -noreset +extension GLX +extension RANDR +extension RENDER -logfile ./xorg.log -config ./dummy.xorg.conf :97 &
          sleep 2
          DISPLAY=:97 java -cp .:lwjgl-2.9.3.jar -Djava.library.path=natives LwjglTest
          sudo pkill Xorg
