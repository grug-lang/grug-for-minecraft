name: Regenerate Goldens

# The second tier. Verifying a port runs on every push and needs only the port and the committed
# goldens, so it can never be broken by losing the reference. This job is the only one that needs
# the reference artifacts, and it is manual and best-effort on purpose: if the artifacts disappear,
# verifying the port still works and only regenerating the goldens is degraded.
#
# This job fetches and hash-verifies the artifacts and prints what installing and running the
# reference involves. Actually launching the reference runtime and committing the captures is the
# next step; see the recreation section of the README for what it still needs.

on:
  workflow_dispatch:
    inputs:
      mod:
        description: Mod directory under mods/ whose recreation block to use.
        required: true
        default: buildcraft

permissions:
  contents: read

jobs:
  artifact:
    name: Fetch and verify the reference artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Show what the reference run involves
        run: python3 recreation.py plan "mods/${{ inputs.mod }}/about.json"

      # The pin is the hash, so a moved url or a mirror is fine and a changed byte is not.
      - name: Download and verify the artifacts by hash
        run: |
          python3 recreation.py verify "mods/${{ inputs.mod }}/about.json" \
            --output reference-artifacts

      # The install layout a reference run wants, so a maintainer can download it and launch the
      # reference by hand while the automated launch is still open.
      - name: Stage the install layout
        run: |
          python3 recreation.py stage "mods/${{ inputs.mod }}/about.json" \
            --artifacts reference-artifacts \
            --destination reference-staged

      - name: Upload the verified artifacts and their staged layout
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reference-${{ inputs.mod }}
          path: |
            reference-artifacts
            reference-staged
          if-no-files-found: error
          retention-days: 7
