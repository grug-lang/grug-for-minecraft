// Attaches the JaCoCo agent to this loader's runClient task, so that a game run records coverage to
// <loader>/build/jacoco/*.exec for CI to merge into the coverage badges.
//
// Applied by every loader's build (the loaders' runClient tasks all extend JavaExec): the built-in
// Loom RunGameTask and ForgeGradle MinecraftRunTask both do. Instrumentation is limited to this
// project's classes, since instrumenting all of Minecraft would produce a huge exec for no benefit.
//
// The agent is attached in doFirst so that resolving grugJacocoAgent doesn't happen at configuration
// time, and only when GRUG_CI is set, so a plain local runClient stays uninstrumented.
//
// The agent writes nothing itself (output=none): run-loader.sh terminates the game as soon as the
// tests pass, which can interrupt a shutdown-hook write. Instead GrugCoverage cuts the data into
// segments from inside the game and writes the ones the coverage gate counts, the boot and the
// tests of mods/coverage/, as one NNN-<segment>.exec file each in grug.coverage.dir (#626).
apply plugin: 'jacoco'

repositories {
    mavenCentral()
}

// configurations.jacocoAgent resolves the unshaded artifact, which is not a valid -javaagent jar
// (it has no Premain-Class), so resolve the runtime classifier explicitly.
configurations {
    grugJacocoAgent
}

dependencies {
    grugJacocoAgent "org.jacoco:org.jacoco.agent:${jacoco.toolVersion}:runtime"
}

def grugJacocoExecDir = layout.buildDirectory.dir('jacoco')

tasks.withType(JavaExec).matching { it.name == 'runClient' }.configureEach {
    doFirst {
        if (System.getenv('GRUG_CI') != 'true') {
            return
        }
        def agent = configurations.grugJacocoAgent.singleFile
        def execDir = grugJacocoExecDir.get().asFile
        // Start clean, so a segment of an earlier run cannot be combined with this one's.
        project.delete(execDir)
        jvmArgs "-Dgrug.coverage.dir=${execDir.absolutePath}"
        jvmArgs "-javaagent:${agent}=output=none,dumponexit=false," +
            "includes=net.grug.*:net.minecraft.crafting.*"
    }
}
