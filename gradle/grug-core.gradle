import java.io.IOException
import java.util.Properties

// The hand-off between `core` and the four loaders that run a Gradle wrapper of their own.
//
// The root build is on Gradle 8.14 and those loaders are on 9.5.1, which is why they cannot be one
// composite build: `core` publishes itself and the loaders resolve it instead. Both halves read the
// coordinate from here, so a loader cannot ask for a version `core` does not publish.
//
// The repository is inside the checkout rather than in the user's ~/.m2, so a worktree publishes
// into a directory of its own and a loader beside it can only ever resolve that one. Nothing needs
// locking, naming or cleaning up, because there is no longer a single global slot to race over.
//
// The version carries the commit because this checkout's own build/maven accumulates. A fixed 1.0.0
// stays in it from an earlier commit, so a loader building before the root build has published the
// commit it is on would resolve that commit's core and compile quietly against it. A coordinate that
// moves is one this tree has not published, and the resolution fails naming it.
//
// Freshness inside a commit is the repository's doing, not the stamp's: Gradle reads a local
// repository's modules on every build instead of serving them out of ~/.gradle, so a republish under
// the coordinate the loader does ask for is a file it reads again.
// .github/scripts/grug_core_handoff_test.py holds all three of those claims to it.

// core/ is a project of the root build, whose own directory is the repository root, while a loader
// is the root project of a build of its own and sits two directories below it.
def repoRoot = project == project.rootProject
    ? project.projectDir.parentFile.parentFile
    : project.rootProject.projectDir

// Where `core` publishes and where every loader resolves it from. build/ is per worktree, so the
// directory under it is too.
ext.grugCoreRepository = new File(new File(repoRoot, 'build'), 'maven')

// The base version is read out of the root gradle.properties rather than kept in a property each
// loader has its own copy of, so there is one place to change it.
def rootPropertiesFile = new File(repoRoot, 'gradle.properties')
if (!rootPropertiesFile.isFile()) {
    throw new GradleException(
        "${repoRoot.absolutePath} is not the grug-for-minecraft checkout: it holds no " +
            'gradle.properties to read the version out of.'
    )
}
def rootProperties = new Properties()
rootPropertiesFile.withInputStream { rootProperties.load(it) }

// Properties answers null for a key that is not there, and the interpolation below would fold that
// into a coordinate reading null-<commit>, which core would then publish under and every loader
// would agree on. Two halves agreeing is not a check, so this asks for the key instead. The base
// version used to be read through providers.gradleProperty(...).get(), which throws when it is
// absent, and this keeps the build stopping at configuration time when it is renamed away.
def baseVersion = rootProperties.getProperty('mod_version')
if (baseVersion == null) {
    throw new GradleException(
        "${rootPropertiesFile.absolutePath} declares no mod_version, which the version grug-core is " +
            'published under is built from.'
    )
}

// git is what reads the commit. Every build that compiles core already needed it, because
// buildGrugRs clones grug-rs with git, but a loader's own build did not need a checkout before this
// file and does now. That is the price of the two halves agreeing on the coordinate by reading it in
// one place, and a tree that is not a checkout has no commit to stamp with, which is an err below
// rather than a version without one.
def commitProcess
try {
    commitProcess = new ProcessBuilder(
        'git', '-C', repoRoot.absolutePath, 'rev-parse', '--short=12', 'HEAD'
    )
        .redirectErrorStream(true)
        .start()
} catch (IOException e) {
    // start() throws before any of this file's own reporting can run, so the missing binary is
    // reported here rather than as a raw "Cannot run program git" from the JDK.
    throw new GradleException(
        "Could not run git to read the commit in ${repoRoot.absolutePath}, which the version " +
            "grug-core is published under is stamped with. ${e.message}",
        e
    )
}

// Read before waiting, so a full pipe cannot deadlock on a message longer than the buffer.
def commitOutput = commitProcess.inputStream.getText('UTF-8').trim()
if (commitProcess.waitFor() != 0) {
    throw new GradleException(
        "Could not read the commit in ${repoRoot.absolutePath}, which grug-core's published " +
            "version is stamped with. core is built out of a git checkout, because the build clones " +
            "grug-rs with git. git said: ${commitOutput}"
    )
}

// The commit alone does not say what was published: a tree with uncommitted edits publishes those
// edits under the commit's own coordinate, and build/maven keeps the last publish there. A clean
// resolve of that commit is then handed the dirty jar while the tree says otherwise. That is an
// ordinary loop rather than an exotic one, because `git stash` and a rebase both visit one commit
// twice with different states. A `-dirty` suffix gives a dirty publish a coordinate of its own, so it
// cannot take the one a clean tree asks for.
//
// The status is scoped to the paths that feed the jar, so an edit to a loader, to this file or to a
// workflow does not mint a new coordinate for nothing. `core/src` is the whole source tree rather
// than only its main half, so a test-only edit is reported too, which is the safe way to be wrong.
// An ignored file under the scope is not reported, because .gitignore decides that rather than git.
def dirtyProcess
try {
    dirtyProcess = new ProcessBuilder(
        'git', '-C', repoRoot.absolutePath, 'status', '--porcelain', '--',
        'mod_api.json', 'core/src', 'core/generate.py', 'mods'
    )
        .redirectErrorStream(true)
        .start()
} catch (IOException e) {
    throw new GradleException(
        "Could not run git to read the working tree state in ${repoRoot.absolutePath}, which " +
            "grug-core's published version is stamped with. ${e.message}",
        e
    )
}

// Read before waiting, so a full pipe cannot deadlock on a message longer than the buffer.
def dirtyOutput = dirtyProcess.inputStream.getText('UTF-8').trim()
if (dirtyProcess.waitFor() != 0) {
    throw new GradleException(
        "Could not read the working tree state in ${repoRoot.absolutePath}, which grug-core's " +
            "published version is stamped with. git said: ${dirtyOutput}"
    )
}

// toString(), so the loaders whose builds are written in Kotlin get a String rather than the GString
// this interpolation produces in a Groovy script.
ext.grugCoreVersion = dirtyOutput.isEmpty()
    ? "${baseVersion}-${commitOutput}".toString()
    : "${baseVersion}-${commitOutput}-dirty".toString()
