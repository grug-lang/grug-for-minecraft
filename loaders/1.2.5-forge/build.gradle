// Build for the 1.2.5 Forge (Tekkit Classic) grug loader.
//
// Forge 1.2.5 predates ForgeGradle and Loom, so the build is a plain Java one that talks to a
// pinned MCP snapshot directly:
//
//   1. fetch the MCP snapshot (mcp125);
//   2. invert its client.srg plus fields/methods.csv into a dev -> notch srg (tools/invert_srg.py);
//   3. compile GenerateVanillaNames against the MCP dev classes and run it to produce the
//      resource-name table the obfuscated runtime reads back (vanilla_names.txt);
//   4. compile the loader to Java 8 bytecode against the MCP dev classes;
//   5. fix inherited member references (tools/FixInherited.java) and reobfuscate with SpecialSource;
//   6. for runClient, reobfuscate the MCP dev classes into a pack-style runtime jar and launch the
//      game with Java 8 under the freshly built loader jar, with the JaCoCo agent on its command
//      line in CI and the reobfuscated classes staged for the coverage report.
//
// An existing snapshot checkout can be reused with -Pgrug.mcpSnapshot=/path/to/mcp125 (used for
// local iteration so the 170 MB tree is not cloned every time).
//
// The snapshot is cloned beside build/ and not into it: CI restores this build directory from the
// loader's build-state cache entry, which would then store the snapshot a second time beside its own
// entry (#736).

import java.io.ByteArrayOutputStream

plugins {
    id 'base'
    id 'java'
    // The coverage agent's version, so it stays the one every other loader's runClient uses.
    id 'jacoco'
}

// The hand-off from core: the repository this resolves it from and the version it asks for both come
// from gradle/grug-core.gradle, which core publishes under too.
apply from: '../../gradle/grug-core.gradle'

group = 'net.grug'
version = grugVersion

def projectDirFile = project.projectDir
def repoRoot = projectDirFile.parentFile.parentFile
def buildDirFile = layout.buildDirectory.get().asFile
def toolsDir = new File(projectDirFile, 'tools')

def generatedResourcesDir = new File(buildDirFile, 'generated/resources')
def generatedSourcesDir = new File(buildDirFile, 'generated/sources/grugVersion')
def genToolClasses = new File(buildDirFile, 'tools/vanilla-names')
def fixToolClasses = new File(buildDirFile, 'tools/fixinherited')
def fogToolClasses = new File(buildDirFile, 'tools/disable-fog')
def skipFrameToolClasses = new File(buildDirFile, 'tools/skip-frame')
def guiInputToolClasses = new File(buildDirFile, 'tools/gui-input')
def gameDirToolClasses = new File(buildDirFile, 'tools/game-dir')
def reobfSrgFile = new File(buildDirFile, 'reobf.srg')
def devJar = new File(buildDirFile, 'libs/grug-1.2.5-forge-dev.jar')
def fixedJar = new File(buildDirFile, 'grug-1.2.5-forge-fixed.jar')
def finalJar = new File(buildDirFile, 'grug-1.2.5-forge.jar')
def runtimeDevJar = new File(buildDirFile, 'grug-1.2.5-forge-runtime-dev.jar')
def runtimeFogJar = new File(buildDirFile, 'grug-1.2.5-forge-runtime-fog.jar')
def runtimeSkipFrameJar = new File(buildDirFile, 'grug-1.2.5-forge-runtime-skip-frame.jar')
def runtimeGuiInputJar = new File(buildDirFile, 'grug-1.2.5-forge-runtime-gui-input.jar')
def runtimeGameDirJar = new File(buildDirFile, 'grug-1.2.5-forge-runtime-game-dir.jar')
def runtimeJar = new File(buildDirFile, 'grug-1.2.5-forge-runtime.jar')
def nativesDir = new File(buildDirFile, 'natives')
def windows = System.getProperty('os.name').startsWith('Windows')
// On a Windows runner python3 can be a Microsoft Store stub that runs nothing.
def pythonCommand = windows ? 'python' : 'python3'

def runDir = new File(projectDirFile, 'run')
def modsDir = new File(repoRoot, 'mods')

def mcpProperty = findProperty('grug.mcpSnapshot')
def mcpDir = mcpProperty ? file(mcpProperty) : new File(projectDirFile, 'mcp125')
def mcpBin = new File(mcpDir, 'bin/minecraft')
def mcpResources = new File(mcpDir, 'src/minecraft')
def mcpMinecraftJar = new File(mcpDir, 'jars/bin/minecraft.jar')

def MCP_REPO = 'https://github.com/pablo67340/Working-Minecraft-1.2.5-MCP-with-Forge.git'
def MCP_COMMIT = 'b598d55f8a1e0e9cbda27517cfaa6d4a3224b202'

repositories {
    // grug-core is published into this repository by the root build before this one runs.
    // The only place net.grug is looked up: without this Gradle asks every other repository for
    // grug-core too, and a rate limit from one of them (#433) fails a build that has the jar.
    exclusiveContent {
        forRepository {
            maven {
                name = 'grugBuild'
                url = grugCoreRepository.toURI()
            }
        }
        filter {
            includeGroup 'net.grug'
        }
    }
    mavenCentral()
    // launchwrapper 1.5 is not on Maven Central.
    maven { url = 'https://libraries.minecraft.net' }
}

configurations {
    // Compile/run classpath for the vanilla-name generator (the MCP dev classes reference these).
    genTool
    // ASM used by tools/FixInherited.java.
    fixInheritedTool
    // ASM used by tools/DisableFog.java.
    fogPatchTool
    // The shaded SpecialSource jar (reobfuscation). Shaded, so no transitive deps.
    specialSourceTool {
        transitive = false
    }
    // The libraries a 1.2.5 instance itself puts on the classpath, which is all runProduction has.
    gameLibs
    // Pack-style runtime libraries for launching the game: the game's own, plus what runClient
    // provides the loader jar with instead of it carrying them.
    runtimeLibs {
        extendsFrom gameLibs
    }
    // LWJGL 2 / JInput Linux natives for -Djava.library.path.
    natives
    // The JaCoCo agent the game JVM starts with in CI. configurations.jacocoAgent resolves the
    // unshaded artifact, which is not a valid -javaagent jar (it has no Premain-Class), so
    // gradle/jacoco-loader.gradle resolves the runtime classifier explicitly and so does this.
    grugJacocoAgent
}

dependencies {
    // The loader compiles against the MCP-named, Forge-patched dev classes.
    compileOnly files(mcpBin)
    compileOnly 'org.lwjgl.lwjgl:lwjgl:2.9.3'
    compileOnly 'org.lwjgl.lwjgl:lwjgl_util:2.9.3'
    compileOnly 'net.java.jinput:jinput:2.0.10'

    implementation "net.grug:grug-core:$grugCoreVersion"
    implementation 'com.google.guava:guava:33.2.1-jre'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'org.jetbrains:annotations:26.1.0'

    // The saved-data packet's direction is a rule of the game's own packet table, which exists only
    // with the game classes loaded, so a unit test against the MCP dev classes pins it (#1097).
    // JUnit 5 is the line that still runs on Java 8, which is what this loader compiles to.
    testImplementation files(mcpBin)
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'

    genTool files(mcpBin, mcpMinecraftJar)
    genTool 'org.lwjgl.lwjgl:lwjgl:2.9.3'
    genTool 'org.lwjgl.lwjgl:lwjgl_util:2.9.3'
    genTool 'net.java.jinput:jinput:2.0.10'
    genTool 'com.google.guava:guava:33.2.1-jre'
    genTool 'com.google.code.gson:gson:2.14.0'
    genTool 'org.jetbrains:annotations:26.1.0'

    fixInheritedTool 'org.ow2.asm:asm:9.10.1'
    fixInheritedTool 'org.ow2.asm:asm-tree:9.10.1'

    fogPatchTool 'org.ow2.asm:asm:9.10.1'
    fogPatchTool 'org.ow2.asm:asm-tree:9.10.1'

    specialSourceTool 'net.md-5:SpecialSource:1.11.4:shaded'

    gameLibs 'net.minecraft:launchwrapper:1.5'
    gameLibs 'org.ow2.asm:asm-all:5.2'
    gameLibs 'net.sf.jopt-simple:jopt-simple:5.0.4'
    gameLibs 'net.java.jinput:jinput:2.0.10'
    gameLibs 'org.lwjgl.lwjgl:lwjgl:2.9.3'
    gameLibs 'org.lwjgl.lwjgl:lwjgl_util:2.9.3'
    runtimeLibs "net.grug:grug-core:$grugCoreVersion"
    runtimeLibs 'com.google.guava:guava:33.2.1-jre'
    runtimeLibs 'com.google.code.gson:gson:2.14.0'
    runtimeLibs 'org.jetbrains:annotations:26.1.0'

    natives "org.lwjgl.lwjgl:lwjgl-platform:2.9.3:natives-${windows ? 'windows' : 'linux'}"

    natives 'net.java.jinput:jinput:2.0.10:natives-all'

    grugJacocoAgent "org.jacoco:org.jacoco.agent:${jacoco.toolVersion}:runtime"
}

sourceSets {
    main {
        java {
            // Generated by generateGrugVersion, so mod_Grug reports the repository version.
            srcDir generatedSourcesDir
        }
        resources {
            // Generated by generateVanillaNames, so it lands in the loader jar.
            srcDir generatedResourcesDir
        }
    }
}

// -- Step 1: the MCP snapshot ------------------------------------------------------------------

tasks.register('fetchMcpSnapshot', Exec) {
    description = 'Clones the pinned 1.2.5 MCP snapshot with Forge into mcp125.'
    outputs.dir mcpDir
    onlyIf {
        !(new File(mcpDir, '.git').isDirectory() && new File(mcpDir, 'conf/client.srg').isFile())
    }
    doFirst {
        mcpDir.mkdirs()
        workingDir = mcpDir
        commandLine 'sh', '-c',
            "set -e; git init -q; git remote add origin '${MCP_REPO}'; " +
            "git fetch -q --depth 1 origin '${MCP_COMMIT}'; git checkout -q FETCH_HEAD"
    }
}

// -- Step 2: the dev -> notch reobfuscation srg -------------------------------------------------

tasks.register('reobfSrg', Exec) {
    description = 'Builds the dev -> notch srg from the MCP client mapping.'
    dependsOn 'fetchMcpSnapshot'
    inputs.file new File(mcpDir, 'conf/client.srg')
    inputs.file new File(mcpDir, 'conf/fields.csv')
    inputs.file new File(mcpDir, 'conf/methods.csv')
    outputs.file reobfSrgFile
    doFirst {
        reobfSrgFile.parentFile.mkdirs()
        commandLine pythonCommand, new File(toolsDir, 'invert_srg.py').absolutePath,
            new File(mcpDir, 'conf/client.srg').absolutePath,
            new File(mcpDir, 'conf/fields.csv').absolutePath,
            new File(mcpDir, 'conf/methods.csv').absolutePath,
            reobfSrgFile.absolutePath
    }
}

// -- Step 3: the vanilla name table -------------------------------------------------------------

tasks.register('compileVanillaNamesTool', JavaCompile) {
    description = 'Compiles GenerateVanillaNames against the MCP dev classes.'
    dependsOn 'fetchMcpSnapshot'
    source = fileTree(toolsDir) { include 'GenerateVanillaNames.java' }
    classpath = configurations.genTool
    destinationDirectory.set(genToolClasses)
    options.release = 8
    options.encoding = 'UTF-8'
}

tasks.register('generateVanillaNames', JavaExec) {
    description = 'Runs GenerateVanillaNames to produce vanilla_names.txt as a resource.'
    dependsOn 'compileVanillaNamesTool'
    outputs.file new File(generatedResourcesDir, 'vanilla_names.txt')
    classpath = files(genToolClasses) + configurations.genTool
    mainClass.set('GenerateVanillaNames')
    def buffer = new ByteArrayOutputStream()
    doFirst {
        generatedResourcesDir.mkdirs()
        standardOutput = buffer
        errorOutput = System.err
    }
    doLast {
        new File(generatedResourcesDir, 'vanilla_names.txt')
            .setText(buffer.toString('UTF-8'), 'UTF-8')
    }
}

// ModLoader asks the mod for its version rather than reading metadata, so the repository version
// reaches it as a constant generated from grugVersion, never one the loader declares itself (#502).
tasks.register('generateGrugVersion') {
    description = 'Writes GrugVersion.java, which holds the repository version.'
    def version = grugVersion
    def source = new File(generatedSourcesDir, 'net/grug/minecraft/forge125/GrugVersion.java')
    inputs.property 'version', version
    outputs.file source
    doLast {
        source.parentFile.mkdirs()
        source.setText(
            "package net.grug.minecraft.forge125;\n\n"
                + "/** Generated by generateGrugVersion in build.gradle. */\n"
                + "final class GrugVersion {\n"
                + "    static final String VERSION = \"${version}\";\n\n"
                + "    private GrugVersion() {}\n"
                + "}\n",
            'UTF-8')
    }
}

// -- Steps 4 and 5: compile and reobfuscate the loader ------------------------------------------

tasks.named('compileJava', JavaCompile) {
    dependsOn 'fetchMcpSnapshot', 'generateGrugVersion'
    options.release = 8
    options.encoding = 'UTF-8'
}

// The test source set runs the game's packet table against the MCP dev classes, so it needs the
// snapshot and compiles to the same Java 8 bytecode as the loader.
tasks.named('compileTestJava', JavaCompile) {
    dependsOn 'fetchMcpSnapshot'
    options.release = 8
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

// CI compiles from a fresh checkout, so incremental compilation has no previous output to be
// incremental against and still snapshots its whole compile classpath, the MCP dev classes most of
// all. A local build keeps it, where the previous output is still there. See #702. This covers the
// two tool compiles as well, which run only once per build either way.
tasks.withType(JavaCompile).configureEach {
    if (System.getenv('GRUG_CI') == 'true') {
        options.incremental = false
    }
}

tasks.named('processResources') {
    dependsOn 'generateVanillaNames'
}

tasks.named('jar', Jar) {
    archiveFileName = 'grug-1.2.5-forge-dev.jar'
}

tasks.register('compileFixInheritedTool', JavaCompile) {
    description = 'Compiles tools/FixInherited.java.'
    source = fileTree(toolsDir) { include 'FixInherited.java' }
    classpath = configurations.fixInheritedTool
    destinationDirectory.set(fixToolClasses)
    options.release = 8
    options.encoding = 'UTF-8'
}

tasks.register('compileDisableFogTool', JavaCompile) {
    description = 'Compiles tools/DisableFog.java.'
    source = fileTree(toolsDir) { include 'DisableFog.java' }
    classpath = configurations.fogPatchTool
    destinationDirectory.set(fogToolClasses)
    options.release = 8
    options.encoding = 'UTF-8'
}

tasks.register('compileSkipFrameTool', JavaCompile) {
    description = 'Compiles tools/SkipFrame.java.'
    source = fileTree(toolsDir) { include 'SkipFrame.java' }
    classpath = configurations.fogPatchTool
    destinationDirectory.set(skipFrameToolClasses)
    options.release = 8
    options.encoding = 'UTF-8'
}

tasks.register('compilePatchGuiInputTool', JavaCompile) {
    description = 'Compiles tools/PatchGuiInput.java.'
    source = fileTree(toolsDir) { include 'PatchGuiInput.java' }
    classpath = configurations.fogPatchTool
    destinationDirectory.set(guiInputToolClasses)
    options.release = 8
    options.encoding = 'UTF-8'
}

tasks.register('compileGameDirTool', JavaCompile) {
    description = 'Compiles tools/GameDir.java.'
    source = fileTree(toolsDir) { include 'GameDir.java' }
    classpath = configurations.fogPatchTool
    destinationDirectory.set(gameDirToolClasses)
    options.release = 8
    options.encoding = 'UTF-8'
}

tasks.register('fixInheritedJar', JavaExec) {
    description = 'Rewrites inherited member references before reobfuscation.'
    dependsOn tasks.named('jar'), 'compileFixInheritedTool', 'reobfSrg'
    inputs.file devJar
    outputs.file fixedJar
    classpath = files(fixToolClasses) + configurations.fixInheritedTool
    mainClass.set('FixInherited')
    doFirst {
        fixedJar.parentFile.mkdirs()
        args = [devJar.absolutePath, mcpBin.absolutePath, reobfSrgFile.absolutePath, fixedJar.absolutePath]
    }
}

tasks.register('reobfJar', Exec) {
    description = 'Reobfuscates the loader with SpecialSource.'
    dependsOn 'fixInheritedJar'
    inputs.file fixedJar
    inputs.file reobfSrgFile
    outputs.file finalJar
    doFirst {
        finalJar.parentFile.mkdirs()
        commandLine 'java', '-jar', configurations.specialSourceTool.singleFile.absolutePath,
            '--in-jar', fixedJar.absolutePath,
            '--out-jar', finalJar.absolutePath,
            '--srg-in', reobfSrgFile.absolutePath
    }
}

// This loader's layer of the universal jar, which sits at its root: ModLoader loads mod_ classes
// from the root of a jar in mods/ and has no dependency mechanism, and the universal jar's root
// already holds core, gson (relocated, since 1.2.5 ships none), the native, mod_api.json and the
// bundled mods. Copied to build/layer/ so every loader's layer is found at the same path.
tasks.register('layerJar', Copy) {
    dependsOn 'reobfJar'
    from finalJar
    into new File(buildDirFile, 'layer')
}

tasks.named('assemble') {
    dependsOn 'reobfJar'
}

// -- Step 6: the pack-style run -----------------------------------------------------------------

tasks.register('runtimeDevJar', Jar) {
    description = 'Packs the MCP dev classes into the pre-reobfuscation runtime jar.'
    dependsOn 'fetchMcpSnapshot'
    archiveFileName = runtimeDevJar.name
    destinationDirectory.set(buildDirFile)
    from(mcpBin) {
        // Left over from the original obfuscated jar; the working pack runtime omits it.
        exclude 'gk.class'
    }
}

tasks.register('patchRuntimeFog', JavaExec) {
    description = 'Rewrites EntityRenderer.setupFog to honor the grug.disable.fog property.'
    dependsOn 'runtimeDevJar', 'compileDisableFogTool'
    inputs.file runtimeDevJar
    outputs.file runtimeFogJar
    classpath = files(fogToolClasses) + configurations.fogPatchTool
    mainClass.set('DisableFog')
    doFirst {
        runtimeFogJar.parentFile.mkdirs()
        args = [runtimeDevJar.absolutePath, runtimeFogJar.absolutePath]
    }
}

tasks.register('patchRuntimeSkipFrame', JavaExec) {
    description = 'Rewrites EntityRenderer.updateCameraAndRender to honor the grug.skip.frame property.'
    dependsOn 'patchRuntimeFog', 'compileSkipFrameTool'
    inputs.file runtimeFogJar
    outputs.file runtimeSkipFrameJar
    classpath = files(skipFrameToolClasses) + configurations.fogPatchTool
    mainClass.set('SkipFrame')
    doFirst {
        runtimeSkipFrameJar.parentFile.mkdirs()
        args = [runtimeFogJar.absolutePath, runtimeSkipFrameJar.absolutePath]
    }
}

tasks.register('patchRuntimeGuiInput', JavaExec) {
    description = 'Rewrites GuiScreen and Minecraft.displayGuiScreen to call the overlay hooks.'
    dependsOn 'patchRuntimeSkipFrame', 'compilePatchGuiInputTool'
    inputs.file runtimeSkipFrameJar
    outputs.file runtimeGuiInputJar
    classpath = files(guiInputToolClasses) + configurations.fogPatchTool
    mainClass.set('PatchGuiInput')
    doFirst {
        runtimeGuiInputJar.parentFile.mkdirs()
        args = [runtimeSkipFrameJar.absolutePath, runtimeGuiInputJar.absolutePath]
    }
}

// launchwrapper 1.5 stores --gameDir in Minecraft's static directory field only in main's
// epilogue, after the game thread has already read it, so which directory the client resolves is
// a race (#1184). This patch lets the launch command's own property answer that read first; see
// tools/GameDir.java for the failed boot job that lost the race.
tasks.register('patchRuntimeGameDir', JavaExec) {
    description = 'Rewrites Minecraft.getMinecraftDir to answer the launch command game directory.'
    dependsOn 'patchRuntimeGuiInput', 'compileGameDirTool'
    inputs.file runtimeGuiInputJar
    outputs.file runtimeGameDirJar
    classpath = files(gameDirToolClasses) + configurations.fogPatchTool
    mainClass.set('GameDir')
    doFirst {
        runtimeGameDirJar.parentFile.mkdirs()
        args = [runtimeGuiInputJar.absolutePath, runtimeGameDirJar.absolutePath]
    }
}

tasks.register('obfuscateRuntime', Exec) {
    description = 'Reobfuscates the MCP dev classes into the pack-style runtime jar.'
    dependsOn 'patchRuntimeGameDir', 'reobfSrg'
    inputs.file runtimeGameDirJar
    inputs.file reobfSrgFile
    outputs.file runtimeJar
    doFirst {
        runtimeJar.parentFile.mkdirs()
        commandLine 'java', '-jar', configurations.specialSourceTool.singleFile.absolutePath,
            '--in-jar', runtimeGameDirJar.absolutePath,
            '--out-jar', runtimeJar.absolutePath,
            '--srg-in', reobfSrgFile.absolutePath
    }
}

tasks.register('extractNatives') {
    description = 'Extracts the LWJGL 2 / JInput natives of the running OS for -Djava.library.path.'
    outputs.dir nativesDir
    doLast {
        delete nativesDir
        nativesDir.mkdirs()
        configurations.natives.files.each { jar ->
            copy {
                from zipTree(jar)
                into nativesDir
                duplicatesStrategy = DuplicatesStrategy.EXCLUDE
            }
        }
    }
}

tasks.register('prepareRunDir') {
    description = 'Stages the freshly built loader jar into run/.'
    dependsOn 'reobfJar'
    outputs.upToDateWhen { false }
    doLast {
        // Deliberately leaves run/saves alone. run-loader.sh replaces it with a fresh copy of the
        // test save before a CI launch, which is where that reset has to happen; a manual
        // runClient keeps whatever the player built, the same as every other loader.
        def runModsDir = new File(runDir, 'mods')
        delete runModsDir
        runModsDir.mkdirs()
        copy {
            from finalJar
            into runModsDir
        }
        // A reference run stages the real mod's jars separately, because this task owns run/mods
        // and deletes it every launch. GRUG_REFERENCE_MODS_DIR is that staged directory.
        def referenceMods = System.getenv('GRUG_REFERENCE_MODS_DIR')
        if (referenceMods != null && !referenceMods.isEmpty()) {
            copy {
                from new File(referenceMods)
                into runModsDir
            }
        }
        new File(runDir, 'assets').mkdirs()
    }
}

// The classes the coverage gate reports on must be the bytes the agent instrumented, because JaCoCo
// identifies a class by its bytes. This loader is reobfuscated before it runs (reobfJar rewrites
// every reference to a Minecraft class), so build/classes/java/main is not what ran: the same class
// has different bytes there. Stage the jar's entries, which are exactly what prepareRunDir put in
// run/mods, at the path build.yml uploads for every loader.
tasks.register('coverageClasses', Sync) {
    description = 'Stages the reobfuscated classes the coverage report is built from.'
    dependsOn 'reobfJar'
    from zipTree(finalJar)
    include '**/*.class'
    into new File(buildDirFile, 'coverage-classes')
}

// Resolve the Java 8 the game must run on. The build/Gradle JVM stays modern; only the game JVM
// here has to be 8. CI installs a JDK 8 alongside the build JDK and points GRUG_JAVA8 at it.
def findJava8 = {
    def candidates = []
    def prop = findProperty('grug.java8')
    if (prop) candidates << prop
    ['GRUG_JAVA8', 'JAVA_HOME_8_X64', 'JAVA_HOME_8', 'JAVA8_HOME', 'JDK8_HOME'].each { key ->
        def value = System.getenv(key)
        if (value) candidates << value
    }
    candidates.addAll([
        '/usr/lib/jvm/java-8-openjdk',
        '/usr/lib/jvm/java-8-openjdk-amd64',
        '/usr/lib/jvm/temurin-8-jdk-amd64',
        '/usr/lib/jvm/zulu-8',
        '/usr/lib/jvm/zulu8',
    ])
    for (candidate in candidates) {
        def exe = new File(candidate, windows ? 'bin/java.exe' : 'bin/java')
        if (!exe.canExecute()) continue
        def release = new File(candidate, 'release')
        if (release.isFile()) {
            def text = release.text
            if (!(text.contains('JAVA_VERSION="1.8') || text.contains('JAVA_VERSION="8'))) continue
        }
        return exe.absolutePath
    }
    return null
}

// The JaCoCo agent's arguments for the game JVM. gradle/jacoco-loader.gradle attaches the agent to
// the other loaders' runClient and runServer tasks, which are JavaExecs; this loader launches the
// game itself on Java 8 (Exec tasks), so the same arguments go on the command line it builds. Only
// CI records: a plain local run stays uninstrumented. The agent writes nothing itself
// (output=none): run-loader.sh terminates the game as soon as the tests pass, which can interrupt
// a shutdown-hook write, so GrugCoverage cuts the segments from inside the game, as it does for
// every loader. Instrumentation is limited to this project's classes, since instrumenting Minecraft
// would produce a huge exec for no benefit. Each run names its own directory: the dedicated server's
// segments go to jacoco-server rather than over the client's (#1027).
//
// The classes this project puts in the game's own package have to be named one by one, because the
// agent's include list also covers the game's dev classes in that package. The srg reobfuscates
// net/minecraft/src into the default package, so every source file there is one; the list is taken
// from the tree rather than written out, so a loader copied from this one instruments every such
// class it has instead of silently reporting them all as missed.
def defaultPackageClassNames = {
    def sourceDir = new File(projectDir, 'src/main/java/net/minecraft/src')
    def names = []
    if (sourceDir.isDirectory()) {
        sourceDir.eachFile { file ->
            if (file.isFile() && file.name.endsWith('.java')) {
                names << file.name.substring(0, file.name.length() - '.java'.length())
            }
        }
    }
    return names
}

def jacocoLaunchArgs = { String directoryName ->
    if (System.getenv('GRUG_CI') != 'true') {
        return []
    }
    def execDir = new File(buildDirFile, directoryName)
    // Start clean, so a segment of an earlier run cannot be combined with this one's.
    project.delete(execDir)
    def agent = project.configurations.grugJacocoAgent.singleFile
    return [
        "-Dgrug.coverage.dir=${execDir.absolutePath}",
        "-javaagent:${agent}=output=none,dumponexit=false," +
            'includes=' + (['net.grug.*'] + defaultPackageClassNames()).join(':'),
    ]
}

// The java command that boots the pack-style runtime in gameDir with the given libraries.
def launchCommand = { Iterable<File> libraries, File gameDir, File assets, boolean recordCoverage ->
    def java8 = findJava8()
    if (java8 == null) {
        throw new GradleException(
            'Java 8 is required to launch 1.2.5. Install it or set GRUG_JAVA8 / -Pgrug.java8.')
    }

    def classpath = []
    classpath.addAll(libraries.collect { it.absolutePath })
    classpath << mcpResources.absolutePath
    classpath << runtimeJar.absolutePath
    classpath << mcpMinecraftJar.absolutePath

    def command = []
    // CI wraps the whole job in xvfb-run, which sets DISPLAY; only add one for a bare local run.
    if (!windows && !System.getenv('DISPLAY')) {
        command += ['xvfb-run', '-a', '-s',
            '-screen 0 1280x720x24 +extension RANDR +extension GLX']
    }
    command += [java8,
        "-Djava.library.path=${nativesDir.absolutePath}",
        '-Djava.util.Arrays.useLegacyMergeSort=true',
        // launchwrapper 1.5 stores --gameDir in Minecraft's static directory field only in main's
        // epilogue, after the game thread may already have read it, so the client can resolve the
        // platform default directory instead. GameDir patches that read to prefer this property,
        // which names the same directory as --gameDir below (#1184).
        "-Dgrug.gameDir=${gameDir.absolutePath}"]
    if (recordCoverage) {
        command += jacocoLaunchArgs('jacoco')
    }
    command += ['-cp', classpath.join(File.pathSeparator),
        'net.minecraft.launchwrapper.Launch',
        '--username', 'Player',
        '--session', '0',
        '--gameDir', gameDir.absolutePath,
        '--assetsDir', assets.absolutePath]
    return command
}

tasks.register('runClient', Exec) {
    description = 'Launches the reobfuscated loader in a pack-style 1.2.5 runtime on Java 8.'
    dependsOn 'prepareRunDir', 'obfuscateRuntime', 'extractNatives', 'coverageClasses'
    workingDir = runDir
    // GRUG_CI comes from the environment: run-loader.sh exports it, so CI runs the tests while a
    // plain runClient just launches the game to play. A reference run points GRUG_MODS_DIR at a
    // harness-only directory so no grug port loads; a normal dev run uses the repository's mods.
    environment 'GRUG_MODS_DIR', System.getenv('GRUG_MODS_DIR') ?: modsDir.absolutePath
    doFirst {
        def assetsDir = System.getenv('GRUG_ASSETS_DIR')
        def assets = (assetsDir != null && !assetsDir.isEmpty())
            ? new File(assetsDir)
            : new File(runDir, 'assets')
        commandLine launchCommand(configurations.runtimeLibs.files, runDir, assets, true)
    }
}

// Boots the universal jar the way an installed game would: only the game's own libraries on the
// classpath, the jar alone in <game dir>/mods, and no GRUG_MODS_DIR, so grug has to find, extract
// and load its bundled mods from inside the jar. launch-production.sh puts the jar in place.
tasks.register('runProduction', Exec) {
    description = 'Launches the universal jar alone in a pack-style 1.2.5 instance on Java 8.'
    dependsOn 'obfuscateRuntime', 'extractNatives'
    doFirst {
        def gameDirProperty = findProperty('grug.productionGameDir')
        if (!gameDirProperty) {
            throw new GradleException('runProduction needs -Pgrug.productionGameDir=<game dir>.')
        }
        def gameDir = file(gameDirProperty)
        def assets = new File(gameDir, 'assets')
        assets.mkdirs()
        workingDir = gameDir
        commandLine launchCommand(configurations.gameLibs.files, gameDir, assets, false)
    }
}

// -- The dedicated server (#166) ------------------------------------------------------------------
//
// The pinned snapshot holds a compiled client but no server: it ships only server.srg, server.exc
// and the Forge/FML server patches. Rather than decompile and recompile the whole server, the
// vanilla server jar is taken as it is and brought to the same state the client is in, in four steps:
//
//   1. fetch Mojang's 1.2.5 server jar (pinned by SHA-1) and rename it to searge names with
//      server.srg (serverSeargeJar);
//   2. hook FML into it with tools/PatchServer.java, which inserts the calls FML's source patches
//      add (patchServerJar), and compile FML's own server sources against it (compileFmlServer);
//   3. rename the result back to notch names with the inverse of server.srg (serverRuntimeJar), which
//      is the jar a player's server would run;
//   4. rename the loader's classes, compiled once against the client's development names, to the
//      server's notch names with a dev -> notch srg built from server.srg (serverReobfSrg,
//      reobfServerJar), after FixInherited has read the server's hierarchy (serverDevClasses).
//
// Client and server notch names differ in 1.2.5, so the loader jar the server loads is a second
// reobfuscation of the same classes, not the client's jar.

def serverBuildDir = new File(buildDirFile, 'server')
def serverVanillaJar = new File(serverBuildDir, 'minecraft_server.jar')
def serverSeargeJar = new File(serverBuildDir, 'server-searge.jar')
def serverPatchedJar = new File(serverBuildDir, 'server-searge-fml-hooked.jar')
def fmlServerClasses = new File(serverBuildDir, 'fml-classes')
def serverFmlSeargeJar = new File(serverBuildDir, 'server-fml-searge.jar')
def serverRuntimeJar = new File(serverBuildDir, 'server-runtime.jar')
def serverReobfSrgFile = new File(serverBuildDir, 'reobf-server.srg')
def serverDevJar = new File(serverBuildDir, 'server-dev.jar')
def serverDevClasses = new File(serverBuildDir, 'server-dev-classes')
def serverFixedJar = new File(serverBuildDir, 'grug-1.2.5-forge-server-fixed.jar')
def serverLoaderJar = new File(buildDirFile, 'grug-1.2.5-forge-server.jar')
def serverLoaderClasses = new File(serverBuildDir, 'loader-server-classes')
def serverLoaderDevJar = new File(serverBuildDir, 'grug-1.2.5-forge-server-dev.jar')
def patchServerToolClasses = new File(buildDirFile, 'tools/patch-server')
def serverRunDir = new File(projectDirFile, 'run-server')
def fmlServerSources = new File(mcpDir, 'forge/fml/src/minecraft_server')

// Mojang's own download for 1.2.5, from the version's JSON (piston-meta.mojang.com/v1/packages/
// 5158765caf1ca14958cb6c45d52c8e09ed9b046c/1.2.5.json).
def SERVER_JAR_URL =
    'https://launcher.mojang.com/v1/objects/d8321edc9470e56b8ad5c67bbd16beba25843336/server.jar'
def SERVER_JAR_SHA1 = 'd8321edc9470e56b8ad5c67bbd16beba25843336'

tasks.register('fetchServerJar') {
    description = 'Downloads Mojang\'s 1.2.5 server jar and checks its SHA-1.'
    outputs.file serverVanillaJar
    doLast {
        serverVanillaJar.parentFile.mkdirs()
        def partial = new File(serverBuildDir, 'minecraft_server.jar.part')
        try {
            def connection = new URL(SERVER_JAR_URL).openConnection()
            connection.connectTimeout = 30000
            connection.readTimeout = 60000
            connection.inputStream.withStream { input ->
                partial.withOutputStream { out -> out << input }
            }
            def digest = java.security.MessageDigest.getInstance('SHA-1')
            partial.eachByte(8192) { buffer, length -> digest.update(buffer, 0, length) }
            def actual = digest.digest().encodeHex().toString()
            if (actual != SERVER_JAR_SHA1) {
                throw new GradleException("The 1.2.5 server jar has SHA-1 ${actual}, not ${SERVER_JAR_SHA1}.")
            }
        } catch (Throwable t) {
            partial.delete()
            throw t
        }
        partial.renameTo(serverVanillaJar)
    }
}

// SpecialSource over a jar: notch -> searge by default, the other way with reverse.
def specialSource = { File inJar, File outJar, File srg, boolean reverse ->
    def command = ['java', '-jar', configurations.specialSourceTool.singleFile.absolutePath,
        '--in-jar', inJar.absolutePath, '--out-jar', outJar.absolutePath, '--srg-in', srg.absolutePath]
    if (reverse) command << '--reverse'
    def process = new ProcessBuilder(command).redirectErrorStream(true).start()
    def output = process.inputStream.getText('UTF-8')
    if (process.waitFor() != 0) {
        throw new GradleException("SpecialSource failed on ${inJar.name}:\n${output}")
    }
}

tasks.register('serverSeargeJar') {
    description = 'Renames the vanilla server jar to searge names with server.srg.'
    dependsOn 'fetchMcpSnapshot', 'fetchServerJar'
    inputs.file serverVanillaJar
    inputs.file new File(mcpDir, 'conf/server.srg')
    outputs.file serverSeargeJar
    doLast {
        specialSource(serverVanillaJar, serverSeargeJar, new File(mcpDir, 'conf/server.srg'), false)
    }
}

tasks.register('compilePatchServerTool', JavaCompile) {
    description = 'Compiles tools/PatchServer.java.'
    source = fileTree(toolsDir) { include 'PatchServer.java' }
    classpath = configurations.fogPatchTool
    destinationDirectory.set(patchServerToolClasses)
    options.release = 8
    options.encoding = 'UTF-8'
}

tasks.register('patchServerJar', JavaExec) {
    description = 'Inserts the FML hooks and the methods FML\'s patches add into the server jar.'
    dependsOn 'serverSeargeJar', 'compilePatchServerTool'
    inputs.file serverSeargeJar
    outputs.file serverPatchedJar
    classpath = files(patchServerToolClasses) + configurations.fogPatchTool
    mainClass.set('PatchServer')
    doFirst {
        args = [serverSeargeJar.absolutePath, serverPatchedJar.absolutePath]
    }
}

tasks.register('compileFmlServer', JavaCompile) {
    description = 'Compiles FML\'s server sources against the hooked server jar.'
    dependsOn 'patchServerJar'
    source = fileTree(fmlServerSources) { include '**/*.java' }
    classpath = files(serverPatchedJar)
    destinationDirectory.set(fmlServerClasses)
    options.release = 8
    options.encoding = 'UTF-8'
    options.compilerArgs << '-nowarn'
}

tasks.register('serverFmlSeargeJar', Jar) {
    description = 'Packs the hooked server and FML into one searge-named jar.'
    dependsOn 'compileFmlServer'
    archiveFileName = serverFmlSeargeJar.name
    destinationDirectory.set(serverBuildDir)
    from({ zipTree(serverPatchedJar) }) { exclude 'META-INF/**' }
    from fmlServerClasses
    from(fmlServerSources) { include 'fmlversion.properties' }
}

tasks.register('serverRuntimeJar') {
    description = 'Renames the server with FML back to notch names, the jar a server would run.'
    dependsOn 'serverFmlSeargeJar'
    inputs.file serverFmlSeargeJar
    outputs.file serverRuntimeJar
    doLast {
        specialSource(serverFmlSeargeJar, serverRuntimeJar, new File(mcpDir, 'conf/server.srg'), true)
    }
}

tasks.register('serverReobfSrg', Exec) {
    description = 'Builds the dev -> server notch srg from the MCP server mapping.'
    dependsOn 'fetchMcpSnapshot'
    inputs.file new File(mcpDir, 'conf/server.srg')
    inputs.file new File(mcpDir, 'conf/fields.csv')
    inputs.file new File(mcpDir, 'conf/methods.csv')
    inputs.file new File(toolsDir, 'invert_srg.py')
    outputs.file serverReobfSrgFile
    doFirst {
        serverReobfSrgFile.parentFile.mkdirs()
        commandLine pythonCommand, new File(toolsDir, 'invert_srg.py').absolutePath,
            new File(mcpDir, 'conf/server.srg').absolutePath,
            new File(mcpDir, 'conf/fields.csv').absolutePath,
            new File(mcpDir, 'conf/methods.csv').absolutePath,
            serverReobfSrgFile.absolutePath, 'server'
    }
}

// The vanilla server in the development names the loader is compiled against, for FixInherited to
// read the hierarchy from.
tasks.register('serverDevJar') {
    description = 'Renames the vanilla server jar to development names.'
    dependsOn 'serverReobfSrg', 'fetchServerJar'
    inputs.file serverVanillaJar
    inputs.file serverReobfSrgFile
    outputs.file serverDevJar
    doLast {
        specialSource(serverVanillaJar, serverDevJar, serverReobfSrgFile, true)
    }
}

tasks.register('serverDevClasses', Sync) {
    description = 'Unpacks the development-named server for FixInherited.'
    dependsOn 'serverDevJar'
    from { zipTree(serverDevJar) }
    into serverDevClasses
}

// The classes only a server loads (src/server/java) name types the client's development classes lack
// (MinecraftServer, EntityPlayerMP), so they compile against the server in the same development
// names, ahead of the client's classes, and join the loader only in the server's jar.
tasks.register('compileServerJava', JavaCompile) {
    description = 'Compiles the server-only classes against the development-named server.'
    dependsOn 'compileJava', 'serverDevJar', 'compileFmlServer'
    source = fileTree(new File(projectDirFile, 'src/server/java')) { include '**/*.java' }
    classpath = files(serverDevJar, fmlServerClasses) +
        files(sourceSets.main.output.classesDirs) + configurations.compileClasspath
    destinationDirectory.set(serverLoaderClasses)
    options.release = 8
    options.encoding = 'UTF-8'
}

tasks.register('packServerLoaderDev', Jar) {
    description = 'The loader and its server-only classes, in the development names.'
    dependsOn tasks.named('jar'), 'compileServerJava'
    archiveFileName = serverLoaderDevJar.name
    destinationDirectory.set(serverLoaderDevJar.parentFile)
    from({ zipTree(devJar) })
    from(serverLoaderClasses)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('fixInheritedServerJar', JavaExec) {
    description = 'Rewrites inherited member references against the server\'s hierarchy.'
    dependsOn 'packServerLoaderDev', 'compileFixInheritedTool', 'serverReobfSrg', 'serverDevClasses'
    inputs.file serverLoaderDevJar
    inputs.file serverReobfSrgFile
    outputs.file serverFixedJar
    classpath = files(fixToolClasses) + configurations.fixInheritedTool
    mainClass.set('FixInherited')
    doFirst {
        serverFixedJar.parentFile.mkdirs()
        args = [serverLoaderDevJar.absolutePath, serverDevClasses.absolutePath, serverReobfSrgFile.absolutePath,
            serverFixedJar.absolutePath]
    }
}

tasks.register('reobfServerJar') {
    description = 'Reobfuscates the loader with the server\'s names.'
    dependsOn 'fixInheritedServerJar'
    inputs.file serverFixedJar
    inputs.file serverReobfSrgFile
    outputs.file serverLoaderJar
    doLast {
        specialSource(serverFixedJar, serverLoaderJar, serverReobfSrgFile, false)
    }
}

tasks.register('runServer', Exec) {
    description = 'Boots a Forge 1.2.5 dedicated server with the loader in its mods folder, on Java 8.'
    dependsOn 'serverRuntimeJar', 'reobfServerJar'
    workingDir = serverRunDir
    environment 'GRUG_MODS_DIR', System.getenv('GRUG_MODS_DIR') ?: modsDir.absolutePath
    doFirst {
        def java8 = findJava8()
        if (java8 == null) {
            throw new GradleException(
                'Java 8 is required to run 1.2.5. Install it or set GRUG_JAVA8 / -Pgrug.java8.')
        }
        // ModLoader loads mod_ classes from jars in mods/ and has no dependency mechanism, so the
        // libraries the loader leans on are on the class path, as they are for the client.
        def runModsDir = new File(serverRunDir, 'mods')
        delete runModsDir
        runModsDir.mkdirs()
        copy {
            from serverLoaderJar
            into runModsDir
        }
        def classpath = []
        classpath.addAll(configurations.runtimeLibs.files.collect { it.absolutePath })
        classpath << serverRuntimeJar.absolutePath
        def command = [java8, '-Djava.util.Arrays.useLegacyMergeSort=true']
        // The dedicated server records beside the client rather than over it (#1027): two JVMs
        // cutting their segments into one directory would overwrite each other's files.
        command += jacocoLaunchArgs('jacoco-server')
        command += ['-cp', classpath.join(File.pathSeparator),
            'net.minecraft.server.MinecraftServer', 'nogui']
        commandLine(command)
    }
}
