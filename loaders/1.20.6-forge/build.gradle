plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    // Both pinned to the version that was being selected anyway, so nothing changes except that the
    // answer stops depending on what the repository serves today. A range or a `+` is a selector, not
    // a version: Gradle has to ask the repository what matches now on every configuration, because the
    // answer is allowed to change. That was 28 of this loader's 63 second Build step. See #191.
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.38'
}

apply from: '../../gradle/jacoco-loader.gradle'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

tasks.withType(JavaExec) {
    enableAssertions = true
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    reobf = false
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            // The multiplayer CI job (#167) joins a dedicated server at this address on launch,
            // through the game's own quick play, instead of opening a world.
            if (System.getenv('GRUG_CI_CONNECT')) {
                args '--quickPlayMultiplayer', System.getenv('GRUG_CI_CONNECT')
            }
        }

        server {
            // Its own game directory, so a server and a client running at once (the multiplayer CI
            // job, #167) do not share a log, a config or a world. run-server sits where run does,
            // so the development mods directory ../../../mods resolves the same way.
            workingDirectory project.file('run-server')
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':core')

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    // Named after the loader rather than plain grug.mixins.json: this layer sits at the universal
    // jar's root, where a Fabric layer's mixin config of the same name would resolve to this one.
    add sourceSets.main, 'grug-1.20.6-forge.refmap.json'
    config 'grug-1.20.6-forge.mixins.json'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // CI compiles from a fresh checkout, so incremental compilation has no previous output to be
    // incremental against and still snapshots its whole compile classpath: 4.2 s for the Minecraft
    // jar alone. A local build keeps it, where the previous output is still there. See #702.
    if (System.getenv('GRUG_CI') == 'true') {
        options.incremental = false
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

// This loader's layer of the universal jar, which sits at its root beside core: Forge reads
// META-INF/mods.toml from a jar's root and resolves no dependencies of a mod jar it is not told
// about. Copied to build/layer/ so every loader's layer is found at the same path.
tasks.register('layerJar', Jar) {
    from(zipTree(tasks.named('jar').flatMap { it.archiveFile })) {
        exclude 'META-INF/MANIFEST.MF'
        // The root holds one mods.toml for every Forge version, which universal_jar.py writes
        // without version ranges, and core's GrugForgeMod is the jar's only @Mod (#493). This
        // layer's own are for its development run.
        exclude 'META-INF/mods.toml'
        exclude 'net/grug/minecraft/forge/GrugForgeDevMod.class'
    }
    // A development run passes the mixin config on the command line; an installed game only finds
    // it through the manifest, which the universal jar takes from this layer.
    manifest.attributes('MixinConfigs': 'grug-1.20.6-forge.mixins.json')
    archiveFileName = "grug-${project.projectDir.name}.jar"
    destinationDirectory = layout.buildDirectory.dir('layer')
}
