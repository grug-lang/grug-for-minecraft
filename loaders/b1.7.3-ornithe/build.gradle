plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom-remap' version '1.17.20'
    id 'ploceus' version '1.17.7'
}

apply from: '../../gradle/jacoco-loader.gradle'

// The hand-off from core: the repository this resolves it from and the version it asks for both come
// from gradle/grug-core.gradle, which core publishes under too.
apply from: '../../gradle/grug-core.gradle'

base {
    archivesName = project.properties["archives_base_name"]
}

version = project.properties["mod_version"]
group = project.properties["maven_group"]

loom {
}

ploceus {
    setIntermediaryGeneration(2)
}

// Sources and resources shared by all Ornithe loaders. They reference Minecraft
// classes, so they are compiled against this loader's own Minecraft jar.
sourceSets {
    main {
        java {
            srcDir '../../shared/ornithe/src/main/java'
        }
        resources {
            srcDir '../../shared/ornithe/src/main/resources'
        }
    }
}

repositories {
    // The only place net.grug is looked up: without this Gradle asks every other repository for
    // grug-core too, and a rate limit from one of them (#433) fails a build that has the jar.
    exclusiveContent {
        forRepository {
            maven {
                name = 'grugBuild'
                url = grugCoreRepository.toURI()
            }
        }
        filter {
            includeGroup 'net.grug'
        }
    }

    maven {
        name = 'Ornithe Releases'
        url = 'https://maven.ornithemc.net/releases'
    }

    maven {
        name = 'Ornithe Snapshots'
        url = 'https://maven.ornithemc.net/snapshots'
    }
}

dependencies {
    implementation "net.grug:grug-core:$grugCoreVersion"
    // The release jar, with gson relocated inside it. See productionJar.
    include "net.grug:grug-core:$grugCoreVersion:release"

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    clientExceptions ploceus.raven(project.client_raven_build, 'client')
    serverExceptions ploceus.raven(project.server_raven_build, 'server')
    clientSignatures ploceus.sparrow(project.client_sparrow_build, 'client')
    serverSignatures ploceus.sparrow(project.server_sparrow_build, 'server')
    clientNests ploceus.nests(project.client_nests_build, 'client')
    serverNests ploceus.nests(project.server_nests_build, 'server')
    mappings ploceus.featherMappings(project.feather_build)

    ploceus.dependOsl(project.osl_version)
    // OSL is a set of mods the game needs at runtime, so the jar a player installs nests every module
    // this version uses, and nobody has to install OSL beside it. Fabric Loader keeps the newer copy
    // when a player has OSL installed as well.
    ploceus.dependOsl('include', project.osl_version, net.ornithemc.ploceus.api.GameSide.MERGED)
}

tasks.withType(ProcessResources) {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // A player of this layer may run Java 8. For the vanilla launcher, Ornithe's installer writes
    // Ornithe's own game profile, which asks for Java 8 ("javaVersion": jre-legacy, major version
    // 8), and a loader profile that inherits from it without naming a Java of its own. Its Prism
    // instances accept Java 8 through 25. Java 8 bytecode loads on every one of them, and Java 17
    // bytecode would not load on Java 8. `--release` also pins the API to Java 8.
    options.release = 8
}

// The jar a player installs, which nests core's release jar: gson comes relocated inside it, because
// this version of the game ships none. Copied to build/production/ so every loader's production jar
// is found at the same path.
tasks.register('productionJar', Copy) {
    from remapJar
    into layout.buildDirectory.dir('production')
    rename { "grug-${project.projectDir.name}.jar" }
}
